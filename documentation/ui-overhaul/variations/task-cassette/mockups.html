<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Task-driven in Yard Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@600&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&family=VT323&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0c; }
  svg { display: block; margin-bottom: 8px; }
  .legend { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .crt { font-family: 'IBM Plex Mono', monospace; }
  .vt { font-family: 'VT323', monospace; }
  .drum { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }
  .dymo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
  .paper { font-family: 'Special Elite', monospace; }
  .stencil { font-family: 'Big Shoulders Stencil Display', sans-serif; font-weight: 800; }
  .ooc { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<!-- Task-driven functional design (its round 8) built in Yard Standard, round 2. 1280 x 800 UI units. -->
<svg id="01-helm-rest" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="02-gunnery-combat" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="03-deck-damage" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="04-docked-terminal" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="05-map-late-plan" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="06-crisis" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="07-flight-modes" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="08-ships-book" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="09-relations" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../cassette/kit.js"></script>
<script>
// =====================================================================
// The fit. The task design changes the whole HUD with the post, so the hardware does too: every post
// has its own set of instruments (its "fit"), and the ship's repeaters (time, the annunciator, the
// alert visor, the incoming rack, the key sill) are the same objects at every post, in the same place.
// Every unit is set into the screen's edge on the side its zone belongs to, or stands on the key sill
// that runs along the bottom: nothing floats.
// Helm fit: Yard Standard beige with the orange stripe. Weapons fit: gunmetal, red stripe, rivets.
// The captain's own kit (deck): avocado, the life-support colour.
// =====================================================================
const FIN = {
  yard: { face: 'url(#enamelG)', hi: '#F4EEDD', lo: '#7d735e', ink: C.ink, dim: '#857a68', stripe: C.orange, fix: 'screw' },
  gun:  { face: 'url(#gunG)', hi: '#949BA0', lo: '#3B4145', ink: C.inkLight, dim: '#b3b8bb', stripe: C.red, fix: 'rivet' },
  avo:  { face: 'url(#avoG)', hi: '#9aa46c', lo: '#454c2c', ink: C.inkLight, dim: '#c9cdb0', stripe: null, fix: 'screw' },
  tpa:  { face: 'url(#tpaG)', hi: '#8c8f7c', lo: '#3c3f33', ink: C.inkLight, dim: '#bdbfac', stripe: C.red, fix: 'rivet' },
};
const XDEFS = `<defs>
  <linearGradient id="gunG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#737B81"/><stop offset="1" stop-color="#5B6368"/></linearGradient>
  <linearGradient id="tpaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#686C5A"/><stop offset="1" stop-color="#55594A"/></linearGradient>
  <filter id="caseshadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/></filter>
  <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="thinair" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#bcd6ff"/></pattern>
  <pattern id="redhatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="5" fill="${PH.red}"/></pattern>
  <pattern id="crates" width="27" height="27" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="24" height="24" rx="1.5" fill="#3a3830" stroke="#23221d" stroke-width="1.5"/><path d="M1.5 1.5L25.5 25.5M25.5 1.5L1.5 25.5" stroke="#2c2a24" stroke-width="1.2"/></pattern>
  <radialGradient id="fireG" cx="0.5" cy="0.6" r="0.6"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ff7a2a"/><stop offset="1" stop-color="#c8361c" stop-opacity="0"/></radialGradient>
  <radialGradient id="smokeG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8d8a84" stop-opacity="0.45"/><stop offset="1" stop-color="#8d8a84" stop-opacity="0"/></radialGradient>
  <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EBD9"/><stop offset="1" stop-color="#E4DBC6"/></linearGradient>
</defs>`;
// Lamps sit in a dark bezel ring, so a lit white lens reads as lit on beige enamel too
const kitLampG = lampG;
lampG = (cx, cy, r, color, lit) => `<circle cx="${cx}" cy="${cy}" r="${r + 2.9}" fill="#2b2723"/>` + kitLampG(cx, cy, r, color, lit);
const SILL_Y = 762;
// The "home" bug: a house-shaped index in ink under a delta-v scale. Never a triangle,
// which is the caution glyph.
const homeBugD = (x, y) => `M${x} ${y}l5 4.2v6h-10v-6z`;
const homeBugG = (x, y) => `<path d="${homeBugD(x, y)}" fill="#2a2420" stroke="#F3EEE2" stroke-width="0.6"/>`;
// The kit's edgewise meter draws every bug as a triangle; a home bug is drawn here instead.
const kitHmeterG = hmeterG;
hmeterG = (x, y, w, o = {}) => {
  const bugs = o.bugs || [], min = o.min ?? 0, max = o.max ?? 100, h = o.h ?? 16;
  let s = kitHmeterG(x, y, w, { ...o, bugs: bugs.filter(b => !b.home) });
  for (const b of bugs.filter(b => b.home)) s += homeBugG(x + (Math.max(min, Math.min(max, b.v)) - min) / (max - min) * w, y + h + 3);
  return s;
};                      // the key sill's top edge: every unit stands on it
const lw = t => t.length * 6.7;          // width of a 12-unit legend
const fit = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;   // long names are cut, never wrapped
const pen = (fin) => (x, y, t, o = {}) => tag(x, y, t, { fill: FIN[fin].ink, ...o });
function rivetG(x, y) { return `<circle cx="${x}" cy="${y}" r="2.4" fill="url(#screwG)" stroke="#4b4842" stroke-width="0.5"/><circle cx="${x - 0.7}" cy="${y - 0.8}" r="0.8" fill="#fff" opacity="0.5"/>`; }
function faceG(x, y, w, h, { fin = 'yard', r = 3, fix = false } = {}) {
  const F = FIN[fin];
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${F.face}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${F.face}" filter="url(#grain)"/>
  <path d="M${x + r} ${y + 0.7}H${x + w - r}" stroke="${F.hi}" stroke-width="1.2" opacity="0.9"/>
  <path d="M${x + r} ${y + h - 0.7}H${x + w - r}M${x + w - 0.7} ${y + r}V${y + h - r}" stroke="${F.lo}" stroke-width="1.1" opacity="0.8"/>`;
  if (fix) [[x + 6, y + 6], [x + w - 6, y + 6], [x + 6, y + h - 6], [x + w - 6, y + h - 6]].forEach(([a, b]) => s += F.fix === 'rivet' ? rivetG(a, b) : screwG(a, b));
  return s;
}
// A unit set into the screen edge: a chassis housing that runs off screen (or under the key sill) on
// the attached sides, the identity stripe on the edge that faces the view, and a faceplate.
function unitG(x, y, w, h, { attach = '', fin = 'yard', stripe = true, fix = false } = {}) {
  const T = attach.includes('t'), B = attach.includes('b'), L = attach.includes('l'), R = attach.includes('r'), ex = 14;
  const bx = L ? x - ex : x, by = T ? y - ex : y, bw = w + (L ? ex : 0) + (R ? ex : 0), bh = h + (T ? ex : 0) + (B ? ex : 0);
  let s = `<g filter="url(#caseshadow)"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="7" fill="url(#chassisG)"/></g>`;
  const F = FIN[fin];
  if (stripe && F.stripe) {
    const sx = x + (L ? 0 : 7), sw = w - (L ? 0 : 7) - (R ? 0 : 7), sy = y + 7, sh = h - 14;
    if (T && !B) s += `<rect x="${sx}" y="${y + h - 2.8}" width="${sw}" height="2.4" fill="${F.stripe}"/>`;
    else if (B && !T && !L && !R) s += `<rect x="${sx}" y="${y + 0.4}" width="${sw}" height="2.4" fill="${F.stripe}"/>`;
    else if (L && !R) s += `<rect x="${x + w - 2.8}" y="${sy}" width="2.4" height="${sh}" fill="${F.stripe}"/>`;
    else if (R && !L) s += `<rect x="${x + 0.4}" y="${sy}" width="2.4" height="${sh}" fill="${F.stripe}"/>`;
  }
  const fx = x + (L ? 3 : 5), fy = y + (T ? 3 : 5), fw = w - (L ? 3 : 5) - (R ? 3 : 5), fh = h - (T ? 3 : 5) - (B ? 3 : 5);
  s += faceG(fx, fy, fw, fh, { fin, fix });
  return { s, fx, fy, fw, fh };
}
// Push-lights. An ACTION's legend is printed bright on the smoked lens, so an order that can be given reads
// as available while unlit; one that can't be given takes the barber flag along its lens, with its reason
// beside it. An INDICATOR (a state: lenses, lamps) keeps its legend faint while unlit: the dark cockpit.
pushG = (x, y, w, h, lines, { color = 'green', lit = false, flag = false, na = false, ind = false } = {}) => {
  const [on, off] = LAMP[color];
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="${C.alu}"/><rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="2" fill="#4f4c46"/>`;
  if (lit) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)" opacity="0.85"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${lit ? on : ind ? off : '#3b3834'}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  const tc = lit ? '#2a1606' : ind || na ? 'rgba(240,230,210,0.42)' : '#efe7d3';
  lines.forEach((t, i) => { s += `<text x="${x + w / 2}" y="${y + h / 2 + (i - (lines.length - 1) / 2) * 13 + 4.3 - (na ? 1.5 : 0)}" text-anchor="middle" class="legend" font-size="12" fill="${tc}">${esc(t)}</text>`; });
  if (flag) s += `<rect x="${x}" y="${y + h / 2 - 5}" width="${w}" height="10" fill="url(#barber)" opacity="0.95"/>`;
  if (na) s += `<rect x="${x}" y="${y + h - 4.5}" width="${w}" height="4.5" fill="url(#barber)"/>`;
  return s;
};
// Lens whose colour and glyph carry severity: an indicator, so its legend is faint while unlit
function lensG(x, y, w, h, text, { sev = null, color = null, lit = false, fresh = false } = {}) {
  const col = color || (sev === 'w' ? 'red' : sev === 'c' ? 'amber' : 'white');
  const lines = Array.isArray(text) ? text : [text];
  let s = pushG(x, y, w, h, lines, { color: col, lit, ind: true });
  if (lit && sev === 'w') s += `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" fill="${LAMP.red[0]}" filter="url(#lampglow)" opacity="0.45"/>` + pushG(x, y, w, h, lines, { color: col, lit, ind: true });
  if (fresh) s += `<rect x="${x - 5}" y="${y - 5}" width="${w + 10}" height="${h + 10}" rx="4" fill="none" stroke="${LAMP[col][0]}" stroke-width="2" opacity="0.8" filter="url(#lampglow)"/>`;
  return s;
}
// An advisory lamp: the white lamp lit softly. Normal but worth knowing; it never enters the band.
function softLensG(x, y, w, h, text) {
  return `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="${C.alu}"/><rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="2" fill="#4f4c46"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${LAMP.white[0]}" filter="url(#lampglow)" opacity="0.22"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#B9B2A1"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>
  <text x="${x + w / 2}" y="${y + h / 2 + 4.3}" text-anchor="middle" class="legend" font-size="12" fill="#2a2016">${esc(text)}</text>`;
}
// The instrument "OFF" flag: a striped tab that drops in front of something that is not working
function barberTabG(x, y, w = 10, h = 14) {
  return `<rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="2" fill="${C.alu}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#barber)"/>`;
}
function levelG(x, y, w, frac, { h = 10, zones = [] } = {}) {
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2" fill="${C.bakelite}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F2ECDC"/>`;
  for (const z of zones) s += `<rect x="${x + z.from * w}" y="${y + h - 3}" width="${(z.to - z.from) * w}" height="3" fill="${z.color}"/>`;
  for (let i = 0; i <= 10; i++) s += `<line x1="${x + w * i / 10}" y1="${y}" x2="${x + w * i / 10}" y2="${y + (i % 5 ? 3 : 6)}" stroke="${C.ink}" stroke-width="${i % 5 ? 0.7 : 1.2}"/>`;
  const px = x + Math.max(0, Math.min(1, frac)) * w;
  s += `<rect x="${x}" y="${y + h / 2 - 1.5}" width="${px - x}" height="3" fill="${C.ink}" opacity="0.75"/><path d="M${px} ${y + 1}V${y + h - 1}" stroke="${C.orange}" stroke-width="2.4"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  return s;
}
// Interlocked piano keys, one down: the tabs of a screen
function pianoG(x, y, labels, sel, { kw = 44, h = 22, gap = 3 } = {}) {
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${labels.length * (kw + gap) - gap + 6}" height="${h + 6}" rx="2.5" fill="${C.bakelite}"/>`;
  labels.forEach((l, i) => {
    const kx = x + i * (kw + gap), dn = i === sel;
    if (l === null) { s += `<rect x="${kx}" y="${y}" width="${kw}" height="${h - 2}" rx="2" fill="#8f8b82"/>${screwG(kx + 8, y + h / 2 - 1)}${screwG(kx + kw - 8, y + h / 2 - 1)}`; return; }
    s += `<g filter="url(#shadow)"><rect x="${kx}" y="${y + (dn ? 2 : 0)}" width="${kw}" height="${h - 2}" rx="2" fill="${dn ? '#cfc4a8' : '#ece4ce'}"/></g>`;
    if (dn) s += `<rect x="${kx}" y="${y + h - 4}" width="${kw}" height="3" fill="${C.orange}"/>`;
    s += `<text x="${kx + kw / 2}" y="${y + h / 2 + 4.5 + (dn ? 1.5 : 0)}" text-anchor="middle" class="legend" font-size="12" fill="${C.ink}">${esc(l)}</text>`;
  });
  return s;
}

// =====================================================================
// THE REPEATERS: the same objects at every post
// =====================================================================
// Z9: the key sill. The console's front edge runs the full width under every unit. The hint line is a long,
// low amber tube set into it: its words change with the post, so they can't be engraved. Keys are reversed
// boxes, as on the visor. A key the player has learned drops off; after 10 s without a change of context
// the beam dims. Screens cover it.
function keySillG(items, { fade = false } = {}) {
  const y = SILL_Y;
  let s = `<g filter="url(#caseshadow)"><rect x="-14" y="${y}" width="1308" height="52" rx="6" fill="url(#chassisG)"/></g><rect x="0" y="${y}" width="1280" height="4" fill="url(#lipG)"/>`;
  s += screwG(8, y + 22) + screwG(1272, y + 22);
  const wx = 20, wy = y + 11, ww = 1240, wh = 24;
  const t = tubeG(wx, wy, ww, wh, { r: 3, bezel: 3 });
  s += t.under;
  const c = fade ? 'dim' : 'amber';
  let xx = wx + 12;
  for (const it of items) {
    for (const k of it.k) { const kw = k.length * 7.8 + 8; s += tt(xx + 4, wy + 16.5, k, { rev: true, size: 13, w: kw, c }); xx += kw + 4; }
    xx += 4;
    s += tt(xx, wy + 16.5, it.t, { size: 13, c }); xx += it.t.length * 7.8 + 26;
  }
  return s + t.over;
}
// Z1 + Z4: the master repeater. The chronometer on top, the annunciator under it. Over a screen only
// the chronometer stays: the lamps' half is a separate unit and goes with the post.
const ANN_NAMES = ['HULL', 'FIRE', 'AIR', 'POWER', 'PROP', 'DRIVE', 'ARMS', 'CREW', 'EVA', 'SHIELD'];
// A lamp: null dark; 'a' advisory, lit softly; 'c' caution; 'w' warning; 'cn' or 'wn' new (blinking);
// 'none' a blanking plate where this ship has no such system (the corvette has no shield emitter)
function annTileG(x, y, w, h, name, st) {
  if (st === 'none') return `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="${C.alu}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#8f8b82"/>${screwG(x + 7, y + h / 2)}${screwG(x + w - 7, y + h / 2)}`;
  if (st === 'a') return softLensG(x, y, w, h, name);
  const lit = !!st, sev = st ? st[0] : null;
  return lensG(x, y, w, h, lit ? (sev === 'w' ? '◆\u2009' : '▲\u2009') + name : name, { sev, lit, fresh: !!st && st[1] === 'n' });
}
function masterG({ day = '003', time = '14:22:05', warp = '1X', rails = false, next = null, nextT = null, held = null, ann = {}, annOn = true, shld = false, line2 = true } = {}) {
  const U = unitG(0, 0, 300, annOn ? 122 : 64, { attach: 'tl' });
  let s = U.s;
  s += tag(12, 24.5, 'DAY') + drumG(42, 9, day, { cw: 12, ch: 18, size: 15 }) + drumG(90, 9, time, { cw: 12, ch: 18, size: 15, dimLead: false });
  s += tag(188, 24.5, 'WARP') + flapG(224, 10, warp.padEnd(6), { cw: 9.4, ch: 16, size: 13.5 });
  // line 2: the next stop and its countdown, or why warp is held (the reason replaces the next stop)
  if (held) s += lampG(16, 42, 4, 'amber', true) + tag(25, 46.5, 'HELD') + flapG(60, 34, held.padEnd(13).slice(0, 13), { cw: 8.4, ch: 16, size: 13 });
  else {
    const on = line2 && next;
    s += tag(12, 46.5, 'NEXT', { fill: line2 ? C.ink : '#a1967f' }) + flapG(46, 34, (on ? next : '').padEnd(12).slice(0, 12), { cw: 8.4, ch: 16, size: 13 });
    if (on && Array.isArray(nextT)) s += drumG(154, 33, nextT[0], { cw: 11, ch: 18, size: 15, dimLead: false }) + tag(168, 46.5, 'D') + drumG(178, 33, nextT[1], { cw: 11, ch: 18, size: 15, dimLead: false });
    else s += drumG(154, 33, on ? nextT : ' :  :  ', { cw: 11, ch: 18, size: 15, dimLead: false });
  }
  s += lampG(240, 42, 4, 'white', rails) + tag(249, 46.5, 'RAILS');
  if (annOn) {
    s += `<line x1="10" y1="58" x2="290" y2="58" stroke="#9f957c" stroke-width="1"/><line x1="10" y1="59" x2="290" y2="59" stroke="#f4eedd" stroke-width="0.8"/>`;
    ANN_NAMES.forEach((n, i) => { s += annTileG(12 + (i % 5) * 56, 65 + Math.floor(i / 5) * 26, 52, 22, n, n === 'SHIELD' && !shld ? 'none' : ann[n]); });
  }
  return s;
}
// Z4 under the annunciator, deck only: the captain's suit telemetry (the captain's own kit, avocado)
function perG({ health = 'LIGHT WOUND', suit = 'PRESSURE', air = '7:40', room = 'BRIDGE', roomAir = 'THIN' } = {}) {
  const U = unitG(0, 122, 300, 84, { attach: 'l', fin: 'avo' });
  const P = pen('avo');
  let s = U.s;
  s += P(12, 143.5, 'YOU') + `<line x1="40" y1="139" x2="56" y2="139" stroke="${C.inkLight}" stroke-width="1" opacity="0.5"/>`;
  s += P(64, 143.5, 'HEALTH', { fill: '#dfe3c8' }) + flapG(118, 131, health.padEnd(13).slice(0, 13), { cw: 8.4, ch: 16, size: 13 });
  s += P(64, 166.5, 'SUIT', { fill: '#dfe3c8' }) + flapG(118, 154, suit.padEnd(8).slice(0, 8), { cw: 8.4, ch: 16, size: 13 }) + P(194, 166.5, 'AIR', { fill: '#dfe3c8' }) + drumG(220, 153, air, { cw: 12, ch: 18, size: 15, dimLead: false }) + P(266, 166.5, 'LEFT', { fill: '#dfe3c8' });
  s += P(64, 189.5, 'HERE', { fill: '#dfe3c8' }) + flapG(118, 177, room.padEnd(11).slice(0, 11), { cw: 8.4, ch: 16, size: 13 }) + flapG(216, 177, roomAir.padEnd(8).slice(0, 8), { cw: 8.4, ch: 16, size: 13, fill: roomAir === 'BREATHABLE' ? '#F3EEE2' : '#FFC46B' });
  return s;
}
// Z2: the alert visor, 640 wide: Z2's own 320 to 960. Hinged at the top edge, it swings down while any
// alert stands and folds away when none does. Two tubes that keep their places, the warning over the
// cautions, each with its master lens; pressing either acknowledges the band. The caution tube has three
// fixed slots and a narrow fourth, etched on its faceplate and reserved for +n, so no caution moves or

  s += leadG(rx - 9, ry + 5);

  s += masterG({ held: 'FIRE ABOARD', ann: { FIRE: 'c', CREW: 'c' } });
  s += visorG({
    warn: { title: '◆ MISSILE   2 INBOUND   IMPACT 14 S', line: [{ k: 'F' }, { t: 'DECOY' }, { t: '      POINT DEFENSE ENGAGING', c: 'dim' }] },

  s += schG({ fin: 'gun', fire: [[5, 2], [6, 2], [5, 3], [6, 3]], crew: [[4.5, 2.5], [9.5, 4.5], [13.5, 1.6]], captain: [9.5, 3.5], hit: [16.5, 5.6] });
  s += hlmPodG({ x: 312, w: 380, who: 'BEA', order: 'HOLDING HEADING' });
  s += wpnG({
    mounts: [
      { at: 'NOSE', gun: 'COILGUN', who: 'HAND', state: 'READY', val: ['TOF', '1.1', 'S'] },
      { at: 'FWD PORT', gun: 'AUTOCAN', who: 'AUTO', state: 'ENGAGING', val: ['TRK', '2', ' '] },

      { at: 'AFT STBD', gun: 'LASER', who: 'HAND', state: 'OUT OF RANGE' },
      { at: 'AFT PORT', gun: 'HARPOON', who: 'HAND', state: 'READY', mag: ['3', '4'], lock: true }],
    decoy: true
  });
  s += snsG({ fin: 'gun', range: '5 KM', heading: 60, hostiles: 1, contacts: [{ k: 'hostile', b: 61, d: 0.64, s: 4, lock: true, threat: true }, { k: 'msl', b: 63, d: 0.6, dir: 150 }, { k: 'msl', b: 59, d: 0.59, dir: 140 }, { k: 'neutral', b: 250, d: 0.9, rot: 300 }] });
  s += keySillG([{ k: ['SPACE'], t: 'FIRE' }, { k: ['R'], t: 'MISSILE' }, { k: ['TAB'], t: 'NEXT TARGET' }, { k: ['V'], t: 'STAND UP' }, { k: ['F1'], t: 'CONTROLS' }]);

  const T = 54, ox = 127, oy = 238;
  const X = v => ox + v * T, Y = v => oy + (6 - v) * T;         // world y up: port is up

  // floor, tile grid, the carpet through the crew spaces

  { const [x, y, w, h] = R(9, 1, 6, 4); s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#2d2a2c"/>`; }
  s += `<g opacity="0.5">`;
  for (let i = 3; i <= 17; i++) s += `<line x1="${X(i)}" y1="${Y(5)}" x2="${X(i)}" y2="${Y(1)}" stroke="#343a3f" stroke-width="1"/>`;
  for (let j = 1; j <= 5; j++) s += `<line x1="${X(3)}" y1="${Y(j)}" x2="${X(17)}" y2="${Y(j)}" stroke="#343a3f" stroke-width="1"/>`;
  s += `</g>`;
  // the Bridge has thin air: the whole room, from the breach
  { const [x, y, w, h] = R(8, 1, 9, 4); s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#thinair)" opacity="0.15"/>`; }
  // the Hold: oxygen and nitrogen tanks, the pipe run, two 3 x 2 cargo bays
  [[3, 2], [3, 3]].forEach(([a, b]) => { const [x, y] = R(a, b, 1, 1); s += `<circle cx="${x + 27}" cy="${y + 27}" r="20" fill="#2f3a40" stroke="#151719" stroke-width="2"/><circle cx="${x + 27}" cy="${y + 27}" r="9" fill="#26302f"/>`; });
  s += `<path d="M${X(3.5)} ${Y(4.5)}H${X(4.5)}V${Y(1.5)}H${X(3.5)}" stroke="#4a4f53" stroke-width="5" fill="none"/>`;
  [[5, 1], [5, 3]].forEach(([a, b]) => { const [x, y, w, h] = R(a, b, 3, 2); s += `<rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" fill="url(#crates)" stroke="#151719" stroke-width="2"/>`; });
  // the wall between the rooms (x 7 | 8) and its door at y 3; the docking port in the port hull
  s += `<path d="M${X(8)} ${Y(5)}V${Y(4)}M${X(8)} ${Y(3)}V${Y(1)}" stroke="#101214" stroke-width="9"/><rect x="${X(8) - 4}" y="${Y(4)}" width="8" height="${T}" fill="#3a3f43"/><rect x="${X(8) - 2}" y="${Y(4) - 6}" width="4" height="4" fill="${LAMP.amber[0]}" filter="url(#lampglow)"/>`;
  { const [x, y, w, h] = R(7, 5, 1, 1); s += `<rect x="${x + 6}" y="${y + 18}" width="${w - 12}" height="${h - 18}" fill="#3b4044" stroke="#5a5f63" stroke-width="2"/>`; }
  // the Bridge: propellant tank, life support, weapons console, helm; turret mounts; two small bays;
  // the reactor forward; the escape pod's hatch in the starboard hull
  { const [x, y] = R(8, 1, 1, 1); s += `<circle cx="${x + 27}" cy="${y + 27}" r="19" fill="#3a3a33" stroke="#151719" stroke-width="2"/>`; }
  s += box(R(9, 1, 1, 1), '#2a3036') + `<rect x="${X(9) + 12}" y="${Y(2) + 14}" width="30" height="16" fill="#1d2b24"/>`;
  s += box(R(9, 3, 1, 1), '#2a3036') + `<rect x="${X(9) + 10}" y="${Y(4) + 12}" width="34" height="20" fill="#2b2418"/>`;
  s += box(R(9, 4, 1, 1), '#2a3036') + `<rect x="${X(9) + 14}" y="${Y(5) + 30}" width="26" height="18" rx="4" fill="#3a3e42"/>`;
  [[11, 1], [11, 4], [14, 1], [14, 4], [16, 2]].forEach(([a, b]) => { const [x, y] = R(a, b, 1, 1); s += `<circle cx="${x + 27}" cy="${y + 27}" r="17" fill="none" stroke="#3f454a" stroke-width="4"/><circle cx="${x + 27}" cy="${y + 27}" r="6" fill="#3f454a"/>`; });
  [[12, 4], [15, 1]].forEach(([a, b]) => s += `<rect x="${X(a) + 6}" y="${Y(b + 1) + 6}" width="42" height="42" fill="url(#crates)" stroke="#151719" stroke-width="2"/>`);
  { const [x, y, w, h] = R(15, 3, 2, 2); s += `<rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" rx="9" fill="#1f2326" stroke="#4b4f52" stroke-width="2"/><circle cx="${x + w / 2}" cy="${y + h / 2}" r="32" fill="#16191b" stroke="#3a3e41" stroke-width="2"/>`; }
  { const [x, y, w] = R(12, 0, 1, 1); s += `<rect x="${x + 6}" y="${y}" width="${w - 12}" height="22" fill="#3b4044" stroke="#5a5f63" stroke-width="2"/>`; }
  // painted room names: the naming rule's two rooms
  s += `<text x="${X(3) + 14}" y="${Y(1) - 12}" class="stencil" font-size="18" letter-spacing="1.5" fill="#4d5256">HOLD</text><text x="${X(10) + 6}" y="${Y(1) - 12}" class="stencil" font-size="18" letter-spacing="1.5" fill="#4d5256">BRIDGE</text>`;
  // the fire (medium) on the cargo, its smoke; Cole on it with an extinguisher
  [[5, 2], [6, 2], [5, 3], [6, 3]].forEach(([a, b]) => { const [x, y] = R(a, b, 1, 1); s += `<rect x="${x}" y="${y}" width="${T}" height="${T}" fill="#7a2a14" opacity="0.85"/><ellipse cx="${x + 27}" cy="${y + 24}" rx="30" ry="33" fill="url(#fireG)" opacity="0.95"/>`; });
  s += `<ellipse cx="${X(6)}" cy="${Y(3)}" rx="170" ry="120" fill="url(#smokeG)"/>`;
  const fig = (x, y, f = '#d9cfb4') => `<circle cx="${x}" cy="${y}" r="10" fill="${f}" stroke="#2a2420" stroke-width="1.5"/>`;
  s += `<path d="M${X(4.5) + 8} ${Y(2.5)}L${X(5.2)} ${Y(2.5) - 14}L${X(5.2)} ${Y(2.5) + 14}Z" fill="#e8eef2" opacity="0.35"/>` + fig(X(4.5), Y(2.5));
  // the conduit short along the Bridge floor (the run from x 11 to 14), Ada at the panel
  s += `<path d="M${X(11.5)} ${Y(2.5)}H${X(14.5)}" stroke="#3a3f2a" stroke-width="4"/>`;
  s += `<g filter="url(#glow)"><path d="M${X(13) - 8} ${Y(2.5) - 14}l8 10l-6 4l9 12" stroke="#ffe08a" stroke-width="2" fill="none"/><path d="M${X(13) + 12} ${Y(2.5) - 10}l-6 8l5 3l-7 10" stroke="#ffe08a" stroke-width="1.6" fill="none"/></g>`;
  s += fig(X(12.5), Y(3.2));
  // the breach, venting through the starboard hull at x 13, nobody on it
  { const [x, y] = R(13, 0, 1, 1); s += `<path d="M${x + 10} ${y}l8 12l7 -6l6 14l9 -8l4 -12Z" fill="#000"/><g opacity="0.4" stroke="#dfe8ee" stroke-width="2" fill="none"><path d="M${x + 22} ${y + 18}q-6 20 4 40"/><path d="M${x + 30} ${y + 16}q8 22 -2 44"/></g>`; }
  // Bea at the helm, seated; the captain in a pressure suit at the weapons console
  s += fig(X(9.5), Y(4.6));
  s += `<circle cx="${X(10.45)}" cy="${Y(3.5)}" r="11" fill="${C.orange}" stroke="#1a1614" stroke-width="2"/><circle cx="${X(10.45)}" cy="${Y(3.5)}" r="5" fill="#2b241f" opacity="0.6"/>`;
  // OVL deck set: each hazard outlined in its tiles, tagged with the progress of whoever works it, or nobody
  const tagG = (x, y, title, prog, who = null) => {
    let t = wtext(x, y, title, { size: 13 });
    if (prog != null) t += `<g filter="url(#glow)"><rect x="${x}" y="${y + 6}" width="92" height="7" fill="none" stroke="${PH.amber}" stroke-width="1"/><rect x="${x + 1.5}" y="${y + 7.5}" width="${89 * prog}" height="4" fill="${PH.amber}"/></g>`;
    if (who) t += wtext(x, y + 20, who, { c: 'red', size: 13 });
    return t;
  };
  s += `<g filter="url(#glow)" fill="none" stroke="${PH.red}" stroke-width="1.5"><rect x="${X(5)}" y="${Y(4)}" width="${2 * T}" height="${2 * T}"/></g>` + tagG(X(5), Y(4) - 22, 'FIRE (MEDIUM)', 0.55);
  s += `<g filter="url(#glow)" fill="none" stroke="${PH.red}" stroke-width="1.5" stroke-dasharray="6 4"><rect x="${X(12)}" y="${Y(3)}" width="${2 * T}" height="${T}"/></g>` + tagG(X(12), Y(2) + 18, 'CONDUIT SHORT', 0.7);
  s += `<g filter="url(#glow)" fill="none" stroke="${PH.red}" stroke-width="1.5"><rect x="${X(13)}" y="${Y(1)}" width="${T}" height="${T}"/></g>` + tagG(X(13) - 4, Y(0) + 22, 'BREACH, VENTING', null, 'NOBODY');
  // crew carry no names: the band names whoever works a hazard. Hover shows a name and job (the pointer is on Bea)
  { const hx = X(9.5) + 16, hy = Y(4.6) - 40;
    s += `<g filter="url(#glow)"><rect x="${hx}" y="${hy}" width="128" height="34" fill="#140f0a" fill-opacity="0.55" stroke="${PH.amber}" stroke-width="1"/><path d="M${X(9.5) + 8} ${Y(4.6) - 6}L${hx} ${hy + 34}" stroke="${PH.amber}" stroke-width="1"/></g>`;

    const px = X(9.5) + 2, py = Y(4.6) + 2;

  // INT: the prompt beside the console the captain stands at: its name once, then each key with its verb
  s += promptPlateG(X(10.2), Y(3) + 6, 'WEAPONS CONSOLE', [['V', 'SIT']]);
  return s;
}

const SCREEN_Y = 112;
function screenFrameG(fin) { return unitG(0, SCREEN_Y, 1280, 800 - SCREEN_Y, { attach: 'lrb', fin }); }

  s += note(150, 456, 'active', { anchor: 'middle' }) + note(390, 456, 'disabled: can’t fight or flee', { anchor: 'middle' }) + note(630, 456, 'struck: firing on it lifts the surrender', { anchor: 'middle' }) + note(870, 456, 'wrecked: now inert, dashed', { anchor: 'middle' }) + note(1110, 456, 'a contract’s target: the tag', { anchor: 'middle' });
  // colour-blind check: the outside view again with no hue at all
  s += head(40, 622, 'With no colour', 'the outside view above through a greyscale filter: every class still reads, by shape');
  s += world(632, 'filter="url(#grey)"');
  s += note(40, 780, 'The interface setting’s colour-blind-safe set keeps these shapes and moves threat red toward vermilion with a heavier stroke, so red–green confusion costs nothing.', { fill: '#a39d92' });
  return s;
}
