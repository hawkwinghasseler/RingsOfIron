<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Task-driven in Yard Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@600&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&family=VT323&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0c; }
  svg { display: block; margin-bottom: 8px; }
  .legend { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .crt { font-family: 'IBM Plex Mono', monospace; }
  .vt { font-family: 'VT323', monospace; }
  .drum { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }
  .dymo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
  .paper { font-family: 'Special Elite', monospace; }
  .stencil { font-family: 'Big Shoulders Stencil Display', sans-serif; font-weight: 800; }
  .ooc { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<!-- Task-driven functional design (its round 3) built in Yard Standard. 1280 x 800 UI units. -->
<svg id="01-helm-rest" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="02-gunnery-combat" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="03-deck-damage" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="04-docked-terminal" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="05-map-late-plan" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="06-crisis" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="07-flight-modes" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../cassette/kit.js"></script>
<script>
// =====================================================================
// The fit. The task design changes the whole HUD with the post, so the hardware does too: every post
// has its own set of instruments (its "fit"), and the ship's repeaters (time, the annunciator, the
// alert visor, the incoming rack, the key sill) are the same objects at every post, in the same place.
// Every unit is set into the screen's edge on the side its zone belongs to, or stands on the key sill
// that runs along the bottom: nothing floats.
// Helm fit: Yard Standard beige with the orange stripe. Weapons fit: gunmetal, red stripe, rivets.
// The captain's own kit (deck): avocado, the life-support colour.
// =====================================================================
const FIN = {
  yard: { face: 'url(#enamelG)', hi: '#F4EEDD', lo: '#7d735e', ink: C.ink, dim: '#857a68', stripe: C.orange, fix: 'screw' },
  gun:  { face: 'url(#gunG)', hi: '#949BA0', lo: '#3B4145', ink: C.inkLight, dim: '#b3b8bb', stripe: C.red, fix: 'rivet' },
  avo:  { face: 'url(#avoG)', hi: '#9aa46c', lo: '#454c2c', ink: C.inkLight, dim: '#c9cdb0', stripe: null, fix: 'screw' },
  tpa:  { face: 'url(#tpaG)', hi: '#8c8f7c', lo: '#3c3f33', ink: C.inkLight, dim: '#bdbfac', stripe: C.red, fix: 'rivet' },
};
const XDEFS = `<defs>
  <linearGradient id="gunG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#737B81"/><stop offset="1" stop-color="#5B6368"/></linearGradient>
  <linearGradient id="tpaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#686C5A"/><stop offset="1" stop-color="#55594A"/></linearGradient>
  <filter id="caseshadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/></filter>
  <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="thinair" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#bcd6ff"/></pattern>
  <pattern id="redhatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="5" fill="${PH.red}"/></pattern>
  <pattern id="crates" width="27" height="27" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="24" height="24" rx="1.5" fill="#3a3830" stroke="#23221d" stroke-width="1.5"/><path d="M1.5 1.5L25.5 25.5M25.5 1.5L1.5 25.5" stroke="#2c2a24" stroke-width="1.2"/></pattern>
  <radialGradient id="fireG" cx="0.5" cy="0.6" r="0.6"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ff7a2a"/><stop offset="1" stop-color="#c8361c" stop-opacity="0"/></radialGradient>
  <radialGradient id="smokeG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8d8a84" stop-opacity="0.45"/><stop offset="1" stop-color="#8d8a84" stop-opacity="0"/></radialGradient>
  <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EBD9"/><stop offset="1" stop-color="#E4DBC6"/></linearGradient>
</defs>`;
// Lamps sit in a dark bezel ring, so a lit white lens reads as lit on beige enamel too
const kitLampG = lampG;
lampG = (cx, cy, r, color, lit) => `<circle cx="${cx}" cy="${cy}" r="${r + 2.9}" fill="#2b2723"/>` + kitLampG(cx, cy, r, color, lit);
const SILL_Y = 762;
// The "home" bug: a house-shaped index in ink under a delta-v scale. Never a triangle,
// which is the caution glyph.
const homeBugD = (x, y) => `M${x} ${y}l5 4.2v6h-10v-6z`;
const homeBugG = (x, y) => `<path d="${homeBugD(x, y)}" fill="#2a2420" stroke="#F3EEE2" stroke-width="0.6"/>`;
// The kit's edgewise meter draws every bug as a triangle; a home bug is drawn here instead.
const kitHmeterG = hmeterG;
hmeterG = (x, y, w, o = {}) => {
  const bugs = o.bugs || [], min = o.min ?? 0, max = o.max ?? 100, h = o.h ?? 16;
  let s = kitHmeterG(x, y, w, { ...o, bugs: bugs.filter(b => !b.home) });
  for (const b of bugs.filter(b => b.home)) s += homeBugG(x + (Math.max(min, Math.min(max, b.v)) - min) / (max - min) * w, y + h + 3);
  return s;
};                      // the key sill's top edge: every unit stands on it
const lw = t => t.length * 6.7;          // width of a 12-unit legend
const fit = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;   // long names are cut, never wrapped
const pen = (fin) => (x, y, t, o = {}) => tag(x, y, t, { fill: FIN[fin].ink, ...o });
function rivetG(x, y) { return `<circle cx="${x}" cy="${y}" r="2.4" fill="url(#screwG)" stroke="#4b4842" stroke-width="0.5"/><circle cx="${x - 0.7}" cy="${y - 0.8}" r="0.8" fill="#fff" opacity="0.5"/>`; }
function faceG(x, y, w, h, { fin = 'yard', r = 3, fix = false } = {}) {
  const F = FIN[fin];
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${F.face}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${F.face}" filter="url(#grain)"/>
  <path d="M${x + r} ${y + 0.7}H${x + w - r}" stroke="${F.hi}" stroke-width="1.2" opacity="0.9"/>
  <path d="M${x + r} ${y + h - 0.7}H${x + w - r}M${x + w - 0.7} ${y + r}V${y + h - r}" stroke="${F.lo}" stroke-width="1.1" opacity="0.8"/>`;
  if (fix) [[x + 6, y + 6], [x + w - 6, y + 6], [x + 6, y + h - 6], [x + w - 6, y + h - 6]].forEach(([a, b]) => s += F.fix === 'rivet' ? rivetG(a, b) : screwG(a, b));
  return s;
}
// A unit set into the screen edge: a chassis housing that runs off screen (or under the key sill) on
// the attached sides, the identity stripe on the edge that faces the view, and a faceplate.
function unitG(x, y, w, h, { attach = '', fin = 'yard', stripe = true, fix = false } = {}) {
  const T = attach.includes('t'), B = attach.includes('b'), L = attach.includes('l'), R = attach.includes('r'), ex = 14;
  const bx = L ? x - ex : x, by = T ? y - ex : y, bw = w + (L ? ex : 0) + (R ? ex : 0), bh = h + (T ? ex : 0) + (B ? ex : 0);
  let s = `<g filter="url(#caseshadow)"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="7" fill="url(#chassisG)"/></g>`;
  const F = FIN[fin];
  if (stripe && F.stripe) {
    const sx = x + (L ? 0 : 7), sw = w - (L ? 0 : 7) - (R ? 0 : 7), sy = y + 7, sh = h - 14;
    if (T && !B) s += `<rect x="${sx}" y="${y + h - 2.8}" width="${sw}" height="2.4" fill="${F.stripe}"/>`;
    else if (B && !T && !L && !R) s += `<rect x="${sx}" y="${y + 0.4}" width="${sw}" height="2.4" fill="${F.stripe}"/>`;
    else if (L && !R) s += `<rect x="${x + w - 2.8}" y="${sy}" width="2.4" height="${sh}" fill="${F.stripe}"/>`;
    else if (R && !L) s += `<rect x="${x + 0.4}" y="${sy}" width="2.4" height="${sh}" fill="${F.stripe}"/>`;
  }
  const fx = x + (L ? 3 : 5), fy = y + (T ? 3 : 5), fw = w - (L ? 3 : 5) - (R ? 3 : 5), fh = h - (T ? 3 : 5) - (B ? 3 : 5);
  s += faceG(fx, fy, fw, fh, { fin, fix });
  return { s, fx, fy, fw, fh };
}
// Lens push-light whose lens colour and glyph carry severity; unlit lenses are neutral grey
function lensG(x, y, w, h, text, { sev = null, color = null, lit = false, fresh = false } = {}) {
  const col = color || (sev === 'w' ? 'red' : sev === 'c' ? 'amber' : 'white');
  const lines = Array.isArray(text) ? text : [text];
  let s = pushG(x, y, w, h, lines, { color: col, lit });
  if (lit && sev === 'w') s += `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" fill="${LAMP.red[0]}" filter="url(#lampglow)" opacity="0.45"/>` + pushG(x, y, w, h, lines, { color: col, lit });
  if (fresh) s += `<rect x="${x - 5}" y="${y - 5}" width="${w + 10}" height="${h + 10}" rx="4" fill="none" stroke="${LAMP[col][0]}" stroke-width="2" opacity="0.8" filter="url(#lampglow)"/>`;
  return s;
}
// An advisory lamp: the white lamp lit softly. Normal but worth knowing; it never enters the band.
function softLensG(x, y, w, h, text) {
  return `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="${C.alu}"/><rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="2" fill="#4f4c46"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${LAMP.white[0]}" filter="url(#lampglow)" opacity="0.22"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#B9B2A1"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>
  <text x="${x + w / 2}" y="${y + h / 2 + 4.3}" text-anchor="middle" class="legend" font-size="12" fill="#2a2016">${esc(text)}</text>`;
}
// The instrument "OFF" flag: a striped tab that drops in front of something that is not working
function barberTabG(x, y, w = 10, h = 14) {
  return `<rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="2" fill="${C.alu}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#barber)"/>`;
}
function levelG(x, y, w, frac, { h = 10, zones = [] } = {}) {
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2" fill="${C.bakelite}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F2ECDC"/>`;
  for (const z of zones) s += `<rect x="${x + z.from * w}" y="${y + h - 3}" width="${(z.to - z.from) * w}" height="3" fill="${z.color}"/>`;
  for (let i = 0; i <= 10; i++) s += `<line x1="${x + w * i / 10}" y1="${y}" x2="${x + w * i / 10}" y2="${y + (i % 5 ? 3 : 6)}" stroke="${C.ink}" stroke-width="${i % 5 ? 0.7 : 1.2}"/>`;
  const px = x + Math.max(0, Math.min(1, frac)) * w;
  s += `<rect x="${x}" y="${y + h / 2 - 1.5}" width="${px - x}" height="3" fill="${C.ink}" opacity="0.75"/><path d="M${px} ${y + 1}V${y + h - 1}" stroke="${C.orange}" stroke-width="2.4"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  return s;
}
// Interlocked piano keys, one down: the tabs of a screen
function pianoG(x, y, labels, sel, { kw = 44, h = 22, gap = 3 } = {}) {
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${labels.length * (kw + gap) - gap + 6}" height="${h + 6}" rx="2.5" fill="${C.bakelite}"/>`;
  labels.forEach((l, i) => {
    const kx = x + i * (kw + gap), dn = i === sel;
    s += `<g filter="url(#shadow)"><rect x="${kx}" y="${y + (dn ? 2 : 0)}" width="${kw}" height="${h - 2}" rx="2" fill="${dn ? '#cfc4a8' : '#ece4ce'}"/></g>`;
    if (dn) s += `<rect x="${kx}" y="${y + h - 4}" width="${kw}" height="3" fill="${C.orange}"/>`;
    s += `<text x="${kx + kw / 2}" y="${y + h / 2 + 4.5 + (dn ? 1.5 : 0)}" text-anchor="middle" class="legend" font-size="12" fill="${C.ink}">${esc(l)}</text>`;
  });
  return s;
}

// =====================================================================
// THE REPEATERS: the same objects at every post
// =====================================================================
// Z9: the key sill. The console's front edge runs the full width under every unit. Its legends are
// backlit while there is something to learn here; a key the player has learned goes dark (still
// engraved), and after 10 s without a change of context the whole strip dims. Screens cover it.
function keySillG(items, { fade = false } = {}) {
  const y = SILL_Y;
  let s = `<g filter="url(#caseshadow)"><rect x="-14" y="${y}" width="1308" height="52" rx="6" fill="url(#chassisG)"/></g><rect x="0" y="${y}" width="1280" height="4" fill="url(#lipG)"/>`;
  s += screwG(8, y + 22) + screwG(1272, y + 22);
  const wx = 18, wy = y + 10, ww = 1244, wh = 24;
  s += `<rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" rx="3" fill="#16130f"/><rect x="${wx}" y="${wy}" width="${ww}" height="1.5" fill="#000" opacity="0.6"/><rect x="${wx}" y="${wy + wh - 1.5}" width="${ww}" height="1.5" fill="#fff" opacity="0.07"/>`;
  const kw = k => Math.max(15, 7 + k.length * 7.2);
  let xx = wx + 12;
  for (const it of items) {
    for (const k of it.k) { s += keyG(xx, wy + 4.5, k, { anchor: 'start' }); xx += kw(k) + 3; }
    xx += 4;
    const lit = !fade && !it.learned;
    s += `<text x="${xx}" y="${wy + 16.5}" class="legend" font-size="12" fill="${lit ? LAMP.white[0] : '#7d766b'}" ${lit ? 'filter="url(#soft)"' : ''}>${esc(it.t)}</text>`;
    xx += lw(it.t) + 26;
  }
  return s;
}
// Z1 + Z4: the master repeater. The chronometer on top, the annunciator under it. Over a screen only
// the chronometer stays: the lamps' half is a separate unit and goes with the post.
const ANN_NAMES = ['HULL', 'FIRE', 'AIR', 'POWER', 'PROP', 'DRIVE', 'ARMS', 'CREW', 'EVA', 'SHLD'];
// A lamp: null dark; 'a' advisory, lit softly; 'c' caution; 'w' warning; 'cn' or 'wn' new (blinking);
// 'none' a blanking plate where this ship has no such system (the corvette has no shield emitter)
function annTileG(x, y, w, h, name, st) {
  if (st === 'none') return `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="${C.alu}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#8f8b82"/>${screwG(x + 7, y + h / 2)}${screwG(x + w - 7, y + h / 2)}`;
  if (st === 'a') return softLensG(x, y, w, h, name);
  const lit = !!st, sev = st ? st[0] : null;
  return lensG(x, y, w, h, lit ? (sev === 'w' ? '◆ ' : '▲ ') + name : name, { sev, lit, fresh: !!st && st[1] === 'n' });
}
function masterG({ day = '003', time = '14:22:05', warp = '1X', rails = false, next = null, nextT = null, held = null, ann = {}, annOn = true, shld = false, line2 = true } = {}) {
  const U = unitG(0, 0, 300, annOn ? 122 : 64, { attach: 'tl' });
  let s = U.s;
  s += tag(12, 24.5, 'DAY') + drumG(42, 9, day, { cw: 12, ch: 18, size: 15 }) + drumG(90, 9, time, { cw: 12, ch: 18, size: 15, dimLead: false });
  s += tag(188, 24.5, 'WARP') + flapG(224, 10, warp.padEnd(6), { cw: 9.4, ch: 16, size: 13.5 });
  // line 2: the next stop and its countdown, or why warp is held (the reason replaces the next stop)
  if (held) s += lampG(16, 42, 4, 'amber', true) + tag(25, 46.5, 'HELD') + flapG(60, 34, held.padEnd(13).slice(0, 13), { cw: 8.4, ch: 16, size: 13 });
  else {
    const on = line2 && next;
    s += tag(12, 46.5, 'NEXT', { fill: line2 ? C.ink : '#a1967f' }) + flapG(46, 34, (on ? next : '').padEnd(12).slice(0, 12), { cw: 8.4, ch: 16, size: 13 });
    s += drumG(154, 34, on ? nextT : ' :  :  ', { cw: 11, ch: 16, size: 14, dimLead: false });
  }
  s += lampG(240, 42, 4, 'white', rails) + tag(249, 46.5, 'RAILS');
  if (annOn) {
    s += `<line x1="10" y1="58" x2="290" y2="58" stroke="#9f957c" stroke-width="1"/><line x1="10" y1="59" x2="290" y2="59" stroke="#f4eedd" stroke-width="0.8"/>`;
    ANN_NAMES.forEach((n, i) => { s += annTileG(12 + (i % 5) * 56, 65 + Math.floor(i / 5) * 26, 52, 22, n, n === 'SHLD' && !shld ? 'none' : ann[n]); });
  }
  return s;
}
// Z4 under the annunciator, deck only: the captain's suit telemetry (the captain's own kit, avocado)
function perG({ health = 'LIGHT WOUND', suit = 'PRESSURE', air = '7:40', room = 'BRIDGE', roomAir = 'THIN' } = {}) {
  const U = unitG(0, 122, 300, 84, { attach: 'l', fin: 'avo' });
  const P = pen('avo');
  let s = U.s;
  s += P(12, 143.5, 'YOU') + `<line x1="40" y1="139" x2="56" y2="139" stroke="${C.inkLight}" stroke-width="1" opacity="0.5"/>`;
  s += P(64, 143.5, 'HEALTH', { fill: '#dfe3c8' }) + flapG(118, 131, health.padEnd(13).slice(0, 13), { cw: 8.4, ch: 16, size: 13 });
  s += P(64, 166.5, 'SUIT', { fill: '#dfe3c8' }) + flapG(118, 154, suit.padEnd(8).slice(0, 8), { cw: 8.4, ch: 16, size: 13 }) + P(194, 166.5, 'AIR', { fill: '#dfe3c8' }) + drumG(220, 153, air, { cw: 12, ch: 18, size: 15, dimLead: false }) + P(266, 166.5, 'LEFT', { fill: '#dfe3c8' });
  s += P(64, 189.5, 'HERE', { fill: '#dfe3c8' }) + flapG(118, 177, room.padEnd(11).slice(0, 11), { cw: 8.4, ch: 16, size: 13 }) + flapG(216, 177, roomAir.padEnd(8).slice(0, 8), { cw: 8.4, ch: 16, size: 13, fill: roomAir === 'BREATHABLE' ? '#F3EEE2' : '#FFC46B' });
  return s;
}
// Z2: the alert visor. Hinged at the top edge, it swings down while any alert stands and folds away
// when none does. Two windows that keep their places, the warning over the cautions, each with its own
// master lens: MASTER WARNING and CAUTION. Pressing either acknowledges the band.
function visorG({ warn = null, cautions = [], more = 0 } = {}) {
  const x = 306, w = 668, h = 94;
  const U = unitG(x, 0, w, h, { attach: 't' });
  let s = U.s;
  [x + 60, x + w - 70].forEach(hx => s += `<rect x="${hx}" y="0" width="10" height="5" rx="1.5" fill="${C.alu}"/><rect x="${hx}" y="0" width="10" height="1.4" fill="#fff" opacity="0.4"/>`);
  s += lensG(318, 10, 64, 40, warn ? ['◆ MASTER', 'WARNING'] : ['MASTER', 'WARNING'], { sev: 'w', lit: !!warn });
  s += lensG(318, 58, 64, 24, cautions.length ? '▲ CAUTION' : 'CAUTION', { sev: 'c', lit: !!cautions.length });
  // row 1: one warning, its title large and its action under it; empty, the window stays dark
  const t1 = tubeG(392, 10, 570, 40, { r: 3, bezel: 4 });
  s += t1.under;
  if (warn) {
    s += `<text x="402" y="32" class="vt" font-size="25" fill="${PH.red}" filter="url(#glow)" xml:space="preserve">${esc(warn.title)}</text>`;
    let lx = 402;
    for (const seg of warn.line) {
      if (seg.k) { s += tt(lx + 2, 45.5, seg.k, { rev: true, w: seg.k.length * 7.8 + 8, size: 13 }); lx += seg.k.length * 7.8 + 12; }
      else { s += tt(lx, 45.5, seg.t, { size: 13, c: seg.c || 'amber' }); lx += seg.t.length * 7.8; }
    }
  }
  s += t1.over;
  // row 2: up to three cautions side by side, one cell each; the code in bold, then where and who
  const t2 = tubeG(392, 58, 570, 24, { r: 3, bezel: 4 });
  s += t2.under;
  const shown = cautions.slice(0, 3), n = shown.length;
  const need = shown.map((c, i) => (c.code.length + 1 + c.rest.length) * 7.8 + 16 + (more && i === n - 1 ? 32 : 0));
  const total = need.reduce((a, b) => a + b, 0), spare = (570 - total) / Math.max(1, n);
  const widths = total <= 570 ? need.map(v => v + spare) : shown.map(() => 570 / n);
  let cx = 392;
  shown.forEach((c, i) => {
    const cw = widths[i], room = Math.floor((cw - 12) / 7.8) - c.code.length - 1 - (more && i === n - 1 ? 4 : 0);

  s += D(728, 608, 'MOUNT') + D(786, 608, 'GUN') + D(844, 608, 'WORKED BY') + D(913, 608, 'STATE');
  const R = 1056;
  mounts.forEach((m, i) => {
    const yy = 613 + i * 23;

    if (m.who !== 'AUTO') s += lensG(711, yy + 3, 10, 10, '', { color: 'white', lit: m.trig !== false });
    s += P(728, yy + 12.5, m.at) + flapG(786, yy, m.gun.padEnd(7).slice(0, 7), { cw: 7.4, ch: 16, size: 12.5 }) + flapG(844, yy, fit(m.who, 7).padEnd(7), { cw: 7.4, ch: 16, size: 12.5, fill: m.who === 'HAND' ? '#FFC46B' : '#F3EEE2' });
    const st = MOUNT_ST[m.state];
    s += st === 'x' ? barberTabG(899, yy + 1, 10, 14) : lampG(904, yy + 8, 4.5, st || 'white', !!st);
    const sl = m.lock !== undefined ? 6 : 10;
    s += flapG(913, yy, m.state.padEnd(sl).slice(0, sl), { cw: 7.4, ch: 16, size: 12.5 });
    // the value, right-aligned: time of flight, seconds to ready, rounds left, or tracks engaged
    const dr = (str, xr) => drumG(xr - drumW(str, 11), yy - 0.5, str, { cw: 11, ch: 17, size: 15, dimLead: false });
    if (m.tof) { const dw = drumW(m.tof, 11); s += P(R, yy + 12.5, 'S', { anchor: 'end' }) + dr(m.tof, R - 11) + P(R - 17 - dw, yy + 12.5, 'TOF', { anchor: 'end' }); }
    else if (m.secs) s += P(R, yy + 12.5, 'S', { anchor: 'end' }) + dr(m.secs, R - 11);
    else if (m.rounds) s += dr(m.rounds[1], R) + P(R - 16, yy + 12.5, 'OF', { anchor: 'end' }) + dr(m.rounds[0], R - 36);
    else if (m.trk) s += P(R, yy + 12.5, 'TRK', { anchor: 'end' }) + dr(m.trk, R - 25);

  return s;
}

  if (captain) s += `<g filter="url(#glow)"><circle cx="${X(captain[0])}" cy="${Y(captain[1])}" r="2.8" fill="${PH.amber}"/><circle cx="${X(captain[0])}" cy="${Y(captain[1])}" r="6.5" fill="none" stroke="${PH.amber}" stroke-width="1.2"/></g>`;

  s += hmeterG(rx + 18, y + 62, 290, { min: 0, max: 8000, value: 7007, h: 12, bracket: [3095, 7007], bugs: [{ v: 520, home: true }], major: 4 });
  s += tag(rx + 14, y + 104, 'AFTER') + drumG(rx + 56, y + 90, '3095', { cw: 12, ch: 18, size: 15 }) + homeBugG(rx + 122, y + 93) + tag(rx + 131, y + 104, 'HOME FROM THERE') + drumG(rx + 238, y + 90, '520', { cw: 12, ch: 18, size: 15 });

  s += tag(rx + 14, y + 158, 'DEADLINE') + tag(rx + 76, y + 158, 'DAY') + drumG(rx + 102, y + 143, '6', { cw: 12, ch: 19, size: 15, dimLead: false }) + drumG(rx + 120, y + 143, '11:00', { cw: 12, ch: 19, size: 15, dimLead: false });
  // late is a caution, so its lens is amber with the caution glyph, and it says by how much
  s += lensG(rx + 190, y + 118, 118, 42, ['▲ LATE', 'BY 22 H 40 M'], { sev: 'c', lit: true });
  const bt = tubeG(rx + 14, y + 170, rw - 28, 34, { r: 3, bezel: 4 });

  s += keyG(rx + 14, y + 208, ';', { anchor: 'start' }) + tag(rx + 34, y + 220, 'PLAN') + keyG(rx + 84, y + 208, 'ENTER', { anchor: 'start' }) + tag(rx + 132, y + 220, 'ACCEPT') + keyG(rx + 196, y + 208, 'BKSP', { anchor: 'start' }) + tag(rx + 238, y + 220, 'DISCARD');
  // MAP.3 fly it: each order greyed with its reason when it can't be given
  y = 478;
  s += faceG(rx, y, rw, 100, { fix: false });
  s += tag(rx + 14, y + 18, 'FLY IT');
  s += keyG(rx + 14, y + 28, '/', { anchor: 'start' }) + pushG(rx + 36, y + 26, 140, 20, ['WARP TO BURN 1'], { color: 'white' });
  s += keyG(rx + 14, y + 54, '1', { anchor: 'start' }) + pushG(rx + 36, y + 52, 140, 20, ['HELM FLIES BURNS'], { color: 'white' }) + tag(rx + 188, y + 66, 'HELMSMAN') + flapG(rx + 250, y + 53, 'BEA'.padEnd(6), { cw: 8.4, ch: 17, size: 13 });
  s += keyG(rx + 14, y + 80, '6', { anchor: 'start' }) + pushG(rx + 36, y + 78, 140, 20, ['AUTOPILOT'], { color: 'white' }) + lampG(rx + 194, y + 88, 4.5, 'green', true) + tag(rx + 203, y + 92, 'READY');
  // MAP.4 the selected burn: thumbwheels
  y = 586;
  s += faceG(rx, y, rw, 98, { fix: false });
  s += tag(rx + 14, y + 18, 'SELECTED BURN') + flapG(rx + 112, y + 6, 'BURN 1', { cw: 8.4, ch: 16, size: 13 });

}

// 06 The crisis panel: disabled. The band carries the title and the reason; the panel starts at what
// the crew is doing, then the two ways out with their terms. It hangs from the visor.
function crisisG() {
  const x = 340, y = 104, w = 600, h = 210;
  let s = '';
  [x + 60, x + w - 70].forEach(hx => s += `<rect x="${hx}" y="${y - 12}" width="10" height="16" rx="2" fill="${C.alu}"/>`);
  s += `<g filter="url(#caseshadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="url(#hazard)"/></g><rect x="${x + 8}" y="${y + 8}" width="${w - 16}" height="${h - 16}" rx="3" fill="url(#chassisG)"/>`;
  const py = y + 16, ph = 134;
  // wait: the crew is on it
  s += faceG(x + 16, py, 192, ph);
  s += tag(x + 28, py + 20, 'WAIT', { size: 13 }) + tag(x + 66, py + 20, 'LET THE CREW WORK', { fill: '#5a4f42' });
  s += handFigG(x + 34, py + 44) + flapG(x + 50, py + 34, 'ADA'.padEnd(5), { cw: 8.4, ch: 16, size: 13 }) + tag(x + 100, py + 47, 'RESETTING');
  s += tag(x + 28, py + 70, 'THE REACTOR SHORT') + tag(x + 28, py + 92, 'ABOUT') + drumG(x + 70, py + 78, '20', { cw: 13, ch: 19, size: 15, dimLead: false }) + tag(x + 100, py + 92, 'S');
  s += `<line x1="${x + 26}" y1="${py + 104}" x2="${x + 198}" y2="${py + 104}" stroke="#9f957c"/>`;
  s += tag(x + 28, py + 124, 'BREAKER RECLOSES IN') + drumG(x + 154, py + 110, '41', { cw: 13, ch: 19, size: 15, dimLead: false }) + tag(x + 184, py + 124, 'S');
  // tow: guarded switch, its terms on a slip the way a contract would be
  const tx = x + 216;
  s += faceG(tx, py, 192, ph);
  s += tag(tx + 12, py + 20, 'CALL A TOW', { size: 13 }) + toggleG(tx + 162, py + 34, { up: false, guard: true }) + keyG(tx + 12, py + 29, 'B', { anchor: 'start' }) + tag(tx + 31, py + 41, 'TWICE');
  s += `<g filter="url(#shadow)"><rect x="${tx + 10}" y="${py + 56}" width="172" height="68" fill="url(#paperG)"/></g>`;
  ['Fee 9,600 cr', 'Standing -3', '3 days to Highport,', 'with ship and crew'].forEach((l, i) => s += `<text x="${tx + 18}" y="${py + 72 + i * 15}" class="paper" font-size="13" fill="#2a2420">${l}</text>`);
  // abandon: guarded switch; seats against the people aboard as lamps, so the shortfall is seen, not read
  const ax = x + 416;
  s += faceG(ax, py, 168, ph);
  s += tag(ax + 12, py + 20, 'ABANDON SHIP', { size: 13 }) + toggleG(ax + 140, py + 34, { up: false, guard: true }) + keyG(ax + 12, py + 29, 'P', { anchor: 'start' }) + tag(ax + 31, py + 41, 'TWICE');
  s += tag(ax + 12, py + 66, 'POD 1 (S)') + tag(ax + 12, py + 88, 'SEATS');
  for (let i = 0; i < 4; i++) s += lampG(ax + 62 + i * 16, py + 84, 5, 'green', true);
  s += tag(ax + 12, py + 112, 'ABOARD');
  for (let i = 0; i < 6; i++) s += handFigG(ax + 62 + i * 16, py + 108, i >= 4 ? '#c0392b' : C.ink);
  s += tag(ax + 12, py + 128, '2 WITHOUT A SEAT', { fill: '#8a2a1e' });
  // air aboard at this crew
  const ay = py + ph + 8;
  s += faceG(x + 16, ay, w - 32, 32);
  s += tag(x + 28, ay + 21, 'AIR ABOARD') + levelG(x + 110, ay + 11, 240, 0.34, { h: 10, zones: [{ from: 0, to: 0.15, color: C.red }, { from: 0.15, to: 0.3, color: C.mustard }] }) + drumG(x + 370, ay + 6, '41', { cw: 13, ch: 19, size: 15, dimLead: false }) + tag(x + 400, ay + 21, 'MIN AT THIS CREW');
  return s;
}
function handFigG(x, y, col = C.ink) {
  return `<circle cx="${x}" cy="${y - 5}" r="3" fill="${col}"/><path d="M${x - 4.5} ${y + 6}Q${x - 4.5} ${y - 1} ${x} ${y - 1}Q${x + 4.5} ${y - 1} ${x + 4.5} ${y + 6}Z" fill="${col}"/>`;
}
function scene06() {
  let s = DEFS + XDEFS + spaceG(1280, 800, { seed: 17 });

// 07 FLT: the five modes on one sheet, the compact weapons row, and the annunciator's states
function sheetPod(mode, d, X, Y, cap, opts = {}) {
  const id = 'clp' + mode + X + Y;
  const top = opts.hlm ? Y - 26 : Y;
  return `<clipPath id="${id}"><rect x="${X - 20}" y="${top - 20}" width="500" height="${104 + (Y - top) + 20}"/></clipPath>
   <g clip-path="url(#${id})"><g transform="translate(${X - 410},${Y - 658})">${fltG(mode, d, opts)}</g></g>
   <rect x="${X - 10}" y="${Y + 104}" width="480" height="2" fill="#3a3632"/>
   <text x="${X}" y="${top - 12}" class="ooc" font-size="14" font-weight="600" fill="#d6d1c6">${cap[0]}</text><text x="${X + 150}" y="${top - 12}" class="ooc" font-size="13" fill="#8f8a80">${cap[1]}</text>`;
}
function scene07() {
  let s = DEFS + XDEFS + `<rect width="1280" height="800" fill="#16171a"/>`;

  s += sheetPod('DEPARTURE', { berth: 'HIGHPORT 6', checks: [{ ok: true, label: 'ΔV', val: '7007, CONTRACT NEEDS 3900' }, { ok: true, label: 'REPAIRS', val: 'NONE NEEDED' }, { ok: true, label: 'CREW', val: 'ALL 3 ABOARD' }, { ok: false, label: 'MISSILES', val: '2 OF 4', key: 'Y', keyText: 'FILL 2,000 CR' }] }, 40, 74, ['DEPARTURE', 'docked: four readiness checks']);
  s += sheetPod('DOCK', { port: '1/1 S ACT', theirs: 'HIGHPORT 6', clear: 'CLEARED', range: '0312', off: -2.2, ang: -4, offT: 'L 2.2 M', angT: '4° L', safe: 7.9, closing: 6.1, closingT: '6.1' }, 770, 74, ['DOCK', 'closing against the safe band']);
  s += sheetPod('BURN', { n: '1', of: '2', by: 'HELMSMAN', t: '1:52', turning: true, togo: '3084', time: '4:17', err: 31 }, 40, 262, ['BURN', 'with the helm line: an order stands'], { hlm: { who: 'BEA', order: 'FLYING THE PLANNED BURNS' } });
  s += sheetPod('WARP', { rate: '10000X', stop: 'BURN 2', inD: '3', inT: '04:11', held: 'NOTHING' }, 770, 262, ['WARP', 'rails: nothing to steer']);
  s += sheetPod('CRUISE', { kind: 'TGT', name: "RAIDER 'VEX'", dist: '3.2', speed: '0041', dv: '7007', home: '410', assist: false, main: true, rcs: true, plan: [3095, 7007] }, 40, 450, ['CRUISE', 'frame on the target; assist off; a plan bracketed']);
  // the compact weapons row at the helm
  const wx = 770, wy = 450;
  s += `<text x="${wx}" y="${wy - 12}" class="ooc" font-size="14" font-weight="600" fill="#d6d1c6">WPN compact</text><text x="${wx + 150}" y="${wy - 12}" class="ooc" font-size="13" fill="#8f8a80">at the helm in combat: one lamp per mount</text>`;
  s += `<clipPath id="clpwpn"><rect x="${wx - 20}" y="${wy - 20}" width="232" height="${62 + 20}"/></clipPath><g clip-path="url(#clpwpn)"><g transform="translate(${wx - 876},${wy - 700})">${wpnCompactG({ pips: [{ state: 'READY' }, { state: 'ENGAGING' }, { state: 'IDLE' }, { state: 'RELOAD' }, { state: 'NO POWER' }], rounds: ['3', '4'], decoy: '2' })}</g></g><rect x="${wx - 10}" y="${wy + 62}" width="212" height="2" fill="#3a3632"/>`;
  const note = (x, y, t) => `<text x="${x}" y="${y}" class="ooc" font-size="12" fill="#8f8a80">${t}</text>`;
  s += note(wx + 214, wy + 14, 'green: fires now') + note(wx + 214, wy + 30, 'amber: waiting') + note(wx + 214, wy + 46, 'dark: idle point defence') + note(wx + 214, wy + 62, 'striped flag: not working');
  // the annunciator's states
  const ax = 40, ay = 618;
  s += `<text x="${ax}" y="${ay - 12}" class="ooc" font-size="14" font-weight="600" fill="#d6d1c6">ANN</text><text x="${ax + 150}" y="${ay - 12}" class="ooc" font-size="13" fill="#8f8a80">a lamp's states, focus and hover</text>`;

  st.forEach(([l, v, n], i) => { s += annTileG(ax + 26 + i * 110, ay + 22, 64, 24, n, v) + `<text x="${ax + 58 + i * 110}" y="${ay + 68}" text-anchor="middle" class="ooc" font-size="12" fill="#5a5046">${l}</text>`; });

  s += annTileG(ax + 26, ay + 92, 64, 24, 'FIRE', 'c') + `<path d="M${ax + 18} ${ay + 104}l-8 -6v12z" fill="${C.orange}"/>`;
  const ht = tubeG(ax + 110, ay + 94, 400, 20, { r: 3, bezel: 3 });

  s += `<text x="${ax + 680}" y="${ay + 40}" class="ooc" font-size="12" fill="#5a5046">The corvette has no shield emitter, so its tenth lamp</text><text x="${ax + 680}" y="${ay + 56}" class="ooc" font-size="12" fill="#5a5046">position is a blanking plate: nine lamps, as fitted.</text>`;
  return s;
}
