<!doctype html>
<html><head><meta charset="utf-8"><title>Context: deck, emergency</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="context.js"></script>
<script>
// Walkthrough 11.7 on the starting corvette: the ship is disabled, its reactor stunned, and the
// hold has lost its air. Fire in the bridge with Bea on it; Ada down, Cole treating her; the
// captain suited in the hold. X3 offers abandon ship and the tow; while it shows, everything but
// X3, P2, H4, D1 and D3 dims (here P1 and P5).
let s = rect(0, 0, 1280, 800, { fill: '#050607' }) + controlDefs();
const K = 42, OX = 640 - 10.5 * K, OY = 410 - 3 * K;
const X = tx => OX + tx * K, Y = ty => OY + (6 - ty) * K;
s += corvetteDeck(OX, OY, K, {
  id: 'c3', unpowered: true, dark: 0.3, vacuum: ['hold'], door: 'shut', labels: true, labelAt: { hold: [4, 1.5], bridge: [13.3, 3.8] },
  fire: [[14.6, 2.5, 0.85], [15.1, 2.1, 0.6], [14.2, 2.9, 0.5]], fireRoom: 'bridge',
  smoke: [[14.4, 2.6, 1.7], [12.6, 3.2, 1.2]],
  alarm: [[8.4, 4.7, 0.5], [16.6, 1.3, -2.4]],
  crew: [[13.5, 2.45], [11.9, 3.3]],           // Bea on the fire; Cole kneeling at Ada
  down: [[12.0, 2.5, 0]],                      // Ada, critical
  avatar: [4.2, 4.5],                          // the captain, suited, in the hold
});
// D3: a tag on each hazard in view, by P2's code or the casualty's name, a leader to the spot
function tag(x, y, label, to) {
  const col = C.red, w = tw(label, B, true, 0.4) + 32, h = 22;
  let t = haloed((c, ww) => line(x + w / 2, y + h, to[0], to[1], c, ww), col, 1.5) + `<circle cx="${to[0]}" cy="${to[1]}" r="3" fill="${col}"/>`;
  t += rect(x, y, w, h, { fill: 'rgba(5,7,10,0.92)', stroke: col, sw: 1.5, r: 1 }) + sym.diamond(x + 12, y + 11, 4.4, col, 1.2, col);
  return t + text(x + 23, y + 15.7, label, { size: B, bold: true, fill: col, track: 0.4 });
}
// Bea's extinguisher on the fire: crew at work show in the world, not on the tags
s += path(`M${X(13.8)} ${Y(2.45)} L${X(14.45)} ${Y(2.85)} L${X(14.45)} ${Y(2.05)} Z`, 'none', 0, { fill: 'rgba(225,235,245,0.38)' });
s += tag(X(14.6) - 30, Y(6) - 34, 'FIRE', [X(14.6), Y(2.9)]);
s += tag(X(4.6) - 40, Y(6) - 34, 'VACUUM', [X(5), Y(5.3)]);
s += tag(X(11.6) - 36, Y(0.2) + 4, 'ADA', [X(12.0), Y(2.2)]);

// P1 and P5, dimmed under the emergency
s += `<g opacity="0.4">` + statusStrip({ seat: 'DECK', authority: 'HELM: NOBODY', clock: 'DAY 0 · 01:12', warp: '1X' }) + objective(['DELIVER 120 WATER', '→ SHACKLETON ICE · 1.4 D LEFT']).svg + '</g>';

// P2 in its order: needs you, then crew on it, then clears by itself; SMOKE under "+1 more"
s += cwPanel([
  ['warning', 'EMERG O2', '', 'you'],
  ['warning', 'VACUUM', 'HOLD', 'you'],
  ['warning', 'CREW CRIT', 'ADA', 1, '3:40'],
  ['warning', 'FIRE', 'BRIDGE', 1],
  ['warning', 'NO POWER', 'STUNNED', 'back', '0:12'],
], { more: ['SMOKE'] });

// X3, the emergency card: a hazard-striped frame, the cause, and the ways out as the same guarded
// switches as C1's (lifting the guard is the first press, so each takes P or B twice in 3 s)
{
  const { x, y } = ZC.topc, w = 500, h = 122;
  s += rect(x - 2, y - 2, w + 4, h + 4, { fill: '#151719', r: 3 }) + rect(x, y, w, h, { fill: 'url(#guardrim)', r: 2 }) + rect(x + 6, y + 6, w - 12, h - 12, { fill: C.glass });
  s += text(x + 20, y + 34, 'SHIP DISABLED: NO POWER', { size: 22, bold: true, fill: C.red, track: 0.6 });
  const ky = y + 48;
  s += capKey(x + 20, ky + 12, 'P') + guarded(x + 48, ky, 96, 40, 'ABANDON', 'SHIP', 'idle', { name: true });
  s += capKey(x + 172, ky + 12, 'B') + guarded(x + 200, ky, 96, 40, 'CALL', 'TOW', 'idle', { name: true });
  s += lab(x + 314, ky + 17, 'TOW COSTS') + text(x + 314, ky + 35, '3 400 CR · 3 STANDING', { size: B, bold: true, fill: C.white, track: 0.3 });
  s += text(x + 20, y + h - 14, 'LIFT THE GUARD, THEN PRESS: P OR B TWICE IN 3 S', { size: B, fill: C.white, track: 0.3 });
}

// L-BOTTOM: H4 expanded without its plan (the deck is the plan), D1 under it at the zone's foot
s += du(12, 558, 308, 134, {
  id: 'h4', b: 6,
  content: (gx, gy, gw) => {
    let c = '';
    const BX = gx + 100, R = gx + gw - 8;
    const row = (i, name, sev, l1, r1, frac, o = {}) => {
      const top = gy + i * 40 + 1, col = sev === 'warning' ? C.red : sev === 'caution' ? C.amber : null;
      if (i) c += line(gx + 4, top - 1, gx + gw - 4, top - 1, C.graticule, 1);
      c += lens(gx + 6, top + 7, 84, 24, (col ? '◆ ' : '') + name, col);
      c += text(BX, top + 16, l1, { size: B, bold: true, fill: o.l1c || C.white, track: 0.4 }) + r1(top + 16);
      c += I.hbar(BX, top + 30, R - BX, frac, { color: col || C.white, bands: o.bands });
    };
    row(0, 'HULL', null, 'INTEGRITY', yy => val(R, yy, '88%', null, { anchor: 'end', size: B }), 0.88, { l1c: C.dim, bands: [[0, 0.25, C.red], [0.25, 0.5, C.amber]] });
    row(1, 'POWER', 'warning', 'OUTPUT', yy => val(R, yy, '0 OF 3.0', 'MW', { anchor: 'end', size: B, fill: C.red }), 0, { l1c: C.dim });
    row(2, 'LIFE SUP', 'warning', 'EMERG O2', yy => val(R, yy, '52', 'KG', { anchor: 'end', size: B }), 52 / 60, { l1c: C.red });
    return c;
  },
}).svg;
// D1 the captain's vitals, on the suit's own display (the DCM: suit-grey bezel, orange tab)
{
  const x = 12, y = 698, w = 308, h = 90;
  s += rect(x, y, w, h, { fill: '#B9BDB8', r: 6 }) + path(`M${x + 6} ${y + 0.5} H${x + w - 6} M${x + 6} ${y + h - 0.5} H${x + w - 6}`, '#8E928D', 1);
  s += text(x + 12, y + 14, 'SUIT', { size: LB, bold: true, fill: '#26282A', track: 1.4, legend: true }) + rect(x + w - 34, y + 6, 22, 8, { fill: C.orange, r: 1 });
  s += rect(x + 8, y + 19, w - 16, h - 25, { fill: C.glass });
  const L = x + 18, M = x + 78, R = x + w - 18;
  s += lab(L, y + 38, 'YOU') + text(M, y + 38, 'OK', { size: V, bold: true, fill: C.white });
  s += lab(L, y + 57, 'SUIT') + text(M, y + 57, 'ON', { size: V, bold: true, fill: C.white }) + lab(R - valW('9:40') - 6, y + 57, 'AIR', { anchor: 'end' }) + val(R, y + 57, '9:40', null, { anchor: 'end' });
  s += lab(L, y + 76, 'HERE') + sym.diamond(M + 5, y + 71, 4.4, C.red, 1.2, C.red) + text(M + 16, y + 76, 'VACUUM', { size: V, bold: true, fill: C.red, track: 0.4 });
}

// the master alert cue, standing alone at the centre of the bottom-centre zone: the newest warning
s += masterCue(640, 676, { sev: 'warning', code: 'EMERG O2' });

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
