<!doctype html>
<html><head><meta charset="utf-8"><title>Context: deck, emergency</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="context.js"></script>
<script>
// Walkthrough 11.7 (version 11) on the starting corvette, at battle stations: the ship is disabled,
// its reactor damaged (so no power is due back by itself and X3 offers the ways out), and the hold has
// lost its air. Bea fights the fire in the bridge alone; Ada was hit in the hold and lies there, with
// Cole tending Ada. The crew keep clear of where Ada was hit until the fight ends, so the hold's air
// waits, but not Ada, who has under two minutes. The captain, by the helm with a light wound and
// suited in the bridge's thin air, has pressed B once: the tow is armed for 3 s. While X3 shows,
// everything but X3, P2, H4, D1, D3 and the master alert cue dims (here P1). P5 has the delivery,
// which is no fight, so in combat it doesn't show.
let s = rect(0, 0, 1280, 800, { fill: '#050607' }) + controlDefs();
const K = 42, OX = 640 - 10.5 * K, OY = 410 - 3 * K;
const X = tx => OX + tx * K, Y = ty => OY + (6 - ty) * K;
s += corvetteDeck(OX, OY, K, {
  id: 'c3', unpowered: true, dark: 0.2, vacuum: ['hold'], thin: ['bridge'], door: 'shut', labels: true, labelAt: { hold: [4, 3], bridge: [13.3, 3.8] },
  fire: [[14.6, 2.5, 0.85], [15.1, 2.1, 0.6], [14.2, 2.9, 0.5]], fireRoom: 'bridge',
  smoke: [[14.4, 2.6, 1.7], [12.6, 3.2, 1.2]],
  alarm: [[8.4, 4.7, 0.5], [16.6, 1.3, -2.4]],
  crew: [[13.5, 2.45], [3.45, 1.5]],           // Bea on the fire; Cole, suited, kneeling at Ada's head
  down: [[4.45, 1.5, 180]],                    // Ada, critical, where the hit landed in the hold
  avatar: [11.5, 3.5],                         // the captain, suited, by the helm
});
// D3: a tag on each hazard in view, one per room and code, by P2's code or the casualty's name, a
// leader to the spot; a caution's tag (the smoke) amber with its triangle
function tag(x, y, label, to, caution) {
  const col = caution ? C.amber : C.red, w = tw(label, B, true, 0.4) + 32, h = 22;
  let t = haloed((c, ww) => line(x + w / 2, y + (to[1] > y ? h : 0), to[0], to[1], c, ww), col, 1.5) + `<circle cx="${to[0]}" cy="${to[1]}" r="3" fill="${col}"/>`;
  t += rect(x, y, w, h, { fill: 'rgba(5,7,10,0.92)', stroke: col, sw: 1.5, r: 1 });
  t += caution ? path(`M${x + 12} ${y + 5.5} L${x + 17.2} ${y + 15.5} L${x + 6.8} ${y + 15.5} Z`, col, 1.2, { fill: col }) : sym.diamond(x + 12, y + 11, 4.4, col, 1.2, col);
  return t + text(x + 23, y + 15.7, label, { size: B, bold: true, fill: col, track: 0.4 });
}
// Bea's extinguisher on the fire: crew at work show in the world, not on the tags
s += path(`M${X(13.8)} ${Y(2.45)} L${X(14.45)} ${Y(2.85)} L${X(14.45)} ${Y(2.05)} Z`, 'none', 0, { fill: 'rgba(225,235,245,0.38)' });
s += tag(X(14.6) - 30, Y(6) - 34, 'FIRE', [X(14.6), Y(2.9)]);
s += tag(X(4.0) - 44, Y(6) - 34, 'VACUUM', [X(4.0), Y(4.5)]);
s += tag(X(4.45) - 30, Y(0.2) + 4, 'ADA', [X(4.6), Y(1.35)]);
s += tag(X(13.6) - 40, Y(0.2) + 4, 'SMOKE', [X(13.6), Y(1.5)], true);

// P1, dimmed under the emergency
s += `<g opacity="0.4">` + statusStrip({ seat: 'DECK', authority: 'HELM: NOBODY', battle: true, clock: 'DAY 0 · 01:12:40', warp: '1×' }) + '</g>';

// P2 in its order (version 11): what needs you, then what the crew hold back from, then what they
// are on. Nobody is free for the oxygen or the reactor: Ada is down, Cole tends Ada and Bea fights
// the fire alone. The hold's air waits (‖), since Ada was hit there; Ada doesn't, with 1:40 left.
// SMOKE goes under "+1 more"
s += cwPanel([
  ['warning', 'EMERG O2', '', 'you'],
  ['warning', 'NO POWER', 'DAMAGED', 'you'],
  ['warning', 'VACUUM', 'HOLD', 'held'],
  ['warning', 'CREW CRIT', 'ADA', 1, '1:40'],
  ['warning', 'FIRE', 'BRIDGE', 1],
], { more: ['SMOKE'] });

// X3, the emergency card: a hazard-striped frame, the cause, and the ways out as the same guarded
// switches as C1's (lifting the guard is the first press, so each takes P or B twice in 3 s). B
// has been pressed once: the tow's guard stands open, its switch is lit amber, and the foot says
// what the second press does and how long it has.
{
  const { x, y } = ZC.topc, w = 500, h = 122;
  s += rect(x - 2, y - 2, w + 4, h + 4, { fill: '#151719', r: 3 }) + rect(x, y, w, h, { fill: 'url(#guardrim)', r: 2 }) + rect(x + 6, y + 6, w - 12, h - 12, { fill: C.glass });
  s += text(x + 20, y + 34, 'SHIP DISABLED: NO POWER', { size: 22, bold: true, fill: C.red, track: 0.6 });
  const ky = y + 48;
  s += capKey(x + 20, ky + 12, 'P') + guarded(x + 48, ky, 96, 40, 'ABANDON', 'SHIP', 'idle', { name: true });
  s += capKey(x + 172, ky + 12, 'B') + guarded(x + 200, ky, 96, 40, 'CALL', 'TOW', 'armed', { name: true, open: true });
  s += lab(x + 314, ky + 17, 'TOW COSTS') + text(x + 314, ky + 35, '3 400 CR · 3 STANDING', { size: B, bold: true, fill: C.white, track: 0.3 });
  // the arming window runs down as a bar rather than a number: 3 s, 2.1 left
  s += text(x + 20, y + h - 14, 'TOW ARMED: B AGAIN CALLS IT', { size: B, bold: true, fill: C.amber, track: 0.3 });
  s += rect(x + 314, y + h - 22, 166, 6, { fill: '#26303A' }) + rect(x + 314, y + h - 22, 166 * 0.7, 6, { fill: C.amber });
}

// L-BOTTOM: H4 expanded without its plan (the deck is the plan), D1 under it at the zone's foot
s += du(12, 558, 308, 134, {
  id: 'h4', b: 6,
  content: (gx, gy, gw) => {
    let c = '';
    const BX = gx + 100, R = gx + gw - 8;
    const row = (i, name, sev, l1, r1, frac, o = {}) => {
      const top = gy + i * 40 + 1, col = sev === 'warning' ? C.red : sev === 'caution' ? C.amber : null;
      if (i) c += line(gx + 4, top - 1, gx + gw - 4, top - 1, C.graticule, 1);
      c += lens(gx + 6, top + 7, 84, 24, (col ? '◆ ' : '') + name, col);
      c += text(BX, top + 16, l1, { size: B, bold: true, fill: o.l1c || C.white, track: 0.4 }) + r1(top + 16);
      c += I.hbar(BX, top + 30, R - BX, frac, { color: col || C.white, bands: o.bands });
    };
    // Version 8: the figures beside the bars are values, at 15 (12.4). Power's bar is the store, with
    // its share; then the reactor's output, with the rating beside it while damage holds the output
    // under it. Life support on its reserve gives the reserve's kilograms (of 60), named EMERG O2 as
    // P2's code and the master cue name it: the spec's EMERGENCY, in the word list's instrument form.
    row(0, 'HULL', null, 'INTEGRITY', yy => val(R, yy, '81%', null, { anchor: 'end' }), 0.81, { l1c: C.dim, bands: [[0, 0.25, C.red], [0.25, 0.5, C.amber]] });
    row(1, 'POWER', 'warning', 'STORE', yy => val(BX + tw('STORE', B, true, 0.4) + 8, yy, '0%') + val(R - tw('OF 3.0 MW', LB, true, 0.3) - 4, yy, '0', null, { anchor: 'end', fill: C.red }) + text(R, yy, 'OF 3.0 MW', { size: LB, bold: true, fill: C.dim, anchor: 'end', track: 0.3 }), 0, { l1c: C.dim });
    row(2, 'LIFE SUP', 'warning', 'EMERG O2', yy => val(R, yy, '42', 'KG', { anchor: 'end' }), 42 / 60, { l1c: C.red });
    return c;
  },
}).svg;
// D1 the captain's vitals, on the suit's own display (the DCM: suit-grey bezel, orange tab)
{
  const x = 12, y = 698, w = 308, h = 90;
  s += rect(x, y, w, h, { fill: '#B9BDB8', r: 6 }) + path(`M${x + 6} ${y + 0.5} H${x + w - 6} M${x + 6} ${y + h - 0.5} H${x + w - 6}`, '#8E928D', 1);
  s += text(x + 12, y + 14, 'SUIT', { size: LB, bold: true, fill: '#26282A', track: 1.4, legend: true }) + rect(x + w - 34, y + 6, 22, 8, { fill: C.orange, r: 1 });
  s += rect(x + 8, y + 19, w - 16, h - 25, { fill: C.glass });
  const L = x + 18, M = x + 78, R = x + w - 18;
  // a light wound is no alert, so it reads white; the bridge's air is too thin to breathe but not
  // vacuum, a caution, so the suit's air counts down
  s += lab(L, y + 38, 'YOU') + text(M, y + 38, 'LIGHT WOUND', { size: V, bold: true, fill: C.white, track: 0.3 });
  s += lab(L, y + 57, 'SUIT') + text(M, y + 57, 'ON', { size: V, bold: true, fill: C.white }) + lab(R - valW('9:40') - 6, y + 57, 'AIR', { anchor: 'end' }) + val(R, y + 57, '9:40', null, { anchor: 'end' });
  s += lab(L, y + 76, 'HERE') + path(`M${M + 5} ${y + 65.5} L${M + 10.6} ${y + 76} L${M - 0.6} ${y + 76} Z`, C.amber, 1.2, { fill: C.amber }) + text(M + 16, y + 76, 'THIN AIR', { size: V, bold: true, fill: C.amber, track: 0.4 });
}

// the master alert cue, standing alone at the centre of the bottom-centre zone: the newest warning
s += masterCue(640, 676, { sev: 'warning', code: 'VACUUM' });

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
