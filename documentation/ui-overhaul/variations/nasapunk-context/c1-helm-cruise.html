<!doctype html>
<html><head><meta charset="utf-8"><title>Context: helm, cruise</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="context.js"></script>
<script>
// Walkthrough 11.1: at the helm, cruising in Earth orbit, nothing wrong. P2, P3 and P4 are empty and
// draw nothing (the dark cockpit); H4 is four unlit lenses; H5 has folded to a key.
let s = space({ px: 260, py: 1700, pr: 1250, seed: 5 });
const SX = 640, SY = 405, HDG = 90;
s += hull(SX, SY, HDG, 0.9);
// W2 velocity markers, orbit frame, 70 from the ship; W3 the next burn's arrow and countdown
s += W.pro(SX + 70, SY) + W.retro(SX - 70, SY);
s += haloed((c, w) => line(SX + 18, SY + 22, SX + 54, SY + 22, c, w) + path(`M${SX + 46} ${SY + 16} L${SX + 55} ${SY + 22} L${SX + 46} ${SY + 28}`, c, w), C.magenta, 2.5);
s += text(SX + 62, SY + 26, '1  T−12:05', { size: B, bold: true, fill: C.magenta });
// W1: the Nav target is off screen: one edge marker with its range
s += haloed((c, w) => path(`M1238 300 L1250 308 L1238 316`, c, w), C.magenta, 2.5);
s += text(1230, 304, 'SHACKLETON ICE', { size: 11, bold: true, fill: C.magenta, anchor: 'end', track: 0.6 }) + text(1230, 319, '1,240 KM', { size: 11, bold: true, fill: C.white, anchor: 'end' });

// P1 glareshield strip
s += glareStrip({ seat: 'HELM', clock: 'DAY 0 · 00:33', warp: '1X' });

// L-MID: P5 objective (compact), then H2 navigation
s += objective(12, 176, 308, 'OBJ', 'DELIVER 120 WATER', '→ SHACKLETON ICE', 'T−1.4 D');
s += du(12, 226, 308, 232, {
  id: 'h2', b: 8, title: 'NAVIGATION',
  content: (gx, gy, gw) => {
    let c = '';
    const L = gx + 8, R = gx + gw - 8;
    // ORBIT: a small orbit picture beside the apsis lines
    const ox = L + 30, oy = gy + 32;
    c += `<circle cx="${ox}" cy="${oy}" r="9" fill="none" stroke="${C.dim}" stroke-width="1.2"/>`;
    c += `<ellipse cx="${ox + 2}" cy="${oy}" rx="26" ry="19" fill="none" stroke="${C.white}" stroke-width="1.4"/>`;
    c += line(ox + 28, oy - 4, ox + 28, oy + 4, C.white, 1.5) + line(ox - 24, oy - 4, ox - 24, oy + 4, C.white, 1.5);
    c += `<circle cx="${ox + 14}" cy="${oy - 15.5}" r="3" fill="${C.cyan}"/>`;
    c += text(L + 66, gy + 18, 'ORBIT', { size: 11, bold: true, fill: C.dim, track: 0.6 }) + text(L + 116, gy + 18, 'EARTH  400 KM', { size: B, bold: true, fill: C.white });
    c += text(L + 66, gy + 37, 'AP', { size: 11, bold: true, fill: C.dim }) + text(L + 90, gy + 37, '403 KM', { size: B, bold: true, fill: C.white }) + text(R, gy + 37, 'T−24:10', { size: B, bold: true, fill: C.white, anchor: 'end' });
    c += text(L + 66, gy + 56, 'PE', { size: 11, bold: true, fill: C.dim }) + text(L + 90, gy + 56, '397 KM', { size: B, bold: true, fill: C.white }) + text(R, gy + 56, 'T−1 H 10 M', { size: B, bold: true, fill: C.white, anchor: 'end' });
    c += line(gx + 4, gy + 66, gx + gw - 4, gy + 66, C.graticule, 1);
    // NAV: name in the nav colour, range and rate, closest approach
    c += `<circle cx="${L + 6}" cy="${gy + 81}" r="5.5" fill="none" stroke="${C.magenta}" stroke-width="1.5"/>`;
    c += text(L + 18, gy + 86, 'SHACKLETON ICE', { size: B, bold: true, fill: C.magenta, track: 0.5 });
    c += text(R, gy + 86, '1,240 KM', { size: V, bold: true, fill: C.white, anchor: 'end' });
    c += text(L + 18, gy + 105, 'OPENING', { size: 11, bold: true, fill: C.dim, track: 0.5 }) + text(R, gy + 105, '220 M/S', { size: B, bold: true, fill: C.white, anchor: 'end' });
    c += text(L + 18, gy + 124, 'CLOSEST 3.2 KM', { size: 11, bold: true, fill: C.dim, track: 0.5 }) + text(R, gy + 124, 'T−2 H 05 M', { size: B, bold: true, fill: C.white, anchor: 'end' });
    c += line(gx + 4, gy + 134, gx + gw - 4, gy + 134, C.graticule, 1);
    // NEXT: the next event on a timeline, flown by
    c += text(L, gy + 154, 'NEXT', { size: 11, bold: true, fill: C.dim, track: 0.6 });
    c += path(`M${L + 46} ${gy + 143} l6 6 l-6 6 l-6 -6 z`, C.magenta, 1.5, { fill: C.glass });
    c += text(L + 58, gy + 154, 'BURN 1/2', { size: B, bold: true, fill: C.magenta }) + text(L + 136, gy + 154, 'T−12:05', { size: B, bold: true, fill: C.white });
    c += text(R, gy + 154, '420 M/S', { size: B, bold: true, fill: C.white, anchor: 'end' });
    c += text(L + 58, gy + 170, 'FLOWN BY HELM', { size: 10, bold: true, fill: C.dim, track: 0.6 });
    c += line(gx + 4, gy + 178, gx + gw - 4, gy + 178, C.graticule, 1);
    // PLAN: what the planned burns need against what is left
    const max = 1600, bx = L + 120, bw = gw - 140;
    c += text(L, gy + 196, 'PLAN ΔV', { size: 11, bold: true, fill: C.dim, track: 0.6 }) + text(L + 62, gy + 196, '860', { size: B, bold: true, fill: C.magenta });
    c += I.hbar(bx, gy + 196, bw, 1240 / max, { bracket: [0, 860 / max] });
    c += text(bx + bw * 1240 / max + 6, gy + 189, '1,240', { size: 10, bold: true, fill: C.white });
    return c;
  },
}).svg;

// P6 learning hints, above the primary instrument while nothing on screen is the subject
const hints = [['M', 'MAP'], ['N', 'PLAN A BURN'], ['O', 'ORDERS']];
let hx = 640 - 140;
hints.forEach(([k, t]) => { s += softKey(hx, 640, 16, 15, false) + text(hx + 8, 652, k, { size: 10, bold: true, fill: C.stencil, anchor: 'middle' }) + text(hx + 22, 652, t, { size: 11.5, bold: true, fill: C.dim, track: 0.6 }); hx += 28 + t.length * 8 + 16; });

// H1 flight display, bottom centre
s += flightDisplay(440, 688, { frame: 'ORBIT  ·  AUTO', frameAuto: true, speed: '7,672', speedUnit: 'M/S', assist: true, dv: '1,240', prop: 0.72 });
// H4 four quiet lenses; H5 folded to a key with the count of contacts beyond 50 km
s += condLights(12, 748, {});
s += scopeKey(1220, 740, 3);

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
