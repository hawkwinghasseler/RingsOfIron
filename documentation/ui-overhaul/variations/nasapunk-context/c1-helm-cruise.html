<!doctype html>
<html><head><meta charset="utf-8"><title>Context: helm, cruise, orders open</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="context.js"></script>
<script>
// Walkthroughs 11.1 and 11.12: at the helm of the starting corvette, cruising in Earth orbit with
// nothing wrong, and the captain has pressed O. P2, P3 and P4 are empty and draw nothing (the dark
// cockpit); H4 is three unlit lenses (no shield emitter aboard); H5 has folded to a key. No helm
// order is running, so P1's authority field is empty and no helm key is down.
let s = space({ px: 260, py: 1700, pr: 1250, seed: 5 }) + controlDefs();
const SX = 640, SY = 318;
s += hullArt('corvette', SX, SY, 0, 0.075);
// W2 velocity markers, orbit frame, 70 from the ship. W3: the next burn's arrow, with its countdown.
s += W.pro(SX + 70, SY) + W.retro(SX - 70, SY);
s += haloed((c, w) => line(SX - 20, SY + 30, SX + 34, SY + 30, c, w) + path(`M${SX + 26} ${SY + 24} L${SX + 35} ${SY + 30} L${SX + 26} ${SY + 36}`, c, w), C.magenta, 2.5);
s += text(SX + 44, SY + 35, 'BURN 1  T−12:05', { size: B, bold: true, fill: C.magenta, halo: true });
// W1: the Nav is off screen to the right. Its edge marker carries no range: H2 has it.
s += haloed((c, w) => path(`M1238 236 L1250 244 L1238 252`, c, w), C.magenta, 2.5);
s += text(1230, 249, 'SHACKLETON ICE', { size: LB, bold: true, fill: C.magenta, anchor: 'end', track: 0.6, halo: true });

s += statusStrip({ seat: 'HELM', clock: 'DAY 0 · 00:33', warp: '1×' });

// L-MID: P5 objective (compact), then H2 navigation
const p5 = objective(['DELIVER 40 FOOD', '→ SHACKLETON ICE · 1.4 D LEFT']);
s += p5.svg;
s += du(12, ZC.lmid.y + p5.h + 6, 308, 192, {
  id: 'h2', b: 6,
  content: (gx, gy, gw) => {
    let c = '';
    const L = gx + 8, M = L + 56, R = gx + gw - 8, P = 17.5;
    let yy = gy + 18;
    const rule = () => { c += line(gx + 4, yy - 13, gx + gw - 4, yy - 13, C.graticule, 1); yy += 4; };
    const right = (v, unit) => val(R, yy, v, unit, { anchor: 'end' });
    // ORBIT: the body and height, then each apsis with the time to it
    c += lab(L, yy, 'ORBIT') + text(M, yy, 'EARTH', { size: B, bold: true }) + lab(R - valW('400', 'KM') - 6, yy, 'ALT', { anchor: 'end' }) + right('400', 'KM'); yy += P;
    c += lab(M, yy, 'AP') + val(M + 26, yy, '403', 'KM') + right('T−24:10'); yy += P;
    c += lab(M, yy, 'PE') + val(M + 26, yy, '397', 'KM') + right('T−1:10:00'); yy += P + 1;
    rule();
    // NAV: the Nav's name in the nav colour, its range, rate and closest approach
    c += lab(L, yy, 'NAV') + `<circle cx="${M + 5}" cy="${yy - 4.5}" r="5" fill="none" stroke="${C.magenta}" stroke-width="1.5"/>` + text(M + 16, yy, 'SHACKLETON ICE', { size: B, bold: true, fill: C.magenta, track: 0.3 }) + right(num(1240), 'KM'); yy += P;
    c += lab(M, yy, 'OPENING') + right('220', 'M/S'); yy += P;
    c += lab(M, yy, 'CLOSEST') + val(M + 66, yy, '3.2', 'KM', { size: B }) + right('T−2:05:00'); yy += P + 1;
    rule();
    // NEXT: the next event of any kind, and who flies it
    c += lab(L, yy, 'NEXT') + path(`M${M + 5} ${yy - 10} l5.5 5.5 l-5.5 5.5 l-5.5 -5.5 z`, C.magenta, 1.5) + text(M + 16, yy, 'BURN 1/2', { size: B, bold: true, fill: C.magenta, track: 0.3 }) + right('T−12:05'); yy += P;
    c += val(M + 16, yy, '420', 'M/S', { size: B }) + text(R, yy, 'HELM FLIES IT', { size: B, fill: C.white, anchor: 'end', track: 0.3 }); yy += P + 1;
    rule();
    // PLAN: what the planned burns need and what they leave (delta-v left is H1's)
    c += lab(L, yy, 'PLAN') + lab(M, yy, 'ΔV') + val(M + 22, yy, '860', 'M/S') + lab(R - valW('380', 'M/S') - 6, yy, 'LEAVES', { anchor: 'end' }) + right('380', 'M/S');
    return c;
  },
}).svg;

// C1, the orders menu: a mode control panel opened over the world, its foot on H1's hood.
// Helm orders are interlocked keys under their number caps; the others carry their key cap at
// their left. What can't be given now is drawn, not hidden, with a barber-pole strip, and the
// foot gives each reason once with the keys it blocks.
{
  const x = 330, y = 408, w = 620, h = 250, L = x + 16, C0 = x + 112;
  s += bezelBody(x, y, w, h, 4) + fastener(x + 7, y + 7) + fastener(x + w - 7, y + 7) + fastener(x + 7, y + h - 7) + fastener(x + w - 7, y + h - 7);
  const legend = (yy, t, lx = L) => text(lx, yy, t, { size: LB, bold: true, fill: C.stencil, track: 1 });
  const capped = (cx, yy, k) => capKey(cx, yy + 12, k, 17);   // a key cap beside a 40-tall control
  // HELM: one order at a time (giving one releases the one running); CANCEL ends it
  const kw = 76, kg = 6;
  [['1', 'FLY', 'BURNS'], ['2', 'MATCH', 'VELOCITY', 'na'], ['3', 'HOLD', 'POSITION', 'na'], ['4', 'APPROACH', '500 M', 'na'], ['5', 'DOCK', 'AT NAV', 'na'], ['0', 'CANCEL', '']].forEach(([k, a, b, st], i) => {
    const bx = C0 + i * (kw + kg);
    s += capKey(bx + kw / 2 - capW(k) / 2, y + 11, k, 16) + korry(bx, y + 31, kw, 40, a, b, st || 'idle', { name: true });
  });
  s += legend(y + 56, 'HELM');
  // The groups in the spec's order, read across then down: AUTOPILOT and CREW (a switch and two
  // toggles), then SHIELDS and the SHIP's guarded orders, which sit last, at the far corner from
  // the helm keys the hand uses most
  let yy = y + 84;
  s += legend(yy + 24, 'AUTOPILOT') + capped(C0, yy, '6') + korry(C0 + 22, yy, 76, 40, 'TO NAV', 'OFF');
  s += legend(yy + 24, 'CREW', C0 + 116) + korry(C0 + 168, yy, 118, 40, 'SUITS AT BATTLE', 'ON', 'on') + korry(C0 + 292, yy, 126, 40, 'HOLD IN FROM EVA', 'OFF');
  // SHIELDS: raise or lower, and the trim as a five-way selector (8 steps it)
  yy = y + 136;
  s += legend(yy + 24, 'SHIELDS') + capped(C0, yy, '9') + korry(C0 + 22, yy, 56, 40, 'RAISE', '--', 'na');
  s += capped(C0 + 86, yy, '8') + trimSelector(C0 + 108, yy, 'even', 'na');
  s += legend(yy + 24, 'SHIP', C0 + 222);
  s += capped(C0 + 262, yy, 'P') + guarded(C0 + 289, yy, 76, 40, 'ABANDON', 'SHIP', 'idle', { name: true });
  s += capped(C0 + 378, yy, 'B') + guarded(C0 + 405, yy, 84, 40, 'CALL TOW', '3 400 CR', 'na');
  // the foot: a glass strip with each reason once, and the keys it blocks
  const fy = y + 186;
  s += rect(x + 12, fy, w - 24, 54, { fill: C.glass });
  [['NEEDS A NAV IN THE BUBBLE', '2 3 4 5'], ['NO SHIELD EMITTER ABOARD', '8 9'], ['YOUR SHIP CAN STILL FLY HOME', 'B']].forEach(([why, keys], i) => {
    const ly = fy + 16 + i * 16;
    s += barber(x + 22, ly - 7) + text(x + 44, ly, why, { size: B, fill: C.white, track: 0.3 }) + text(x + 44 + tw(why, B, false, 0.3) + 8, ly, keys, { size: B, bold: true, fill: C.white, track: 0.6 });
  });
}

// H1 flight display under its hood (the master alert cue, dark: nothing new to acknowledge)
s += flightDisplay(440, 688, { frame: 'ORBIT · AUTO', frameAuto: true, speed: num(7672), assist: true, dv: num(1240), prop: 0.72 });
// H4: three quiet lenses (no shield emitter); H5 folded to a key with the count beyond 50 km
s += condLights(12, 748, ['HULL', 'POWER', 'LIFE SUP']);
s += scopeKey(3);

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
