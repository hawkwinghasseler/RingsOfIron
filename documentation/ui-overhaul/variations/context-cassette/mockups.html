<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Context-driven in Yard Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@600&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@300;400;500&family=Special+Elite&family=VT323&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0c; }
  svg { display: block; margin-bottom: 8px; }
  .legend { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .crt { font-family: 'IBM Plex Mono', monospace; }
  .vt { font-family: 'VT323', monospace; }
  .drum { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }
  .dymo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
  .paper { font-family: 'Special Elite', monospace; }
  .stencil { font-family: 'Big Shoulders Stencil Display', sans-serif; font-weight: 800; }
  .ooc { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<!-- Context-driven functional design (version 7) built in Yard Standard, round 2. 1280 x 800 UI units. -->
<svg id="01-helm-cruise" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="03-helm-approach" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="04-helm-combat" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="05-fire-control" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="07-deck-emergency" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="08-docked" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="12-orders-menu" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="13-boarding" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../cassette/kit.js"></script>
<script>
// =====================================================================
// The canopy. The context design has no console band: widgets come and go by seat and situation.
// So the hardware is a frame around the view, and each widget is a unit that mounts on the frame by
// its zone: top units hang from the header rail on rods, side units ride slide rails on the screen's
// edges, bottom units stand on the coaming (the top edge of the seat's console). A unit with nothing
// to show is put away: drawn up into the rail, slid off the edge, or lowered into the coaming.
// Hardware is honest: a printed legend never changes its words. A word that changes is on split
// flaps, a number on a drum, a sentence on a tube, and a state on a lamp with a fixed legend.
// =====================================================================
const XDEFS = `<defs>
  <filter id="projglow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="thinair" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#bcd6ff"/></pattern>
  <pattern id="crates" width="27" height="27" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="24" height="24" rx="1.5" fill="#3a3830" stroke="#23221d" stroke-width="1.5"/><path d="M1.5 1.5L25.5 25.5M25.5 1.5L1.5 25.5" stroke="#2c2a24" stroke-width="1.2"/></pattern>
  <pattern id="flagA" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1a1614"/><rect width="4" height="8" fill="${C.mustard}"/></pattern>
  <pattern id="flagR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1a1614"/><rect width="4" height="8" fill="${C.red}"/></pattern>
  <radialGradient id="fireG" cx="0.5" cy="0.6" r="0.6"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ff7a2a"/><stop offset="1" stop-color="#c8361c" stop-opacity="0"/></radialGradient>
  <radialGradient id="smokeG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8d8a84" stop-opacity="0.45"/><stop offset="1" stop-color="#8d8a84" stop-opacity="0"/></radialGradient>
  <radialGradient id="batG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb060" stop-opacity="0.3"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
  <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EBD9"/><stop offset="1" stop-color="#E4DBC6"/></linearGradient>
</defs>`;

// Lamps sit in a dark bezel ring, so a lit white lens reads as lit on beige enamel (as in the stations variation)
const kitLampG = lampG;
lampG = (cx, cy, r, color, lit) => `<circle cx="${cx}" cy="${cy}" r="${r + 2.9}" fill="#2b2723"/>` + kitLampG(cx, cy, r, color, lit);
const lg = (x, y, t, o = {}) => tag(x, y, t, { fill: C.inkLight, ...o });   // legend painted on the dark chassis
const fit = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;          // long names are cut, never wrapped
const lw = t => t.length * 6.7;                                              // width of a 12-unit legend
const DIM_INK = '#8f8578';

// World labels are light on glass: a lighter weight and a thinner halo than the tubes' text
function wl(x, y, t, { c = 'amber', size = 13, anchor = 'start' } = {}) {
  return `<text x="${x}" y="${y}" class="crt" font-size="${size}" text-anchor="${anchor}" font-weight="300" fill="${PH[c] || c}" filter="url(#projglow)" xml:space="preserve">${esc(t)}</text>`;
}
// The next burn: a double chevron along its direction, with no number (H2's NEXT line has the countdown)
function burnMarkG(x, y, rot) {
  return `<g filter="url(#projglow)" transform="translate(${x},${y}) rotate(${rot})" stroke="${WS.a}" stroke-width="1.8" fill="none"><path d="M-9 -7L-1 0L-9 7M-1 -7L7 0L-1 7"/></g>`;
}
// A small lens with a fixed legend, lit or dark; dark lenses keep their legend faintly
function lensS(x, y, w, h, text, color = null, { glow = true, base = 'white', size = 12 } = {}) {
  const lit = !!color, [on, off] = LAMP[color || base];
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" rx="2" fill="${C.alu}"/>`;
  if (lit && glow) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)" opacity="0.6"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" fill="${lit ? on : off}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  s += `<text x="${x + w / 2}" y="${y + h / 2 + 4.2}" text-anchor="middle" class="legend" font-size="${size}" fill="${lit ? '#241406' : 'rgba(240,230,210,0.42)'}">${esc(text)}</text>`;
  return s;
}
// Split flaps with a printed face colour per cell run (YOU is printed on yellow flaps)
function flapC(x, y, str, { cw = 8.4, ch = 18, size = 13, bg = '#24211f', fill = '#F3EEE2' } = {}) {
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${str.length * cw + 4}" height="${ch + 4}" rx="1.5" fill="#0d0b0a"/>`;
  for (let i = 0; i < str.length; i++) {
    const xx = x + i * cw, face = str[i] === ' ' ? '#24211f' : bg;
    const light = face !== '#24211f';
    s += `<rect x="${xx + 0.5}" y="${y}" width="${cw - 1}" height="${ch}" fill="${face}"/>`;
    if (!light) s += `<line x1="${xx + 0.5}" y1="${y + ch / 2}" x2="${xx + cw - 0.5}" y2="${y + ch / 2}" stroke="#000" stroke-width="0.8" opacity="0.7"/>`;
    if (str[i] !== ' ') s += `<text x="${xx + cw / 2}" y="${y + ch / 2 + size * 0.36}" text-anchor="middle" class="drum" font-size="${size}" fill="${face === bg ? fill : '#F3EEE2'}">${esc(str[i])}</text>`;
    // on a printed face the seam is a pale gap that runs behind the ink, not a dark line over it
    if (light) s += `<line x1="${xx + 0.5}" y1="${y + ch / 2}" x2="${xx + cw - 0.5}" y2="${y + ch / 2}" stroke="#fff3c4" stroke-width="0.7" opacity="0.55"/>`;
  }
  return s;
}
// A quarter-turn fastener, and the blanking plate that covers a place with no system behind it
function dzusG(x, y) { const a = rnd() * 180; return `<circle cx="${x}" cy="${y}" r="4.4" fill="none" stroke="#8f8571" stroke-width="0.8"/><g transform="translate(${x},${y}) rotate(${a})"><circle r="3.2" fill="url(#screwG)" stroke="#5d5a53" stroke-width="0.6"/><path d="M-2.4 0H2.4" stroke="#4b4842" stroke-width="1.3"/></g>`; }
function blankG(x, y, w, h) {
  const k = h < 22 ? 0 : 1;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#bdb29a" stroke="#8f8571" stroke-width="0.8"/><path d="M${x + 2} ${y + 1.2}H${x + w - 2}" stroke="#e7dfca" stroke-width="1" opacity="0.8"/>`
    + dzusG(x + 7, y + h / 2 - k * (h / 2 - 7)) + dzusG(x + w - 7, y + h / 2 - k * (h / 2 - 7)) + (k ? dzusG(x + 7, y + h - 7) + dzusG(x + w - 7, y + h - 7) : '');
}
// A closed counter window: the drum behind it has nothing to count
function shutG(x, y, w, h) {
  return `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="${C.bakelite}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#3a332d"/><path d="M${x} ${y + h / 2}H${x + w}" stroke="#2a241f" stroke-width="1"/><rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2.5" fill="url(#glassG)"/>`;
}
// A flag that drops into a gauge's face: a fixed word on hazard stripes
function faceFlagG(x, y, w, h, word, kind) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${kind === 'danger' ? 'flagR' : 'flagA'})" stroke="#111" stroke-width="0.8"/><rect x="${x + 5}" y="${y + 1.5}" width="${w - 10}" height="${h - 3}" fill="#efe8d6"/>`
    + tag(x + w / 2, y + h / 2 + 4.2, word, { anchor: 'middle' });
}
const dimG = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000" opacity="0.5"/>`;

// ---------------- the frame: rods, slide rails, the coaming ----------------
function rodsG(xs, y0, y1) {
  return xs.map(x => `<rect x="${x - 2}" y="${y0}" width="4" height="${y1 - y0}" fill="${C.alu}"/><rect x="${x - 2}" y="${y0}" width="1.3" height="${y1 - y0}" fill="#fff" opacity="0.35"/>`).join('');
}
function sideRailG(side, y, h) {
  const L = side === 'L', rx = L ? 0 : 1273, cx = L ? 6 : 1267;
  let s = `<rect x="${rx}" y="${y - 6}" width="7" height="${h + 12}" rx="2" fill="${C.chassisDeep}"/><rect x="${L ? rx + 5 : rx}" y="${y - 6}" width="2" height="${h + 12}" fill="${C.alu}" opacity="0.7"/>`;
  [y + 8, y + h - 16].forEach(cy => s += `<rect x="${cx}" y="${cy}" width="7" height="8" rx="1" fill="${C.alu}"/>`);
  return s;
}
function coamingG() {
  return `<g filter="url(#deckshadow)"><rect x="0" y="788" width="1280" height="12" fill="url(#chassisG)"/></g><rect x="0" y="788" width="1280" height="3" fill="url(#lipG)"/>`;
}

// ---------------- P1: the header rail ----------------
// A window let flush into the rail: plain and dark while it has nothing to say, phosphor when it does
function slotG(x, y, w, h, text = '', { c = 'amber', size = 13 } = {}) {
  let s = `<rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="2" fill="#0b0a09"/>`;
  if (!text) return s + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#191612"/>`;
  const t = tubeG(x, y, w, h, { r: 1.5, bezel: 0 });
  return s + t.under + tt(x + 7, y + h / 2 + 4.6, text, { c, size }) + t.over;
}
function railG({ seat = 'HELM', auth = '', battle = false, day = '000', time = '00:33', warp = '1X', rails = false, held = '', paused = false, dim = false } = {}) {
  let s = `<g filter="url(#shadow)"><rect x="0" y="0" width="1280" height="26" fill="url(#chassisG)"/></g>
   <rect x="0" y="21.5" width="1280" height="1" fill="#211b17"/><rect x="0" y="22.5" width="1280" height="3.5" fill="${C.orange}"/>`;
  s += lg(10, 15.5, 'SEAT') + flapG(42, 3, seat.padEnd(14).slice(0, 14), { cw: 9, ch: 16, size: 13.5 });
  s += slotG(180, 3, 296, 16, auth);                         // who flies, when it isn't the captain by hand: 36 characters
  s += lensS(490, 3, 122, 16, 'BATTLE STATIONS', battle ? 'amber' : null);
  s += lg(630, 15.5, 'DAY') + drumG(657, 3, day, { cw: 11, ch: 16, size: 15, dimLead: false }) + drumG(699, 3, time, { cw: 11, ch: 16, size: 15, dimLead: false });
  s += lg(768, 15.5, 'WARP') + flapG(804, 3, warp.padEnd(5), { cw: 9.4, ch: 16, size: 13.5 });
  s += lensS(860, 3, 46, 16, 'RAILS', rails ? 'white' : null);
  s += slotG(916, 3, 210, 16, held);                         // why warp is held or capped
  s += lensS(1196, 3, 72, 16, 'PAUSED', paused ? 'white' : null);
  if (dim) s += dimG(0, 0, 1280, 22.5);
  return s;
}

// ---------------- P2: the caution and warning board (split flaps, hung from the rail) ----------------
// Six rows of 24; a row is five fields of fixed width: severity, code (11), detail (10), handling (3), timer
function sevLensG(x, y, w, h, sev, fresh) {
  const [on] = LAMP[sev === 'warning' ? 'red' : 'amber'];
  return `<rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="1.5" fill="${C.alu}"/>
   ${fresh ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)"/>` : ''}
   <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="${on}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>
   <text x="${x + w / 2}" y="${y + h / 2 + 4.5}" text-anchor="middle" font-size="12.5" fill="#2a1606">${sev === 'warning' ? '◆' : '▲'}</text>`;
}
// handling on three flaps: YOU printed on yellow; a dot per crew member on it, up to three, then ●4;
// BACK, with the timer beside it, when the condition clears by itself; blank when the code has none
function handG(x, y, hand, ch) {
  const o = { cw: 8.4, ch, size: 13 };
  if (hand === 'you') return flapC(x, y, 'YOU', { ...o, bg: C.mustard, fill: C.ink });
  if (hand === 'back') return flapC(x, y, 'BCK', o);
  if (typeof hand === 'number') return flapC(x, y, (hand >= 4 ? '●' + hand : '●'.repeat(hand)).padEnd(3), { ...o, size: 11 });
  return flapC(x, y, '   ', o);
}
function cwBoardG(rows, { more = null } = {}) {
  const x = 12, y = 38, w = 308, rh = 24, n = rows.length + (more ? 1 : 0), h = n * rh + 6;
  let s = rodsG([46, 286], 22, y + 3);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#14110e"/></g>
   <rect x="${x + 0.75}" y="${y + 0.75}" width="${w - 1.5}" height="${h - 1.5}" rx="3" fill="none" stroke="${C.alu}" stroke-width="1.5"/>`;
  rows.forEach((r, i) => {
    const yy = y + 6 + i * rh, ch = 18;
    s += sevLensG(x + 6, yy, 18, ch, r.sev, r.fresh);
    s += flapG(x + 30, yy, r.code.padEnd(11).slice(0, 11), { cw: 8.2, ch, size: 13 });
    s += flapG(x + 124, yy, (r.detail || '').toUpperCase().padEnd(10).slice(0, 10), { cw: 8.2, ch, size: 13 });
    s += handG(x + 210, yy, r.hand, ch);
    if (r.timer) s += drumG(x + 246, yy, r.timer, { cw: 9.5, ch, size: 15, dimLead: false });
    else s += `<rect x="${x + 243}" y="${yy - 3}" width="50" height="${ch + 6}" rx="2.5" fill="#100d0b"/>`;
  });
  if (more) {
    // the sixth row opens Ship > Systems at the damage control board: a key, and the hidden codes on flaps
    const yy = y + 6 + rows.length * rh;
    s += `<g filter="url(#shadow)"><rect x="${x + 5}" y="${yy - 1}" width="20" height="20" rx="2.5" fill="${C.bakelite}"/></g><rect x="${x + 7}" y="${yy}" width="16" height="16" rx="2" fill="#3a3430"/><path d="M${x + 12} ${yy + 4}l5 4l-5 4" stroke="${C.inkLight}" stroke-width="1.6" fill="none"/>`;
    s += flapG(x + 30, yy, more.padEnd(32).slice(0, 32), { cw: 8.2, ch: 18, size: 13 });
  }
  return s;
}

// ---------------- P3: the threat alert (hung from the rail, top centre), two lines on one tube ----------------
function threatUnitG({ line1, line2 = [] } = {}) {
  const x = 390, y = 38, w = 500, h = 60;
  let s = rodsG([430, 850], 22, y + 3);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#chassisG)"/></g><rect x="${x}" y="${y + h - 3}" width="${w}" height="3" rx="1" fill="${C.red}"/>`;
  const t = tubeG(x + 8, y + 6, w - 16, h - 15, { r: 4, bezel: 4 });
  s += t.under + `<text x="${x + w / 2}" y="${y + 29}" class="vt" font-size="26" text-anchor="middle" fill="${PH.red}" filter="url(#glow)">${esc(line1)}</text>`;
  // line 2 is built of segments so that a key can sit in it as a reversed cell: [{t}|{k}]
  const cw = 13.5 * 0.6, wd = line2.reduce((a, g) => a + (g.k ? 2 * cw + 2 : g.t.length * cw), 0);
  let lx = x + w / 2 - wd / 2;
  for (const g of line2) {
    if (g.k) { s += tt(lx + 4, y + 46.5, g.k, { rev: true, w: 13, size: 12.5 }); lx += 2 * cw + 2; }
    else { s += tt(lx, y + 46.5, g.t, { size: 13.5 }); lx += g.t.length * cw; }
  }
  return s + t.over;
}

// ---------------- P4: the message feed, an intercom repeater (hung from the rail, top right) ----------------
function intercomG(lines, { x = 960, y = 38, w = 308, dim = false } = {}) {
  const h = 16 + lines.length * 18;
  let s = rodsG([x + 40, x + w - 40], 22, y + 3);
  const t = tubeG(x + 6, y + 5, w - 12, h - 10, { r: 4, bezel: 4 });
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${C.bakelite}"/></g>` + t.under;
  lines.forEach((l, i) => {
    const yy = y + 22 + i * 18;
    s += tt(x + 15, yy, l.tag.padEnd(5), { rev: true, w: 46, size: 12.5 });
    s += tt(x + 68, yy, l.text, { size: 13, c: l.old ? 'dim' : 'amber' });
  });
  s += t.over;
  if (dim) s += dimG(x, y, w, h);
  return s;
}

// ---------------- X3: the emergency placard (hung from the rail, top centre) ----------------
function placardG({ head = 'SHIP DISABLED: NO POWER', fee = '3400', standing = '3', armed = null, towOk = true } = {}) {
  const x = 390, y = 38, w = 500, h = 136;
  let s = rodsG([430, 850], 22, y + 3);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#hazard)"/></g>`;
  s += `<rect x="${x + 7}" y="${y + 7}" width="${w - 14}" height="${h - 14}" rx="3" fill="url(#chassisG)"/>`;
  const t = tubeG(x + 18, y + 15, w - 36, 32, { r: 3, bezel: 4 });
  s += t.under + `<text x="${x + w / 2}" y="${y + 39.5}" class="vt" font-size="26" text-anchor="middle" fill="${PH.red}" filter="url(#glow)">${esc(head)}</text>` + t.over;
  // the two ways out, each a guarded switch: lifting the guard is the first press, throwing it the second
  const way = (px, title, key, open, locked) => {
    let g = plateG(px, y + 58, 228, 64, { screws: false });
    g += toggleG(px + 30, y + 90, { up: false, guard: true, guardOpen: open });
    g += tag(px + 58, y + 77, title, { size: 13.5 }) + keyG(px + 58, y + 84, key, { anchor: 'start' }) + tag(px + 78, y + 96, 'TWICE');
    if (open) g += lensS(px + 128, y + 83, 56, 16, 'ARMED', 'amber');
    return g;
  };
  s += way(x + 16, 'ABANDON SHIP', 'P', armed === 'P');
  s += way(x + 256, 'CALL A TOW', 'B', armed === 'B');
  // the tow's price, on drums: what it costs in credits and in standing
  s += drumG(x + 312, y + 100, fee, { cw: 11, ch: 18, size: 15, dimLead: false }) + tag(x + 360, y + 114, 'CR') + drumG(x + 384, y + 100, standing, { cw: 11, ch: 18, size: 15, dimLead: false }) + tag(x + 400, y + 114, 'STANDING');
  return s;
}

// ---------------- P5: the tracked contract, clipped to the left pillar ----------------
// The contract is a record, so it is typed. Its deadline is a timer clipped to the board, only while it has one.
function clipG({ y = 194, lines, left = null, unit = 'D' }) {
  const x = 12, w = 308, h = 58;
  let s = sideRailG('L', y, h);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#6f5f49"/></g>`;
  s += `<rect x="${x + 6}" y="${y + 8}" width="${w - 12}" height="${h - 12}" fill="url(#paperG)"/>`;
  for (let yy = y + 13; yy < y + h - 6; yy += 9) s += `<circle cx="${x + 11}" cy="${yy}" r="1.6" fill="#6f5f49"/><circle cx="${x + w - 11}" cy="${yy}" r="1.6" fill="#6f5f49"/>`;
  s += `<rect x="${x + 6}" y="${y + 8}" width="${w - 12}" height="${h - 12}" fill="url(#greenbar)" opacity="0.3"/>`;
  s += `<g filter="url(#shadow)"><rect x="${x + 70}" y="${y + 1}" width="70" height="10" rx="3" fill="url(#screwG)"/></g>`;

  // the hold at vacuum: frost blue, the breach in the starboard hull, venting

  { const [x, y] = R(4, 0, 1, 1); s += `<path d="M${x + 6} ${y}l8 12l7 -6l6 14l9 -8l4 -12Z" fill="#000"/><g opacity="0.4" stroke="#dfe8ee" stroke-width="2" fill="none"><path d="M${x + 18} ${y + 18}q-6 20 4 40"/><path d="M${x + 26} ${y + 16}q8 22 -2 44"/></g>`; }
  // the wall between the rooms (x 7 | 8) and its door at y 3, shut against the vacuum

  // the bridge: propellant tank, life support, weapons console, helm; turret mounts; two small bays; the reactor forward
  { const [x, y] = R(8, 1, 1, 1); s += `<circle cx="${x + 27}" cy="${y + 27}" r="19" fill="#3a3a33" stroke="#151719" stroke-width="2"/>`; }
