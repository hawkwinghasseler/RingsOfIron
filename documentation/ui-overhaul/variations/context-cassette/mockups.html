<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Context-driven in Yard Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@600&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&family=VT323&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0c; }
  svg { display: block; margin-bottom: 8px; }
  .legend { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .crt { font-family: 'IBM Plex Mono', monospace; }
  .vt { font-family: 'VT323', monospace; }
  .drum { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }
  .dymo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
  .paper { font-family: 'Special Elite', monospace; }
  .stencil { font-family: 'Big Shoulders Stencil Display', sans-serif; font-weight: 800; }
  .ooc { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<!-- Context-driven functional design (v2) built in Yard Standard. 1280 x 800 UI units. -->
<svg id="01-helm-cruise" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="03-helm-approach" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="04-helm-combat" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="07-deck-emergency" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="12-orders-menu" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../cassette/kit.js"></script>
<script>
// =====================================================================
// The canopy. The context design has no console band: widgets come and go by seat and situation.
// So the hardware is a frame around the view, and each widget is a unit that mounts on the frame by
// its zone: top units hang from the header rail on rods, side units ride slide rails on the screen's
// edges, bottom units stand on the coaming (the top edge of the seat's console). A unit with nothing
// to show is put away: drawn up into the rail, slid off the edge, or lowered into the coaming.
// =====================================================================
const lg = (x, y, t, o = {}) => tag(x, y, t, { fill: C.inkLight, ...o });   // legend painted on chassis

function rodsG(xs, y0, y1) {
  return xs.map(x => `<rect x="${x - 2}" y="${y0}" width="4" height="${y1 - y0}" fill="${C.alu}"/><rect x="${x - 2}" y="${y0}" width="1.3" height="${y1 - y0}" fill="#fff" opacity="0.35"/>`).join('');
}
function sideRailG(side, y, h) {
  const L = side === 'L', rx = L ? 0 : 1273, cx = L ? 6 : 1267;
  let s = `<rect x="${rx}" y="${y - 6}" width="7" height="${h + 12}" rx="2" fill="${C.chassisDeep}"/><rect x="${L ? rx + 5 : rx}" y="${y - 6}" width="2" height="${h + 12}" fill="${C.alu}" opacity="0.7"/>`;
  [y + 8, y + h - 16].forEach(cy => s += `<rect x="${cx}" y="${cy}" width="7" height="8" rx="1" fill="${C.alu}"/>`);
  return s;
}
function coamingG() {
  return `<g filter="url(#deckshadow)"><rect x="0" y="788" width="1280" height="12" fill="url(#chassisG)"/></g><rect x="0" y="788" width="1280" height="3" fill="url(#lipG)"/>`;
}

// ---------------- P1: the header rail ----------------
function railG({ seat = 'HELM', auth = null, authCaution = false, battle = false, day = '000', time = '00:33', warp = '1X', held = null, paused = false } = {}) {
  let s = `<g filter="url(#shadow)"><rect x="0" y="0" width="1280" height="26" fill="url(#chassisG)"/></g>
   <rect x="0" y="21.5" width="1280" height="1" fill="#211b17"/><rect x="0" y="22.5" width="1280" height="3.5" fill="${C.orange}"/>`;
  s += lg(10, 15.5, 'SEAT') + flapG(42, 3, seat.padEnd(12), { cw: 9.4, ch: 16, size: 13.5 });
  // who flies, when it is not the captain at the helm by hand
  const t = tubeG(172, 3, 376, 16, { r: 2, bezel: 2.5 });
  s += t.under + (auth ? tt(180, 15.5, (authCaution ? '▲ ' : '') + auth, { size: 13 }) : '') + t.over;
  s += pushG(563, 3, 128, 16, ['BATTLE STATIONS'], { color: 'amber', lit: battle });
  s += lg(706, 15.5, 'DAY') + drumG(733, 3, day, { cw: 11, ch: 16, size: 15 }) + drumG(775, 3, time, { cw: 11, ch: 16, size: 15, dimLead: false });
  s += lg(842, 15.5, 'WARP') + flapG(878, 3, warp.padEnd(6), { cw: 9.4, ch: 16, size: 13.5 });
  const th = tubeG(944, 3, 240, 16, { r: 2, bezel: 2.5 });
  s += th.under + (held ? tt(952, 15.5, held, { size: 13 }) : '') + th.over;
  s += pushG(1199, 3, 72, 16, ['PAUSED'], { color: 'white', lit: paused });
  return s;
}

// ---------------- P2: the caution board (split flaps, hung from the rail) ----------------
function sevLensG(x, y, w, h, sev, fresh) {
  const [on] = LAMP[sev === 'warning' ? 'red' : 'amber'];
  return `<rect x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="1.5" fill="${C.alu}"/>
   ${fresh ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)"/>` : ''}
   <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="${on}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>
   <text x="${x + w / 2}" y="${y + h / 2 + 4.5}" text-anchor="middle" font-size="12.5" fill="#2a1606">${sev === 'warning' ? '◆' : '▲'}</text>`;
}
// handling: null = this code has none; 0 = nobody on it (barber flag); n = crew on it
function handG(x, y, w, h, hand) {
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" rx="1.5" fill="#0d0b0a"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#24211f"/>`;
  if (hand === null || hand === undefined) return s;
  if (hand === 0) return s + `<rect x="${x}" y="${y + 2}" width="${w}" height="${h - 4}" fill="url(#barber)"/>`;
  const fx = x + 9, fy = y + h / 2;
  s += `<circle cx="${fx}" cy="${fy - 3.6}" r="2.6" fill="${LAMP.white[0]}"/><path d="M${fx - 4.2} ${fy + 6}Q${fx - 4.2} ${fy - 0.4} ${fx} ${fy - 0.4}Q${fx + 4.2} ${fy - 0.4} ${fx + 4.2} ${fy + 6}Z" fill="${LAMP.white[0]}"/>`;
  s += `<text x="${x + w - 9}" y="${y + h / 2 + 5}" text-anchor="middle" class="drum" font-size="15" fill="#F3EEE2">${hand}</text>`;
  return s;
}
function cwBoardG(rows, { more = 0 } = {}) {
  const x = 12, y = 38, w = 308, rh = 21, n = rows.length + (more ? 1 : 0), h = n * rh + 5;
  let s = rodsG([46, 286], 22, y + 3);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#14110e"/></g>
   <rect x="${x + 0.75}" y="${y + 0.75}" width="${w - 1.5}" height="${h - 1.5}" rx="3" fill="none" stroke="${C.alu}" stroke-width="1.5"/>`;
  rows.forEach((r, i) => {
    const yy = y + 4 + i * rh, ch = rh - 5;
    s += sevLensG(x + 6, yy, 20, ch, r.sev, r.fresh);
    s += flapG(x + 32, yy, r.code.padEnd(15).slice(0, 15), { cw: 7.8, ch, size: 13 });
    s += flapG(x + 153, yy, (r.detail || '').padEnd(9).slice(0, 9), { cw: 7.8, ch, size: 13 });
    s += handG(x + 228, yy, 34, ch, r.hand);
    if (r.timer) s += drumG(x + 271, yy, r.timer, { cw: 9, ch, size: 15, dimLead: false });
  });
  if (more) {
    const yy = y + 4 + rows.length * rh;
    s += flapG(x + 32, yy, ('+' + more + ' MORE').padEnd(15), { cw: 7.8, ch: rh - 5, size: 13, fill: '#c9c0ac' });
  }
  return s;
}

// ---------------- P3: the threat unit (hung from the rail, top centre) ----------------
function threatUnitG({ count = 2, impact = 'T-37 S', decoy = 'READY', pd = true } = {}) {
  const x = 390, y = 38, w = 500, h = 64;
  let s = rodsG([430, 850], 22, y + 3);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#chassisG)"/></g><rect x="${x}" y="${y + h - 3}" width="${w}" height="3" rx="1" fill="${C.red}"/>`;
  s += pushG(x + 9, y + 8, 54, h - 18, ['MISSILE'], { color: 'red', lit: true });
  const tx = x + 74, tw = 268, t = tubeG(tx, y + 7, tw, h - 16, { r: 4, bezel: 4 });
  s += t.under + `<text x="${tx + tw / 2}" y="${y + 30}" class="vt" font-size="25" text-anchor="middle" fill="${PH.red}" filter="url(#glow)">MISSILES INBOUND · ${count}</text>
   <text x="${tx + tw / 2}" y="${y + 51}" class="vt" font-size="23" text-anchor="middle" fill="${PH.red}" filter="url(#glow)">IMPACT ${impact}</text>` + t.over;
  s += pushG(x + 354, y + 8, 56, h - 18, ['DECOY', decoy], { color: 'green', lit: decoy === 'READY' });
  s += keyG(x + 421, y + 25, 'F');
  s += pushG(x + 435, y + 8, 56, h - 18, ['PD', 'ENGAGING'], { color: 'white', lit: pd });
  return s;
}

// ---------------- P4: the intercom repeater (hung from the rail, top right) ----------------
function intercomG(lines, { x = 960, y = 38, w = 308 } = {}) {
  const h = 16 + lines.length * 18;
  let s = rodsG([x + 40, x + w - 40], 22, y + 3);
  const t = tubeG(x + 6, y + 5, w - 12, h - 10, { r: 4, bezel: 4 });
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${C.bakelite}"/></g>` + t.under;
  lines.forEach((l, i) => {
    const yy = y + 22 + i * 18;
    s += tt(x + 15, yy, l.tag.padEnd(4), { rev: true, w: 40, size: 12.5 });
    s += tt(x + 62, yy, l.text, { size: 13, c: l.old ? 'dim' : 'amber' });
  });
  return s + t.over;
}

// ---------------- X3: the emergency placard (hung from the rail, top centre) ----------------
function placardG({ head = 'SHIP DISABLED: NO POWER', tow = '3,400 CR · −3 STANDING', pending = null } = {}) {
  const x = 390, y = 38, w = 500, h = 136;
  let s = rodsG([430, 850], 22, y + 3);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#hazard)"/></g>`;
  s += `<rect x="${x + 7}" y="${y + 7}" width="${w - 14}" height="${h - 14}" rx="3" fill="url(#chassisG)"/>`;
  const t = tubeG(x + 18, y + 16, w - 36, 32, { r: 3, bezel: 4 });
  s += t.under + `<text x="${x + w / 2}" y="${y + 41}" class="vt" font-size="27" text-anchor="middle" fill="${PH.red}" filter="url(#glow)">${esc(head)}</text>` + t.over;
  // the two ways out, each a guarded switch: lifting the guard is the first press, throwing it the second
  const way = (cx, title, key, line2, open) => {
    let g = plateG(cx - 116, y + 60, 228, 62, { screws: false });
    g += toggleG(cx - 86, y + 92, { up: false, guard: true, guardOpen: open });
    g += tag(cx - 58, y + 80, title, { size: 13.5 });
    g += keyG(cx - 58, y + 88, key, { anchor: 'start' }) + tag(cx - 36, y + 100, 'TWICE');
    if (line2) g += tag(cx - 58, y + 116, line2, { fill: '#5a4f42' });
    return g;
  };
  s += way(x + 130, 'ABANDON SHIP', 'P', null, pending === 'P');
  s += way(x + 370, 'CALL A TOW', 'B', tow, pending === 'B');
  return s;
}

// ---------------- P5: the tracked contract, clipped to the left pillar ----------------
function clipG({ y = 176, head, left, unit = 'D' }) {
  const x = 12, w = 308, h = 54;
  let s = sideRailG('L', y, h);
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#6f5f49"/></g>`;
  s += `<rect x="${x + 6}" y="${y + 9}" width="${w - 12}" height="${h - 13}" fill="${C.paper}"/>`;
  for (let yy = y + 14; yy < y + h - 6; yy += 9) s += `<circle cx="${x + 11}" cy="${yy}" r="1.6" fill="#6f5f49"/><circle cx="${x + w - 11}" cy="${yy}" r="1.6" fill="#6f5f49"/>`;
  s += `<rect x="${x + 6}" y="${y + 9}" width="${w - 12}" height="${h - 13}" fill="url(#greenbar)" opacity="0.35"/>`;
  // the clip, with the contract clock on it
  s += `<g filter="url(#shadow)"><rect x="${x + 176}" y="${y + 1}" width="120" height="20" rx="4" fill="url(#screwG)"/></g>`;
  s += tag(x + 186, y + 15.5, 'LEFT', { fill: '#3a352e' }) + drumG(x + 222, y + 3, left, { cw: 12, ch: 16, size: 15, dimLead: false, unit, unitGap: 5 });
  s += `<text x="${x + 20}" y="${y + 41}" class="paper" font-size="13.5" fill="#2a2420">${esc(head)}</text>`;
  return s;
}

// ---------------- H2: navigation tube with engraved row legends ----------------
function navG(rows, { y = 240 } = {}) {
  const x = 12, w = 308, lh = 16, th = rows.length * lh + 10, h = th + 14;
  let s = sideRailG('L', y, h) + plateG(x, y, w, h, { screws: false });
  const tx = x + 62, tw = w - 70, t = tubeG(tx, y + 7, tw, th, { r: 4, bezel: 4 });
  s += t.under;
  rows.forEach((r, i) => {
    const yy = y + 7 + 17 + i * lh;
    if (r.t) s += tt(tx + 7, yy, r.t, { c: r.c || 'amber', size: 13 });
    if (r.r) s += tt(tx + tw - 7, yy, r.r, { c: r.c || 'amber', size: 13, anchor: 'end' });
  });
  s += t.over;
  rows.forEach((r, i) => { if (r.lg) s += tag(x + 10, y + 7 + 17 + i * lh, r.lg); });
  return s;
}

// ---------------- H1: the flight pod ----------------
function pinLatchG(x, y, pinned) {
  return `<rect x="${x}" y="${y}" width="28" height="18" rx="2" fill="${C.alu}"/><g filter="url(#shadow)"><rect x="${x + 2}" y="${y + 2 + (pinned ? 1.5 : 0)}" width="24" height="13" rx="2" fill="${pinned ? C.orange : C.bakelite}"/></g>
   <text x="${x + 14}" y="${y + 13 + (pinned ? 1.5 : 0)}" text-anchor="middle" class="legend" font-size="12" fill="${pinned ? '#2a1606' : C.inkLight}">PIN</text>`;
}
// master alert cue: a dark lens reading MASTER; lit red with the warning's code, or amber with no code
function cueG(x, y, w, h, cue) {
  const lit = !!cue, col = cue && cue.sev === 'caution' ? 'amber' : 'red', [on, off] = LAMP[col];
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" rx="2" fill="${C.alu}"/>`;
  if (lit) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${lit ? on : LAMP.red[1]}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  const txt = lit ? (cue.code ? '◆ ' + cue.code : 'MASTER CAUTION') : 'MASTER';
  s += `<text x="${x + w / 2}" y="${y + h / 2 + 4.4}" text-anchor="middle" class="legend" font-size="12.5" fill="${lit ? '#2a0d06' : 'rgba(240,220,200,0.35)'}">${esc(txt)}</text>`;
  return s;
}
function triLampG(x, y, a, on) {
  const p = 'M0 -5L5 4H-5Z';
  return `<g transform="translate(${x},${y}) rotate(${a})">${on ? `<path d="${p}" fill="${LAMP.white[0]}" filter="url(#lampglow)"/>` : ''}<path d="${p}" fill="${on ? LAMP.white[0] : '#3d3a35'}" stroke="#1a1614" stroke-width="0.8"/></g>`;
}
// which thrusters fire: main forward and back, turn left and right, strafe left and right
function thrustG(cx, cy, th = {}) {
  let s = `<path d="M${cx} ${cy - 11}L${cx + 4.5} ${cy - 4}V${cy + 10}H${cx - 4.5}V${cy - 4}Z" fill="#cfc4a8" stroke="${C.ink}" stroke-width="1.3"/>`;
  s += triLampG(cx, cy + 16, 0, th.fwd) + triLampG(cx, cy - 17, 180, th.back);
  s += triLampG(cx - 12, cy + 4, 270, th.sl) + triLampG(cx + 12, cy + 4, 90, th.sr);
  // turn: curved arrows at the nose
  const arc = (dir, on) => {
    const sx = cx + dir * 8, c = on ? LAMP.white[0] : '#3d3a35';
    return `<path d="M${sx} ${cy - 2}Q${sx + dir * 6} ${cy - 9} ${sx + dir * 1} ${cy - 14}" stroke="${c}" stroke-width="2.4" fill="none" ${on ? 'filter="url(#lampglow)"' : ''}/><path d="M${sx + dir * 1} ${cy - 14}l${-dir * 5} 1l${dir * 3} 4z" fill="${c}"/>`;
  };
  s += arc(-1, th.tl) + arc(1, th.tr);
  return s;
}
// a level on a short horizontal edgewise scale
function levelG(x, y, w, frac, { h = 10, zones = [] } = {}) {
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="2" fill="${C.bakelite}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F2ECDC"/>`;
  for (const z of zones) s += `<rect x="${x + z.from * w}" y="${y + h - 3}" width="${(z.to - z.from) * w}" height="3" fill="${z.color}"/>`;
  for (let i = 0; i <= 10; i++) s += `<line x1="${x + w * i / 10}" y1="${y}" x2="${x + w * i / 10}" y2="${y + (i % 5 ? 3 : 6)}" stroke="${C.ink}" stroke-width="${i % 5 ? 0.7 : 1.2}"/>`;
  const px = x + Math.max(0, Math.min(1, frac)) * w;
  s += `<rect x="${x}" y="${y + h / 2 - 1.5}" width="${px - x}" height="3" fill="${C.ink}" opacity="0.75"/><path d="M${px} ${y + 1}V${y + h - 1}" stroke="${C.orange}" stroke-width="2.4"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  return s;
}
function flightG({ frame = 'ORBIT', name = 'EARTH', pinned = false, speed = '7672', dir = '', thrust = {}, assist = true, dv = '1240', prop = 0.72, cue = null } = {}) {
  const x = 440, y = 688, w = 400, h = 100;
  let s = podG(x, y, w, h) + plateG(x + 6, y + 10, w - 12, h - 16, { screws: false });
  s += tag(x + 14, y + 28, 'FRAME') + flapG(x + 58, y + 15, frame.padEnd(5), { cw: 10, ch: 17, size: 14 });
  s += flapG(x + 114, y + 15, name.padEnd(14).slice(0, 14), { cw: 8.4, ch: 17, size: 13.5 });
  s += pinLatchG(x + 238, y + 14, pinned);
  s += cueG(x + 276, y + 14, 110, 19, cue);
  s += drumG(x + 16, y + 46, speed, { cw: 16, ch: 28, size: 21 }) + tag(x + 16 + drumW(speed, 16) + 7, y + 64, 'M/S');
  s += flapG(x + 112, y + 52, dir.padEnd(7), { cw: 9, ch: 17, size: 13.5 });
  s += tag(x + 213, y + 47, 'THRUST', { anchor: 'middle' }) + thrustG(x + 213, y + 74, thrust);
  s += pushG(x + 250, y + 46, 44, 38, ['ROT', 'ASSIST'], { color: 'white', lit: false, flag: !assist });
  s += tag(x + 304, y + 50, 'ΔV') + drumG(x + 304, y + 55, dv, { cw: 14, ch: 21, size: 16 }) + tag(x + 304 + drumW(dv, 14) + 6, y + 70, 'M/S');
  s += levelG(x + 304, y + 80, 80, prop, { h: 8, zones: [{ from: 0, to: 0.2, color: C.mustard }] });
  return s;
}

// ---------------- H3: the docking pod ----------------
function alignG(cx, cy, r, { lat = 0, ang = 0, tol = 1, range = 5 } = {}) {
  // ship symbol displaced by the lateral offset and turned by the angle error, between the corridor's rails
  const k = (r - 10) / range;
  let s = `<circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="${C.bakelite}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#F2ECDC"/>`;
  s += `<rect x="${cx - tol * k}" y="${cy - r + 6}" width="${2 * tol * k}" height="${2 * r - 12}" fill="${C.avocado}" opacity="0.22"/>`;
  s += `<path d="M${cx - tol * k} ${cy - r + 6}V${cy + r - 6}M${cx + tol * k} ${cy - r + 6}V${cy + r - 6}" stroke="${C.avocado}" stroke-width="1.4"/>`;
  for (let m = -range; m <= range; m++) { if (!m) continue; const xx = cx + m * k; s += `<line x1="${xx}" y1="${cy - 2.5}" x2="${xx}" y2="${cy + 2.5}" stroke="${C.ink}" stroke-width="${m % 5 ? 0.8 : 1.4}"/>`; }
  s += `<line x1="${cx}" y1="${cy - r + 4}" x2="${cx}" y2="${cy - r + 12}" stroke="${C.ink}" stroke-width="1.6"/><path d="M${cx - 4} ${cy - r + 15}l4 -6l4 6" stroke="${C.ink}" stroke-width="1.3" fill="none"/>`;
  s += tag(cx - r + 8, cy + 16, 'L', { fill: '#6b6254' }) + tag(cx + r - 14, cy + 16, 'R', { fill: '#6b6254' });
  s += `<g filter="url(#shadow)" transform="translate(${cx + lat * k},${cy}) rotate(${ang})"><path d="M0 -15L5 -7V12H-5V-7Z" fill="${C.orange}" stroke="#1a1614" stroke-width="1"/><path d="M-11 4H11" stroke="#1a1614" stroke-width="2"/></g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#glassG)"/>`;
  return s;
}
function closingG(cx, cy, r, { v = 6.2, safe = 4.8, max = 12 } = {}) {
  const zones = [{ from: 0, to: safe, color: C.avocado }, { from: safe, to: safe * 2, color: C.mustard }, { from: safe * 2, to: max, color: C.red }];
  let s = gaugeG(cx, cy, r, { min: 0, max, value: v, zones, ends: true });
  const a = (150 + safe / max * 240) * Math.PI / 180;

}
// H4 on deck: no plan (the deck is the plan), shown only while a light is lit
function condDeckG({ lights = {}, bars = [], worst = '' } = {}) {

// ---------------- the world ----------------
function shipG(x, y, rot, k = 0.62) { return hullG(x, y, rot, k); }
function frameTagG(x, y, t) { return wtext(x, y, t, { c: 'dim', size: 12 }); }
function edgeMarkG(x, y, ang, lines, { col = 'amber', mark = null } = {}) {
  let s = edgeG(x, y, ang, lines, { col });
  if (mark) {
    const right = !(ang > 90 || ang < -90), tw = Math.max(...lines.map(l => l.length)) * 7.8;
    const mx = right ? x - 14 - tw - 16 : x + 14 + tw + 16;
    s += mark === 'nav' ? navBracketG(mx, y, 8, PH[col]) : tgtBracketG(mx, y, 8, PH[col]);
  }
  return s;
}
function corridorW4(x, y0, y1, state) {
  // safe, fast and danger differ by line as well as colour: solid, dashed, dotted
  const col = state === 'safe' ? PH.green : state === 'fast' ? PH.amber : PH.red;
  const dash = state === 'safe' ? '' : state === 'fast' ? 'stroke-dasharray="10 6"' : 'stroke-dasharray="3 4"';
  let s = `<g filter="url(#glow)" stroke="${col}" stroke-width="1.5" fill="none" opacity="0.9"><path d="M${x - 14} ${y0}V${y1}M${x + 14} ${y0}V${y1}" ${dash}/>`;
  for (let yy = y1 - 26; yy > y0 + 12; yy -= 38) s += `<path d="M${x - 6} ${yy + 4}L${x} ${yy - 3}L${x + 6} ${yy + 4}"/>`;
  return s + `</g>`;
}
