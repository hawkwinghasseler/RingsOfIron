<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ship Stations in Yard Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@600&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@300;400;500&family=Special+Elite&family=VT323&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0c; }
  svg { display: block; margin-bottom: 8px; }
  .legend { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .crt { font-family: 'IBM Plex Mono', monospace; }
  .vt { font-family: 'VT323', monospace; }
  .drum { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }
  .dymo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
  .paper { font-family: 'Special Elite', monospace; }
  .stencil { font-family: 'Big Shoulders Stencil Display', sans-serif; font-weight: 800; }
  .ooc { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<!-- Ship Stations functional design (round 8) skinned in Yard Standard: round 2. 1280 x 800 UI units. -->
<svg id="C-helm-green" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="D-helm-approach" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="E-weapons-red" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="B-deck-alert" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="G-docked-link" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="K-kit-states" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="K2-kit-pages" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="K3-world-deck" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../cassette/kit.js"></script>
<script>
// =====================================================================
// Ship Stations (spec round 8) in the Yard Standard, round 2.
// The seated band stands flush with the bottom edge (y 616 to 800), which the spec allows.
// The top column is a rack: two hanger rods from the top edge, and each overhead unit clamps to
// them at its fixed height. A unit with nothing to say is drawn up out of sight; the others keep
// their heights, so the ticker is always at y 108.
// =====================================================================
const XDEFS = `<defs>
  <filter id="projglow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="thinair" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#bcd6ff"/></pattern>
  <pattern id="crates" width="27" height="27" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="24" height="24" rx="1.5" fill="#3a3830" stroke="#23221d" stroke-width="1.5"/><path d="M1.5 1.5L25.5 25.5M25.5 1.5L1.5 25.5" stroke="#2c2a24" stroke-width="1.2"/></pattern>
  <radialGradient id="fireG" cx="0.5" cy="0.6" r="0.6"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ff7a2a"/><stop offset="1" stop-color="#c8361c" stop-opacity="0"/></radialGradient>
  <radialGradient id="smokeG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8d8a84" stop-opacity="0.45"/><stop offset="1" stop-color="#8d8a84" stop-opacity="0"/></radialGradient>
  <radialGradient id="battleG" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#ff2a10" stop-opacity="0.07"/><stop offset="1" stop-color="#ff2a10" stop-opacity="0.2"/></radialGradient>
  <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EBD9"/><stop offset="1" stop-color="#E4DBC6"/></linearGradient>
  <linearGradient id="livG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#727563"/><stop offset="1" stop-color="#4a4d40"/></linearGradient>
</defs>`;

// Lamps sit in a dark bezel ring, so a lit white lens reads as lit on beige enamel
const kitLampG = lampG;
lampG = (cx, cy, r, color, lit) => `<circle cx="${cx}" cy="${cy}" r="${r + 2.9}" fill="#2b2723"/>` + kitLampG(cx, cy, r, color, lit);
// The home bug: a house-shaped index in ink under a delta-v scale, never a triangle (the caution glyph)
const homeBugG = (x, y) => `<path d="M${x} ${y}l5 4.2v6h-10v-6z" fill="#2a2420" stroke="#F3EEE2" stroke-width="0.6"/>`;
const kitHmeterG = hmeterG;
hmeterG = (x, y, w, o = {}) => {
  const bugs = o.bugs || [], min = o.min ?? 0, max = o.max ?? 100, h = o.h ?? 16;
  let s = kitHmeterG(x, y, w, { ...o, bugs: bugs.filter(b => !b.home) });
  for (const b of bugs.filter(b => b.home)) s += homeBugG(x + (Math.max(min, Math.min(max, b.v)) - min) / (max - min) * w, y + h + 3);
  return s;
};
const fit = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;   // long names are cut, never wrapped
const lw = t => t.length * 6.7;                                      // width of a 12-unit legend
const DIM_INK = '#8f8578';

// World labels are light on glass: a lighter weight and a thinner halo than the tubes' text
function wl(x, y, t, { c = 'amber', size = 13, anchor = 'start' } = {}) {
  return `<text x="${x}" y="${y}" class="crt" font-size="${size}" text-anchor="${anchor}" font-weight="300" fill="${PH[c] || c}" filter="url(#projglow)" xml:space="preserve">${esc(t)}</text>`;
}
// A burn: a double chevron along the burn's direction, with its number and countdown
function burnMarkG(x, y, rot, label) {
  return `<g filter="url(#projglow)" transform="translate(${x},${y}) rotate(${rot})" stroke="${WS.a}" stroke-width="1.8" fill="none"><path d="M-9 -7L-1 0L-9 7M-1 -7L7 0L-1 7"/></g>` + wl(x + 16, y + 5, label);
}
// A small lens with a fixed legend, lit or dark; dark lenses keep their legend faintly
function lensS(x, y, w, h, text, color = null, { glow = true, base = 'white' } = {}) {
  const lit = !!color, [on, off] = LAMP[color || base];
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" rx="2" fill="${C.alu}"/>`;
  if (lit && glow) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)" opacity="0.6"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" fill="${lit ? on : off}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  s += `<text x="${x + w / 2}" y="${y + h / 2 + 4.2}" text-anchor="middle" class="legend" font-size="12" fill="${lit ? '#241406' : 'rgba(240,230,210,0.42)'}">${esc(text)}</text>`;
  return s;
}
function dymoG(x, y, t, { fill = '#1C1B1A' } = {}) {
  const w = t.length * 7.6 + 10;
  return `<g transform="translate(${x},${y})"><rect width="${w}" height="15" rx="1.5" fill="${fill}"/><text x="${w / 2}" y="11.5" text-anchor="middle" class="dymo" font-size="12" fill="#f4efe6">${esc(t)}</text></g>`;
}
function engrave(x1, y1, x2, y2) {
  return `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#9f957c" stroke-width="1"/><path d="M${x1 + (y1 === y2 ? 0 : 1)} ${y1 + (y1 === y2 ? 1 : 0)}L${x2 + (y1 === y2 ? 0 : 1)} ${y2 + (y1 === y2 ? 1 : 0)}" stroke="#f4eedd" stroke-width="0.8"/>`;
}

// =====================================================================
// THE TOP COLUMN: status strip (y 16), annunciator (y 44), warp strip (y 84), ticker (y 108)
// =====================================================================
const TC = { x: 280, w: 720 };
function rackG(x, bottom) {
  const rod = rx => `<rect x="${rx}" y="0" width="3.5" height="${bottom}" fill="#4a443f"/><rect x="${rx + 0.6}" y="0" width="1" height="${bottom}" fill="#fff" opacity="0.14"/>`;
  return rod(x + 30) + rod(x + TC.w - 34);
}
function unitBarG(x, y, w, h) {
  return `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="url(#chassisG)"/></g><rect x="${x + 2}" y="${y}" width="${w - 4}" height="1.2" fill="#76685b"/>`;
}
// Z1s: the condition on a drum flag (blank in Green), BATTLE STATIONS, DOCKED and LATCHED on lenses
// with fixed legends, and the emergency on a red-phosphor tube
function statusStripG(x, { cond = null, battle = false, state = null, emerg = null } = {}) {
  const y = 16, w = TC.w, h = 24;
  let s = unitBarG(x, y, w, h);
  if (cond) s += condFlagG(x + 6, y + 4, 84, 16, cond);
  else s += `<rect x="${x + 3}" y="${y + 1}" width="90" height="22" rx="2.5" fill="${C.bakelite}"/><rect x="${x + 6}" y="${y + 4}" width="84" height="16" fill="url(#drumG)"/>`;
  s += lensS(x + 104, y + 4, 120, 16, 'BATTLE STATIONS', battle ? 'red' : null);
  s += lensS(x + 234, y + 4, 62, 16, 'DOCKED', state === 'DOCKED' ? 'white' : null) + lensS(x + 304, y + 4, 66, 16, 'LATCHED', state === 'LATCHED' ? 'white' : null);
  const t = tubeG(x + 382, y + 3, w - 388, 18, { r: 2, bezel: 3 });
  s += t.under;
  if (emerg) {
    let ex = x + 390;
    for (const seg of emerg) {
      if (seg.k) { for (let i = 0; i < (seg.n || 1); i++) { s += tt(ex + 2, y + 16.5, seg.k, { rev: true, w: 14, size: 12.5, c: 'red' }); ex += 17; } ex += 4; }
      else { s += tt(ex, y + 16.5, seg.t, { size: 12.5, c: seg.c || 'red' }); ex += seg.t.length * 7.5; }
    }
  }
  return s + t.over;
}
// Z1: one row. Master WARNING at the left, master CAUTION at the right, six tiles between.
// A tile: its tag on a lens lit in its role, its value on eight split flaps under it.
function annTileG(x, y, t) {
  const w = 94, h = 36;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#0c0a09"/>`;
  if (!t) return s + `<rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="15" fill="#2a2420"/>` + flapG(x + 9, y + 20, '        ', { cw: 9.5, ch: 13, size: 12 });
  const color = t.sev === 'w' ? 'red' : 'amber', [on] = LAMP[color], op = t.clearing ? 0.4 : 1;
  s += `<g opacity="${op}">`;
  if (!t.ack && !t.clearing) s += `<rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="15" fill="${on}" filter="url(#lampglow)" opacity="0.8"/>`;
  s += `<rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="15" fill="${on}"/><rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="15" fill="url(#glassG)"/>`;
  s += `<text x="${x + w / 2}" y="${y + 13.8}" text-anchor="middle" class="legend" font-size="12" fill="#241406">${t.sev === 'w' ? '◆ ' : '▲ '}${esc(t.tag)}</text>`;
  s += flapG(x + 9, y + 20, (t.val || '').padEnd(8).slice(0, 8), { cw: 9.5, ch: 13, size: 12 });
  s += `</g>`;
  if (t.fresh) s += `<rect x="${x - 2.5}" y="${y - 2.5}" width="${w + 5}" height="${h + 5}" rx="3.5" fill="none" stroke="${on}" stroke-width="2" opacity="0.85" filter="url(#lampglow)"/>`;
  return s;
}
function annG(x, tiles, { mw = false, mc = false } = {}) {
  const y = 44, w = TC.w, h = 36;
  let s = unitBarG(x, y, w, h);
  s += pushG(x + 4, y + 4, 48, 28, ['MASTER', 'WARNING'], { color: 'red', lit: mw });
  s += pushG(x + w - 52, y + 4, 48, 28, ['MASTER', 'CAUTION'], { color: 'amber', lit: mc });
  for (let i = 0; i < 6; i++) s += annTileG(x + 62 + i * 100, y, tiles[i]);
  return s;
}
// Z1w: only in warp. The rate on flaps, RAILS on a lamp, the drop-out (or why it is held) on a tube
function warpStripG(x, rate, text, { held = false, y = 84 } = {}) {
  const w = TC.w, h = 20;
  let s = unitBarG(x, y, w, h);
  s += tag(x + 10, y + 14.5, 'WARP', { fill: C.inkLight }) + flapG(x + 48, y + 3, rate.padEnd(6), { cw: 9, ch: 14, size: 12.5, fill: PH.amber });
  s += lampG(x + 120, y + 10, 3.6, 'white', true) + tag(x + 128, y + 14.5, 'RAILS', { fill: C.inkLight });
  const t = tubeG(x + 176, y + 3, w - 182, 14, { r: 2, bezel: 2 });
  s += t.under + tt(x + 184, y + 14, text, { size: 12.5, c: held ? 'amber' : 'dim' }) + t.over;
  return s;
}
// Z2: three lines, newest at the bottom: station tag in reverse, the speaker, what they said
function tickerG2(x, lines, { y = 108 } = {}) {
  const w = TC.w, h = 60;
  let s = `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${C.bakelite}"/></g>`;
  const t = tubeG(x + 5, y + 5, w - 10, h - 10, { r: 4, bezel: 4 });
  s += t.under;
  lines.forEach((l, i) => {
    const yy = y + 21 + i * 16, mk = l.sev === 'w' ? '◆' : l.sev === 'c' ? '▲' : ' ';
    s += tt(x + 14, yy, mk, { c: l.sev === 'w' ? 'red' : 'amber', size: 13 });
    s += `<g filter="url(#glow)"><rect x="${x + 27}" y="${yy - 11}" width="46" height="13.5" fill="${PH.amber}"/></g><text x="${x + 30}" y="${yy}" class="crt" font-size="12.5" font-weight="500" fill="${C.crtBlack}">${esc(l.tag)}</text>`;
    s += tt(x + 84, yy, l.who + ': ' + l.text, { size: 13 });
  });
  return s + t.over;
}
// The whole column, positioned (recentred left of a side panel when one is open)
function topColumnG({ x = TC.x, strip = null, ann = null, warp = null, ticker = null } = {}) {
  const bottom = ticker ? 112 : warp ? 88 : ann ? 48 : strip ? 20 : 0;
  if (!bottom) return '';
  let s = rackG(x, bottom);
  if (strip) s += statusStripG(x, strip);
  if (ann) s += annG(x, ann.tiles, ann);
  if (warp) s += warpStripG(x, warp.rate, warp.text, warp);
  if (ticker) s += tickerG2(x, ticker);
  return s;
}

// =====================================================================
// THE BAND: MFDs 288 x 160 at x 96 and 896, cluster 480 x 160 at x 400, station board under them
// =====================================================================
const B = { y: 616, mfdL: 96, cl: 400, mfdR: 896, w: 288, cw: 480, h: 160, board: 780 };
function sill() { return podG(88, 768, 1104, 32, { stripe: false, r: 4 }); }
// A station tile: number and name on a lens (lit white for the player's own stations in Yellow and
// Red), the occupant on a label, and the alert on a lens of its own, so both show at once
function boardTileG(x, y, t, dim) {
  const w = 146, h = 22, lw0 = 62, you = t.you && !dim;
  const [on, off] = LAMP.white;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#2f2924"/>`;
  s += `<rect x="${x + 2}" y="${y + 2}" width="${lw0}" height="${h - 4}" rx="1.5" fill="${C.alu}"/>`;
  if (you) s += `<rect x="${x + 4}" y="${y + 4}" width="${lw0 - 4}" height="${h - 8}" fill="${on}" filter="url(#lampglow)" opacity="0.6"/>`;
  s += `<rect x="${x + 4}" y="${y + 4}" width="${lw0 - 4}" height="${h - 8}" rx="1" fill="${you ? on : off}"/><rect x="${x + 4}" y="${y + 4}" width="${lw0 - 4}" height="${h - 8}" fill="url(#glassG)"/>`;
  s += `<text x="${x + 4 + (lw0 - 4) / 2}" y="${y + h / 2 + 4.3}" text-anchor="middle" class="legend" font-size="12" fill="${you ? '#241406' : 'rgba(240,230,210,0.55)'}">${t.num} ${esc(t.name)}</text>`;
  s += `<text x="${x + lw0 + 9}" y="${y + h / 2 + 4.3}" class="legend" font-size="12" fill="${t.struck ? '#7d7466' : C.inkLight}">${esc(t.occ || '')}</text>`;
  // the alert part is a jewel lamp in a dark bezel, so unlit it reads as a lamp, not an empty box
  const ax = x + w - 22, jx = ax + 9, jy = y + h / 2, jr = 7;
  s += `<circle cx="${jx}" cy="${jy}" r="${jr + 2.6}" fill="#1f1b18"/>`;
  if (t.alert) {
    const [aon] = LAMP[t.alert === 'w' ? 'red' : 'amber'];
    s += `<circle cx="${jx}" cy="${jy}" r="${jr}" fill="${aon}" filter="url(#lampglow)" opacity="0.75"/><circle cx="${jx}" cy="${jy}" r="${jr}" fill="${aon}"/>`;
    s += `<text x="${jx}" y="${jy + 3.6}" text-anchor="middle" font-size="9.5" fill="#241406">${t.alert === 'w' ? '◆' : '▲'}</text>`;
  } else s += `<circle cx="${jx}" cy="${jy}" r="${jr}" fill="#3b2c22"/>`;
  s += `<circle cx="${jx}" cy="${jy}" r="${jr}" fill="url(#glassG)"/><ellipse cx="${jx - 2}" cy="${jy - 2.6}" rx="3" ry="1.6" fill="#fff" opacity="${t.alert ? 0.35 : 0.16}"/>`;
  if (t.badge) s += `<g filter="url(#shadow)"><path d="M${ax - 22} ${y + 4}h14l4 4v10h-18z" fill="url(#paperG)"/></g><path d="M${ax - 8} ${y + 4}v4h4" fill="none" stroke="#9f957c" stroke-width="0.8"/><path d="M${ax - 19} ${y + 11}h10M${ax - 19} ${y + 14.5}h8" stroke="#6b6254" stroke-width="1"/>`;
  if (t.struck) s += `<rect x="${x + 3}" y="${y + h / 2 - 1.5}" width="${w - 6}" height="3" fill="url(#barber)"/>`;
  return s;
}
function boardG(tiles, { dim = false, day = '3', time = '14:22:05' } = {}) {
  let s = '';
  tiles.forEach((t, i) => s += boardTileG(96 + i * 150 + 2, B.board - 4, t, dim));
  const cx = 1000, ink = dim ? DIM_INK : C.inkLight;
  s += tag(cx + 6, B.board + 11.5, 'DAY', { fill: ink }) + drumG(cx + 34, B.board - 3, day, { cw: 11, ch: 17, size: 13.5, dimLead: false }) + drumG(cx + 58, B.board - 3, time, { cw: 11, ch: 17, size: 13.5, dimLead: false });
  if (dim) s += `<rect x="96" y="${B.board - 6}" width="1088" height="26" fill="#000" opacity="0.36"/>`;
  return s;
}
const T_ = (num, name, occ, o = {}) => ({ num, name, occ, ...o });

// MFDs: raised (a tube and its soft-key rail) or folded down to the rail
function mfdRaised(x, page, rail) {
  let s = podG(x, B.y, B.w, B.h);
  s += plateG(x + 5, B.y + 10, B.w - 10, 118, { screws: true });
  const tx = x + 16, ty = B.y + 18, tw = B.w - 32, th = 102;
  const t = tubeG(tx, ty, tw, th, { r: 6, bezel: 5, dead: !!rail.dead });
  s += t.under + (rail.dead ? tt(tx + tw / 2, ty + th / 2 + 4, rail.dead, { anchor: 'middle', c: 'dim' }) : page(tx, ty, tw, th)) + t.over;
  s += softRailG(x + 5, B.y + 132, B.w - 10, rail.labels, rail);
  return s;
}
function mfdFolded(x, rail) { return podG(x, B.y + 128, B.w, 32, { stripe: true }) + softRailG(x + 5, B.y + 134, B.w - 10, rail.labels, { ...rail, folded: true }); }
function title(tx, ty, tw, left, right) {
  return tt(tx + 6, ty + 14, ' ' + left.padEnd(Math.floor((tw - 12) / 7.5) - right.length - 2) + right + ' ', { rev: true, w: tw - 10, size: 12.5 });
}
const ROW = (ty, i) => ty + 18 + i * 15;

// ---------- pages ----------
function scopeG(cx, cy, r, contacts, { sweep = -40 } = {}) {
  let s = `<g filter="url(#glow)">`;
  [1, 2].forEach(k => s += `<circle cx="${cx}" cy="${cy}" r="${r * k / 2}" fill="none" stroke="${PH.gdim}" stroke-width="0.9"/>`);
  s += `<path d="M${cx - r} ${cy}H${cx + r}M${cx} ${cy - r}V${cy + r}" stroke="${PH.gdim}" stroke-width="0.7" opacity="0.6"/>`;
  for (let i = 0; i < 18; i++) { const a0 = (sweep - i * 2.5) * Math.PI / 180, a1 = (sweep - (i + 1) * 2.5) * Math.PI / 180; s += `<path d="M${cx} ${cy}L${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)}A${r} ${r} 0 0 0 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}Z" fill="${PH.green}" opacity="${0.2 * (1 - i / 18)}"/>`; }
  s += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(sweep * Math.PI / 180)}" y2="${cy + r * Math.sin(sweep * Math.PI / 180)}" stroke="${PH.green}" stroke-width="1.5"/>`;
  s += sym('own', cx, cy, 4, PH.green, { w: 1.2 });
  for (const c of contacts) {
    if (c.k === 'msl') s += `<path d="M${c.x - 4} ${c.y}h8" stroke="${PH.red}" stroke-width="2"/>`;
    else s += sym(c.k, c.x, c.y, c.s || 3.5, c.col || PH.green, { fill: c.fill, w: 1.2 });
    if (c.lock) s += sym('bracket', c.x, c.y, 8, PH.green, { w: 1.1 });
  }
  return s + `</g>`;
}
function pageSENSORS(tx, ty, tw, th) {
  let s = title(tx, ty, tw, 'SENSORS', '5 KM');
  const cx = tx + 48, cy = ty + 62;
  s += scopeG(cx, cy, 38, [{ k: 'hostile', x: cx + 30, y: cy - 10, fill: true, col: PH.red, lock: true }, { k: 'msl', x: cx + 14, y: cy - 22 }, { k: 'msl', x: cx + 21, y: cy - 19 }, { k: 'station', x: cx - 26, y: cy + 20, s: 3, col: PH.gdim }]);
