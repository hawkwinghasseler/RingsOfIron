<!doctype html>
<html><head><meta charset="utf-8"><title>Stations: reactor console in a fire</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="stations.js"></script>
<script>
// Walkthrough F (round 7): on deck at the reactor console, the Engineering panel open on its Power
// tab. Eight seconds ago a hit shorted the AFT STBD gun (the laser); its sparks lit the carpet
// beside it, and Ada is on the fire. The hit also left the reactor at 2.6 of 3.0 MW and the NOSE
// gun disabled. The raider has broken off but is still inside 50 km: condition YELLOW.
// Timings from the game: a short empties its circuit's store, which refills in 2 s
// (PowerCircuit.recharge, STORE_SECONDS), so 8 s on the store is full again; the breaker recloses
// 45 s after the short (DamageStates.AUTO_RESET), so 37 s remain; a caution line holds 10 s.
let s = space({ planet: false, seed: 11 });

// The world: the corvette's deck, the camera on the captain and moved 240 left (6.2), so the
// avatar stands in the middle of the 784 the panel leaves. The Hold is off the left edge.
const K = 56, OX = 396 - 14.45 * K, OY = 400 - (6 - 3.5) * K, X = tx => OX + tx * K, Y = ty => OY + (6 - ty) * K;
s += corvetteDeck(OX, OY, K, {
  id: 's3',
  fire: [[12.3, 2.3, 0.85], [12.95, 1.95, 0.7], [11.9, 2.9, 0.55]], fireRoom: 'bridge',
  smoke: [[12.5, 3.0, 1.5], [11.4, 3.5, 1.0]],
  short: [11.5, 1.35], scorch: [[16.5, 2.5]],
  alarm: [[13.5, 1.08, -Math.PI / 2]],
  // Engineering has two cautions: its consoles (the reactor, life support) glow amber (11.6);
  // the door's light on the Hold side warns of the fire beyond it
  glow: { reactor: 'caution', life: 'caution' }, door: 'bad',
  crew: [[13.5, 2.55], [10.25, 4.55], [10.3, 3.45]],   // Ada on the fire, Bea at the helm, Cole at the weapons console
  avatar: [14.45, 3.5],
  labels: true, labelAt: { bridge: [14.5, 2.2] },
});

// Top-centre column, recentred left of the panel (6.3 rule 2): status strip, annunciator, ticker
const CX = 392;
s += statusStrip({ condition: 'YELLOW', cx: CX });
s += annunciator(CX, 44, [['FIRE', 'BRIDGE', 'caution'], ['POWER', '1 SYS', 'caution']], { caution: true });
s += ticker(CX - 360, 108, [
  ['ENG', 'Ada:', "fire in the bridge, I'm on it.", 'caution'],
  ['ENG', 'SHIP:', 'short at the AFT STBD gun; its breaker recloses in 37 s.', 'caution'],
]);

// Suit readout (Z6, deck only): the room is on fire and its oxygen is falling (7.4)
s += O.dcm(16, 704, [['ROOM', 'FIRE', 'caution'], ['AIR', '102 KPA  O2 19 %', 'caution']], { w: 200 });

// The power synoptic: the corvette's real network (chassis.toml conduits), every conduit powered
// (solid green), the reactor degraded (amber), the loads white. Only the two faults carry labels,
// so the picture lists no more than the page does; its symbols are the switches (style 7).
function powerSynoptic(x0, y0, k, sel) {
  const X = tx => x0 + tx * k, Y = ty => y0 + (6 - ty) * k, P = (tx, ty) => [X(tx + 0.5), Y(ty + 0.5)];
  let c = `<polygon transform="translate(${X(13)} ${Y(3)}) scale(${k / 64})" points="${CORVETTE.hull}" fill="none" stroke="#33414D" stroke-width="${1.2 * 64 / k}"/>`;
  c += line(X(8), Y(1), X(8), Y(3), '#33414D', 1.5) + line(X(8), Y(4), X(8), Y(5), '#33414D', 1.5);
  CORVETTE.conduits.forEach(([[a, b], [d, e]]) => { const [x1, y1] = P(a, b), [x2, y2] = P(d, e); c += line(x1, y1, x2, y2, C.green, 2); });
  // the conduit in the bulkhead (edge_conduits), which keeps the engines fed with the door shut,
  // and the engines' feeds from the Hold's riser
  c += line(X(8), Y(1.5), X(8), Y(4.5), C.green, 2) + line(X(8), Y(4.5), X(8.5), Y(4.5), C.green, 2);
  c += line(X(3.5), Y(1.5), X(1.7), Y(1.5), C.green, 2) + line(X(3.5), Y(4.5), X(1.7), Y(4.5), C.green, 2);
  const box = (cx, cy, r, col, o = {}) => rect(cx - r, cy - r, 2 * r, 2 * r, { fill: C.glass, stroke: col, sw: 1.5, dash: o.dash || '' });
  const ring = (cx, cy, r, col, o = {}) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.glass}" stroke="${col}" stroke-width="1.5"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
  // loads: consoles and life support as squares, guns as circles, engines as nozzles, the port as a ring
  [[9.5, 4.5], [9.5, 3.5]].forEach(([tx, ty]) => c += box(X(tx), Y(ty), 5, C.white));   // helm, weapons console
  c += box(X(9.5), Y(2), 5, C.white);
  c += ring(X(8.5), Y(5.5), 4.5, C.white) + `<circle cx="${X(8.5)}" cy="${Y(5.5)}" r="1.6" fill="${C.white}"/>`;
  [[1.4, 1.5], [1.4, 4.5]].forEach(([tx, ty]) => c += path(`M${X(tx) + 5} ${Y(ty) - 4} L${X(tx) - 4} ${Y(ty) - 7} L${X(tx) - 4} ${Y(ty) + 7} L${X(tx) + 5} ${Y(ty) + 4} Z`, C.white, 1.5, { fill: C.glass }));
  [[11.5, 4.5], [14.5, 4.5], [14.5, 1.5]].forEach(([tx, ty]) => c += ring(X(tx), Y(ty), 5, C.white));
  // the faults: the AFT STBD gun shorted (no power: amber, dashed), the NOSE gun disabled (amber, crossed)
  const [ax, ay] = [X(11.5), Y(1.5)], [nx, ny] = [X(16.5), Y(2.5)];
  c += ring(ax, ay, 5.5, C.amber, { dash: '2.5 2' });
  c += ring(nx, ny, 5.5, C.amber) + line(nx - 3.2, ny - 3.2, nx + 3.2, ny + 3.2, C.amber, 1.5) + line(nx - 3.2, ny + 3.2, nx + 3.2, ny - 3.2, C.amber, 1.5);
  // the reactor: the source, a generator symbol, amber because it is degraded
  const [rx, ry] = [X(16), Y(4)];
  c += ring(rx, ry, 15, C.amber) + path(`M${rx - 9} ${ry} q4.5 -8 9 0 t9 0`, C.amber, 1.6);
  // the selection, the same row as the list's: a cyan ring on its symbol
  if (sel) c += `<circle cx="${ax}" cy="${ay}" r="10" fill="none" stroke="${C.cyan}" stroke-width="1.6"/>`;
  // labels on the faults only, under the hull, on leaders
  const lab = (fx, fy, lx, t) => line(fx, fy + 7, fx, Y(0) + 8, C.amber, 1) + line(fx, Y(0) + 8, lx, Y(0) + 8, C.amber, 1) + text(lx, Y(0) + 25, t, { size: 12, bold: true, fill: C.amber, anchor: 'middle', track: 0.6 });
  c += lab(ax, ay + (sel ? 4 : 0), ax, 'AFT STBD GUN') + lab(nx, ny, nx, 'NOSE GUN');
  return c;
}

// The Engineering panel: the reactor console's face standing as the side panel (Z4), full height on deck
const P = { x: 784, y: 16, w: 480, h: 768 };
s += consoleFace(P.x, P.y, P.w, P.h, {
  id: 'eng', b: 16, title: 'ENG  ·  REACTOR', titleSize: 11, plate: 'DU-6  ENG  P/N 5210-03',
  // no Shields tab: the corvette has no shield emitter, as its cluster's Shields slot is dark (8.3)
  tabs: [{ t: 'POWER', state: 'cur' }, 'ATMOS', 'DAMAGE', 'SYSTEMS', 'TANKS'],
  footer: [{ t: 'SWITCH OFF', k: 'ENT' }, { t: '' }, { t: '' }, { t: 'CLOSE', k: 'ESC' }],
  content: (gx, gy, gw, gh) => {
    let c = '';
    const L = gx + 14, R = gx + gw - 14, rule = y => line(gx + 4, y, gx + gw - 4, y, C.graticule, 1);
    const head = (y, t) => text(L, y, t, { size: 12, bold: true, fill: C.dim, track: 0.8 });
    c += rule(72);

    // Source: the reactor's output against its rating, and the circuit's store
    const gX = L + 82, gW = 118, vX = gX + gW + 18;
    c += head(104, 'REACTOR');
    c += I.hbar(gX, 100, gW, 2.6 / 3.0, { bands: [[2.6 / 3.0, 1, C.amber]], notch: 1 });
    c += text(vX, 105, '2.6', { size: 15, bold: true, fill: C.white }) + text(vX + tw('2.6', 15, true) + 6, 105, 'OF 3.0 MW', { size: 12, bold: true, fill: C.dim, track: 0.3 });
    const dw = tw('DAMAGED', 12, true, 0.5) + 14;
    c += I.box(R - dw, 90, dw, 20, 'DAMAGED', 'caution', { size: 12 });
    c += head(142, 'STORE');
    c += I.hbar(gX, 138, gW, 1, {});
    c += text(vX, 143, '100 %', { size: 15, bold: true, fill: C.white }) + text(vX + tw('100 %', 15, true) + 6, 143, 'FULL', { size: 12, bold: true, fill: C.dim, track: 0.3 });
    c += rule(166);

    // The synoptic, centred: the hull spans chassis x 0.8 to 20.2
    c += powerSynoptic(gx + gw / 2 - 10.5 * 22, 210, 22, true);
    c += rule(384);

    // Not working: only the exceptions, each with its cause and what clears it
    c += head(408, 'NOT WORKING');
    const rows = [
      { sys: 'AFT STBD GUN', st: 'NO POWER', cause: 'SHORT', clear: 'RECLOSES IN', n: '37 S', sel: true },
      { sys: 'NOSE GUN', st: 'DISABLED', cause: 'HEALTH 24 %', clear: 'REPAIR' },
    ];
    const bX = L + 136, bW = tw('NO POWER', 12, true, 0.5) + 16;
    rows.forEach((r, i) => {
      const y = 442 + i * 54;
      if (r.sel) c += rect(L - 7, y - 21, R - L + 14, 48, { stroke: C.cyan, sw: 1.5, r: 1.5 });
      c += text(L, y, r.sys, { size: 15, bold: true, fill: C.white, track: 0.3 });
      c += I.box(bX, y - 14, bW, 19, r.st, 'caution', { size: 12 });
      if (r.n) c += text(R, y, r.n, { size: 15, bold: true, fill: C.white, anchor: 'end' }) + text(R - tw(r.n, 15, true) - 7, y, r.clear, { size: 12, bold: true, fill: C.white, anchor: 'end', track: 0.3 });
      else c += text(R, y, r.clear, { size: 12, bold: true, fill: C.white, anchor: 'end', track: 0.3 });
      c += text(L, y + 19, r.cause, { size: 12, bold: true, fill: C.dim, track: 0.4 });
    });
    c += rule(536);

    // NEXT: the soonest that comes back by itself, with the breaker's wait as a bar (45 s in all)
    c += head(562, 'NEXT');
    const nX = L + 56;
    c += text(nX, 562, 'AFT STBD GUN', { size: 13, bold: true, fill: C.white, track: 0.3 });
    const bx = nX + tw('AFT STBD GUN', 13, true, 0.3) + 8;
    c += text(bx, 562, 'BACK IN', { size: 12, bold: true, fill: C.dim, track: 0.3 }) + text(bx + tw('BACK IN', 12, true, 0.3) + 6, 562, '37 S', { size: 15, bold: true, fill: C.white });
    c += rect(nX, 574, R - nX, 3, { fill: '#26303A' }) + rect(nX, 574, (R - nX) * 8 / 45, 3, { fill: C.white });
    return c;
  },
}).svg;

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
