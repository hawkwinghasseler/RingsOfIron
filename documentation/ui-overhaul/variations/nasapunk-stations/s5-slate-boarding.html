<!doctype html>
<html><head><meta charset="utf-8"><title>Stations: the slate, boarding</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="../../nasapunk/mockups/screens.js"></script>
<script src="stations.js"></script>
<script>
// The slate's Boarding tab (the stations spec, 10.4), before the party goes: seated at the helm, just
// latched onto the raider, whose reactor is down. K opened the slate on the tab, as a side panel
// (Z4) that stops above the band, so the instruments stay in sight; the top column recentres in
// what the panel leaves (6.3), and the camera's centre moves left by half the panel's width (240),
// so the ship stays in the middle of the world still in view. Latched, the status strip reads
// LATCHED, the CMD tile carries the badge, and the helm's Velocity slot reads DOCKED with the
// Reference and Next event slots dark (8.2): the port and the collar's strain are the DOCK page's.
// The title bar's live part (the captain's rank, the ship and the credits) is on the glass, under
// the tabs; the bezel carries only the panel's name.
//
// The tab is the board-or-not decision (the task spec's B1, in this spec's words): the other ship's
// state, who would go and what that leaves, the two orders with what each does, and what waits
// for the ship to be taken. All of it is the game's (Boarding, BoardingWork): the party is the
// ship's marines, or its crewmen if it has none, so on the starting corvette it is Cole, who mans
// TAC, and sending Cole leaves the weapons console empty, which the board shows the moment Cole goes.
// Both orders are open on a disabled ship: the party opens the doors it meets, and storming forces
// every shut one (prying with the power down, cutting with it up), as the game's "Force a way in"
// button does. The party goes suited, with a suit's 10 minutes of air (CrewDef.suitAir, 600 s).
let s = space({ px: 1180, py: 1500, pr: 1000, seed: 9 });
// the pair in the outside view: the raider is the corvette refitted by pirates (GameScenario's
// corvette_raider), so it is drawn on the corvette's hull in its own colours, latched along our port
// side, half a turn round, with the collar between the two ports
const SX = 400, SY = 330, HDG = 75, k = 0.9;
const port = [-Math.cos(HDG * Math.PI / 180), -Math.sin(HDG * Math.PI / 180)];   // our port side, outward
const RXc = SX + 32 * port[0], RYc = SY + 32 * port[1];
s += hull(RXc, RYc, HDG + 180, k, '#6A5A58');
s += `<g transform="translate(${SX} ${SY}) rotate(${HDG})"><rect x="-20.4" y="-4.6" width="9" height="5.6" fill="#3A3E44" stroke="#2A2E33" stroke-width="1"/></g>`;
s += hull(SX, SY, HDG, k);
s += W.contact('beaten', RXc, RYc, { label: ['RAIDER'], lx: -34, ly: -24 });

// the top column, recentred left of the panel: the strip with its LATCHED lamp, the dark
// annunciator, the ticker, where the party's word is boarding progress, so CMD's (13.4, 13.5),
// spoken by Cole, who is dealing with it
const CX = 392;
s += statusStrip({ state: 'LATCHED', cx: CX });
s += annunciator(CX, 44, [], {});
s += ticker(CX - 360, 108, [['CMD', 'Cole:', 'ready to go across, Captain.']]);

// the band: both MFDs folded (DOCK and CARGO while latched), the helm cluster with its Velocity slot
// reading DOCKED and the slots with nothing to show dark in place, the station board
s += foldedRail(Z.mfdL.x, Z.mfdL.y, [{ t: 'DOCK' }, { t: 'NAV' }, PIN, FOLDED]);
s += foldedRail(Z.mfdR.x, Z.mfdR.y, [{ t: 'CARGO' }, { t: 'COMMS' }, PIN, FOLDED]);
s += du(Z.cluster.x, Z.cluster.y, 480, 160, {
  id: 'cl', b: 8, title: 'HELM',
  content: (gx, gy, gw, gh) => {
    let c = '';
    const L = gx + 10, R = gx + gw - 10, row = i => gy + 2 + i * 28;
    for (let i = 1; i < 5; i++) c += line(gx + 4, row(i), gx + gw - 4, row(i), C.graticule, 1);
    const bw = t => tw(t, 12, true, 0.5) + 12;
    c += I.box(L, row(0) + 5, bw('DOCKED'), 18, 'DOCKED', 'normal', { size: 12 });
    c += lens(R - 36, row(0) + 6, 36, 16, 'RCS', null) + lens(R - 78, row(0) + 6, 40, 16, 'MAIN', null);
    { const lw = 64; [['GUNS', 0], ['MSL', 1], ['DECOY', 2]].forEach(([t, i]) => { c += lens(L + i * (lw + 8), row(3) + 6, lw, 16, t, null); }); }
    c += text(L, row(4) + 19, 'ΔV', { size: 12, bold: true, fill: C.dim, track: 0.4 });
    c += text(L + 120, row(4) + 19.5, '7 007', { size: 15, bold: true, fill: C.white, anchor: 'end' }) + text(L + 124, row(4) + 19, 'M/S', { size: 12, fill: C.dim });
    const bx = L + 168, bw2 = R - bx - 96, max = 8000;
    c += I.hbar(bx, row(4) + 19, bw2, 7007 / max, { notch: 520 / max });
    c += text(R - 46, row(4) + 19, 'HOME', { size: 12, bold: true, fill: C.dim, anchor: 'end', track: 0.4 }) + text(R, row(4) + 19, '520', { size: SB, bold: true, fill: C.white, anchor: 'end' });
    return c;
  },
}).svg;
s += stationBoard([[1, 'HELM', '', 'you'], [2, 'NAV', '', 'you'], [3, 'TAC', 'COLE', 'crew'], [4, 'ENG', 'ADA', 'crew'], [5, 'COMMS', '', 'you'], [6, 'CMD', 'LATCHED', 'none']], { day: 'DAY 0', time: '00:27:10' });

// ---- the slate, on its Boarding tab ----
const P = { x: 784, y: 16, w: 480, h: 592 };
const tabW = t => (tw(t, 12, true, 0.6) + 14) / 60;
s += consoleFace(P.x, P.y, P.w, P.h, {
  id: 'slate', b: 16, title: 'SLATE', titleSize: 11, plate: 'SLATE-1  CMD  P/N 6020-01',
  // the tabs the slate has now: Boarding while latched; Prisoners only when held, so not yet
  tabs: ['SHIP', 'CREW', 'MEDICAL', 'EVA', { t: 'BOARDING', state: 'cur' }, 'CONTRACTS', 'CAREER', 'LOG'].map(t => typeof t === 'string' ? { t, w: tabW(t) } : Object.assign(t, { w: tabW(t.t) })),
  // the orders on the footer's soft keys: Enter sends the party (it becomes RECALL once they are
  // across), Shift and Enter storms ("Force a way in" today), the forceful form of the same order on
  // a key the game leaves free (F is the decoy's); nothing has been pressed yet, so no response shows
  footer: [{ t: 'SEND PARTY', k: 'ENT' }, { t: 'STORM', k: '⇧ENT' }, { t: '' }, { t: 'CLOSE', k: 'ESC' }],
  content: (gx, gy, gw, gh) => {
    let c = '';
    const L = gx + 14, R = gx + gw - 14, V0 = L + 92, T = V0 + 24;
    const rule = y => line(gx + 4, y, gx + gw - 4, y, C.graticule, 1);
    const head = (y, t) => text(L, y, t, { size: 12, bold: true, fill: C.dim, track: 0.8 });
    const val = (x, y, t, o = {}) => text(x, y, t, { size: o.size || SB, bold: o.bold !== false, fill: o.c || C.white, anchor: o.anchor || 'start', track: 0.4 });
    const note = (x, y, t, fill = C.white) => text(x, y, t, { size: 12, bold: true, fill, track: 0.4 });
    // the title bar's live part, on the glass: the captain's rank, the ship and the credits
    c += text(L, gy + 40, 'ENSIGN  ·  PATROL CORVETTE', { size: 12, bold: true, fill: C.dim, track: 0.6 }) + text(R, gy + 40, '5 000 CR', { size: SB, bold: true, fill: C.white, anchor: 'end', track: 0.4 });
    c += rule(gy + 48);
    // the other ship
    c += val(L, gy + 72, 'RAIDER', { size: 15 }) + text(R, gy + 72, 'LATCHED, PORT TO PORT', { size: 12, bold: true, fill: C.dim, anchor: 'end', track: 0.5 });
    c += head(gy + 96, 'STATE') + val(V0, gy + 96, 'DISABLED: REACTOR DOWN');
    c += head(gy + 116, 'COST') + val(V0, gy + 116, 'NONE: OUTLAWS');
    c += rule(gy + 130);
    // who would go, and what that leaves
    c += head(gy + 154, 'PARTY') + text(R, gy + 154, 'THE SHIP\'S MARINES', { size: 12, bold: true, fill: C.dim, anchor: 'end', track: 0.5 });
    const gr = grid(L, gy + 178, [{ t: 'NAME', w: 84 }, { t: 'ROLE', w: 92 }, { t: 'HEALTH', w: 72, align: 'right' }, { t: 'NOW', w: 86, align: 'right' }, { t: 'SUIT AIR', w: 86, align: 'right' }], [
      [{ t: 'COLE', bold: true }, 'MARINE', '100%', 'AT TAC', '10:00'],
    ], { rule: 0, rh: 22 });
    c += gr.svg;
    const cw = tw('TAC EMPTY', 12, true, 0.5) + 14;
    c += I.box(L, gy + 216, cw, 19, 'TAC EMPTY', 'caution', { size: 12 }) + note(L + cw + 10, gy + 230, 'WHILE COLE IS ACROSS: NOBODY ON THE WEAPONS');
    c += text(L, gy + 252, 'ADA AND BEA STAY ABOARD', { size: 12, bold: true, fill: C.dim, track: 0.5 });
    c += rule(gy + 266);
    // the two orders, each with what it does
    c += head(gy + 290, 'ORDERS');
    c += val(L, gy + 314, 'SEND PARTY') + note(T, gy + 314, 'ACROSS THE COLLAR, THEN ROOM BY ROOM,') + note(T, gy + 332, 'NEAREST THE DOCK FIRST');
    c += val(L, gy + 358, 'STORM') + note(T, gy + 358, 'THE SAME, FORCING EVERY SHUT DOOR:') + note(T, gy + 376, 'PRIED OPEN, WITH ITS POWER DOWN');
    c += rule(gy + 390);
    // what waits for the ship to be taken, and when it is
    c += head(gy + 414, 'ONCE IT IS TAKEN');
    c += note(L, gy + 438, 'TAKEN WHEN NONE OF ITS CREW STILL FIGHTS');
    c += note(L, gy + 462, 'ITS SALVAGE AND CARGO COME ON THIS TAB,', C.dim);
    c += note(L, gy + 480, 'ITS CREW, HELD, ON THE PRISONERS TAB', C.dim);
    return c;
  },
}).svg;

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
