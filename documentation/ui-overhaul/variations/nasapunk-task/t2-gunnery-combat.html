<!doctype html>
<html><head><meta charset="utf-8"><title>Task: gunnery in combat</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="task.js"></script>
<script>
// Seated at the weapons console in a fight with the raider 'Vex', 3.2 km off and passing. Bea, the
// helmsman, holds the heading. Two harpoons inbound, a second apart, the first in 3 s (the one warning). A
// harpoon closes at 30 m/s² (MissileDef.closingBurn; weapons.toml leaves the harpoon's at that), so
// from 3.2 km it lands about 13 s after launch; 3 s out it is 1.1 km away, and the second, a second
// behind, 1.4 km. The spec's round 6 counts the burn in every impact time, so 0:03 is the true
// time, not the game's coasting estimate. An earlier hit lit
// the Hold, where Ada fights the fire, and wounded Cole, whom nobody is treating (two cautions).
// FLT gives way to HLM; SCH shows because FIRE and CREW are lit (section 8). The crew are the
// game's starting crew (GameScenario: Ada, engineer; Bea, crewman and helmsman; Cole, marine).
//
// The Patrol Corvette as ships.toml fits it: the coilgun in the nose, a point-defense autocannon on
// each beam forward, the harpoon launcher aft to port (magazine 4), the laser aft to starboard
// (3 km reach). At the weapons console every gun but point defense is in hand
// (PlayerGunnery.inHand). There is no shield emitter, so no shields row and no SHIELD lamp.
let s = space({ px: -300, py: 1500, pr: 1000, seed: 17 });
const SX = 640, SY = 390, HDG = 60;
// the point-defense kill ring: the autocannons' 4 km reach (about 282 px at this zoom)
s += `<circle cx="${SX}" cy="${SY}" r="282" fill="none" stroke="${C.cyan}" stroke-width="1" stroke-dasharray="2 7" opacity="0.55"/>`;
s += text(SX - 214, SY + 196, 'PD 4 KM', { size: 12, bold: true, fill: C.cyan, track: 0.6 });
s += hull(SX, SY, HDG, 0.9);
// the raider, locked: name in the world, everything else on the target card
const TX = 826, TY = 262;
s += raiderHull(TX, TY, 240, 0.42) + W.contact('hostile', TX, TY, { locked: true, label: ["RAIDER 'VEX'"], lx: 26, ly: 4 });
// one lead reticle: the coilgun is the only gun in hand that needs lead (the laser is a beam). Vex
// closes at 41 m/s and passes 0.6 km off (7.6 m/s across), and the round takes 1.05 s, so the lead
// is 44 m, 3 units at this zoom (70.6 a km): the reticle rings the target inside its brackets
const RX = TX - 3.04 * 0.824 + 0.56 * 0.567, RY = TY + 3.04 * 0.567 + 0.56 * 0.824;
s += W.hitLane(SX + 18, SY - 18, RX, RY) + W.reticle(RX, RY);
// two harpoons inbound from the east (bearing 080 in this north-up view), each on its predicted path
// to the hull, as the game draws it (missile to impact): the world is where their direction is read
// (spec round 7). Markers carry no numbers (round 4): the time to impact is the band's alone
s += W.track(`M 715 377 Q 687 392 ${SX + 16} ${SY + 10}`) + W.missile(715, 377, 241, C.red);
s += W.track(`M 740 387 Q 700 399 ${SX + 18} ${SY + 14}`) + W.missile(740, 387, 253, C.red);
// the hit already taken: an impact mark on the port side aft
s += W.impact(SX - 30, SY - 4);

// Warp is held by the fire, the game's own guard reason; no guard holds warp for hostiles (spec round 9)
s += chronometer({ day: 'DAY 3', time: '14:22:05', warp: '1×', note: 'HELD: FIRE ABOARD' });
s += annunciatorPanel({ FIRE: 'caution', CREW: 'caution' });

// ALR: the warning row with its one number and its action; the caution row under it, each caution
// naming who handles it. Point defense engaging is the warning's own second line. No bearing
// (spec round 7): where the harpoons come from is drawn in the world, by their paths, and on SNS.
s += alertBand({
  warning: { tag: 'MISSILE\n2 IN', big: 'IMPACT 0:03', line2: 'POINT DEFENSE ENGAGING', actions: [['F', 'DECOY']] },
  cautions: [['FIRE', 'HOLD', 'ADA ON IT'], ['WOUNDED', 'COLE', 'NO MEDIC FREE']],
});

// OBJ: the bounty, which is the navigation target here (no next step, so no second line)
s += objectives([{ t: "BOUNTY: RAIDER 'VEX'", left: '2D 21H', nav: true }]).svg;

// TGT: what the world can't show about the raider
s += du(1024, 328, 240, 200, {
  id: 'tgt', b: 8, title: 'TARGET',
  content: (gx, gy, gw) => {
    let c = '';
    const L = gx + 8, R = gx + gw - 8;
    c += sym.diamond(L + 6, gy + 14, 6, C.red, 1.5, C.red) + text(L + 18, gy + 19, "RAIDER 'VEX'", { size: 14, bold: true, fill: C.red, track: 0.4 });
    c += text(L + 18, gy + 37, 'CORVETTE  ·  PIRATE', { size: 12, bold: true, fill: C.dim, track: 0.3 });
    c += I.box(L, gy + 45, tw('FIRING ON YOU', 12, true, 0.5) + 14, 18, 'FIRING ON YOU', 'warning', { size: 12, fill: true });
    c += text(R, gy + 59, 'FIGHTING', { size: 12, bold: true, fill: C.white, anchor: 'end', track: 0.3 });
    // hull as a sensor estimate in four bands: four cells, as many lit as the band leaves, and the
    // band in words (no number: the sensors don't know one)
    c += text(L, gy + 86, 'HULL', { size: 12, bold: true, fill: C.dim, track: 0.4 });
    for (let i = 0; i < 4; i++) c += rect(L + 46 + i * 25, gy + 76, 22, 11, i < 3 ? { fill: C.white } : { stroke: '#4C5864', sw: 1 });
    c += text(R, gy + 86.5, 'DAMAGED', { size: TB, bold: true, fill: C.white, anchor: 'end', track: 0.2 });
    // range and closing side by side, labels over values, both at body size
    c += text(L, gy + 107, 'RNG', { size: 12, bold: true, fill: C.dim, track: 0.4 }) + text(L + 112, gy + 107, 'CLOSING', { size: 12, bold: true, fill: C.dim, track: 0.4 });
    c += text(L, gy + 125, '3.2 KM', { size: TV, bold: true, fill: C.white }) + text(L + 112, gy + 125, '41 M/S', { size: TV, bold: true, fill: C.white });
    // at constant velocity: 3.2 km closing 41 m/s with 0.6 km at closest is 41.7 m/s, 75 s out
    c += text(L, gy + 147, 'CPA', { size: 12, bold: true, fill: C.dim, track: 0.4 }) + text(L + 38, gy + 147, '0.6 KM  T−1:15', { size: TB, bold: true, fill: C.white });
    c += line(gx + 4, gy + 156, gx + gw - 4, gy + 156, C.graticule, 1);
    c += text(L, gy + 174, 'BOUNTY CONTRACT', { size: 12, bold: true, fill: C.magenta, track: 0.4 });
    return c;
  },
}).svg;

// WPN, expanded: what is in hand, one row per mount (point defense and the launcher included),
// then the decoy. No shields row: the corvette has no emitter.
s += du(ZT.arms.x, ZT.arms.y, ZT.arms.w, ZT.arms.h, {
  id: 'wpn', b: 8, title: 'WEAPONS',
  content: (gx, gy, gw) => {
    let c = '';
    const L = gx + 8, R = gx + gw - 8, X = { m: L, w: L + 72, by: L + 166, st: L + 210 };
    c += text(L, gy + 15, 'GUNS IN HAND  ·  POINT DEFENSE AUTOMATIC', { size: 12, bold: true, fill: C.dim, track: 0.3 });
    c += line(gx + 4, gy + 22, gx + gw - 4, gy + 22, C.graticule, 1);
    const rows = [
      ['NOSE', 'COILGUN', 'HAND', 'READY', 'normal', '1.1 S'],
      ['FWD PORT', 'AUTOCANNON', 'AUTO', 'ENGAGING 2', 'engaged'],
      ['FWD STBD', 'AUTOCANNON', 'AUTO', 'IDLE', 'normal'],
      ['AFT STBD', 'LASER', 'HAND', 'OUT OF RANGE', 'off'],
    ];
    const row = (i, m, w, who) => { const yy = gy + 39 + i * 19; c += text(X.m, yy, m, { size: 12, bold: true, fill: C.white, track: 0.2 }) + text(X.w, yy, w, { size: 12, fill: C.white }) + text(X.by, yy, who, { size: 12, bold: true, fill: who === 'HAND' ? C.cyan : C.dim, track: 0.2 }); return yy; };
    rows.forEach(([m, w, who, st, stS, tof], i) => {
      const yy = row(i, m, w, who);
      if (stS === 'normal') c += text(X.st, yy, st, { size: 12, bold: true, fill: st === 'IDLE' ? C.dim : C.white, track: 0.2 });
      else c += I.box(X.st - 3, yy - 13, tw(st, 12, true, 0.5) + 10, 17, st, stS, { size: 12 });
      if (tof) c += text(R - tw(tof, TV, true) - 7, yy, 'TOF', { size: 12, bold: true, fill: C.dim, track: 0.3, anchor: 'end' }) + text(R, yy + 0.5, tof, { size: TV, bold: true, fill: C.white, anchor: 'end' });
    });
    // the launcher: rounds left of its magazine of 4, ready, the seeker's lock
    const ly = row(4, 'AFT PORT', 'HARPOON', 'HAND');
    // state, rounds left, then the seeker's lock: green, a good lock (style 3), as a word for want of room
    c += text(X.st, ly, 'READY', { size: 12, bold: true, fill: C.white, track: 0.2 }) + text(X.st + tw('READY', 12, true, 0.2) + 8, ly + 0.5, '3/4', { size: TV, bold: true, fill: C.white }) + text(R, ly, 'LOCK', { size: 12, bold: true, fill: C.green, anchor: 'end', track: 0.4 });
    // the decoy, a row of the table under the launcher: the other thing the captain throws, in hand
    // (F), ready or seconds until it is (unlimited, one every 3 s: no count)
    const dy = row(5, 'DECOY', '', 'HAND');
    c += text(X.st, dy, 'READY', { size: 12, bold: true, fill: C.white, track: 0.2 });
    return c;
  },
}).svg;

// SNS: the scope on the threats, the count of hostiles under it. Range automatic (spec round 6): the
// smallest step holding every inbound missile and the Lock with room to spare, 5 km (a new step), so
// the harpoons read clear of the own-ship mark; each contact sits at its world offset over 5 km, and
// the freighter at 7 km is a tick on the rim
s += scopeDU([
  { kind: 'hostile', x: 0.528, y: -0.364, locked: true }, { kind: 'missile', x: 0.212, y: -0.038, a: 241 }, { kind: 'missile', x: 0.284, y: -0.01, a: 253 },
  { kind: 'neutral', x: -1.2, y: 0.8 },
], { heading: HDG, range: '5 KM', hostiles: '1 HOSTILE' });

// SCH: the deck plan with what is wrong in its room and no text (room names on hover only): the
// Hold hatched for the fire; crew as dots (Cole amber, hurt), the captain ringed at the weapons
// console; the hit's flash where it landed on the port hull aft
s += du(ZT.sch.x, ZT.sch.y, ZT.sch.w, ZT.sch.h, {
  id: 'sch', b: 8, title: 'SHIP',
  content: (gx, gy, gw, gh) => {
    const k = 13.4;
    return corvettePlan(gx + gw / 2 - 10.5 * k, gy + gh / 2 - 3 * k + 2, k, {
      id: 't2', hold: { state: 'fire', sev: 'caution' },
      crew: [[5.0, 3.8], [10.2, 4.5], [12.8, 2.2, C.amber]], captain: [10.2, 3.5], hit: [6.6, 5.0],
    });
  },
}).svg;

// HLM: at gunnery FLT is hidden; who flies and the order take its place. Under fire no approach can
// stand: a shot at the ship or a missile launched at it drops every order but hold position and
// match velocity (HelmOrders.threat), so Bea holds the heading with no order, as on T3 (spec round
// 9). The strip spans the gap between SHIP and WEAPONS, 12 clear of each, so a standing order with
// a whole contact name fits when there is one.
s += helmStatus(328, 736, 380, 'BEA', 'HOLDING HEADING', 'normal', 'NO ORDER');

// F is the warning's own action, so it doesn't repeat here (round 4)
s += hintLine([['SPACE', 'FIRE'], ['R', 'MISSILE'], ['TAB', 'NEXT TARGET'], ['F1', 'CONTROLS']]);

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
