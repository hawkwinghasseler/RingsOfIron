<!doctype html>
<html><head><meta charset="utf-8"><title>Task: deck, damage control</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="task.js"></script>
<script>
// On foot after a hit, on the Patrol Corvette as the game builds it (chassis.toml): two rooms, the
// Hold aft and the Bridge forward, one door between them. The camera follows the captain, standing
// at the weapons console. A fire in the Hold, Cole on it; a short on the Bridge's starboard conduit,
// Ada resetting it; a breach in the Bridge's starboard hull venting the room, with nobody on it
// (no patches left). Bea holds the helm. No warning: three cautions on the caution row.
// On deck the deck is the schematic: Z5 is empty, and FLT, WPN and SNS are hidden.
let s = space({ px: 1400, py: 1700, pr: 900, seed: 5 });
const K = 60, OX = 10, OY = 290, X = tx => OX + tx * K, Y = ty => OY + (6 - ty) * K;
s += corvetteDeck(OX, OY, K, {
  id: 't3', fire: [[5.7, 2.3, 0.85], [6.7, 1.8, 1.0], [6.4, 2.8, 0.7]], fireRoom: 'hold', smoke: [[5.1, 3.4, 1.3], [7.1, 3.3, 1.0]],
  breach: [13, 0], short: [10.5, 1.5], thin: ['bridge'],
  crew: [[4.5, 1.6], [10.6, 2.35], [10.25, 4.55]], avatar: [11.5, 3.55],
  labels: true,
});

// OVL deck overlays: a tag on each hazard with its worker's progress, or NOBODY; the worker is the
// figure standing there, and the alert band names them
s += hazardTag(X(6.6), Y(1.4), 296, 672, 'caution', 'FIRE  MEDIUM', { progress: 0.35 });
s += hazardTag(X(10.5), Y(1.3), 552, 672, 'caution', 'SHORT', { progress: 0.6, w: 92 });
s += hazardTag(X(13.5), Y(0) + 6, 796, 672, 'caution', 'BREACH  VENTING', { nobody: true });
s += O.prompt(X(14.6), Y(3.6) - 13, 'WEAPONS CONSOLE', [['E', 'USE'], ['V', 'SIT']]);

s += chronometer({ day: 'DAY 3', time: '14:22:05', warp: '1X', note: 'HELD: FIRE ABOARD' });
// three cautions, and CREW advisory: morale is low after the hit, normal but worth knowing
s += annunciatorPanel({ FIRE: 'caution', AIR: 'caution', POWER: 'caution', CREW: 'advisory' });
// PER as the suit's chest display: condition, suit and its air, the air where you stand
s += O.dcm(16, 144, [['CONDITION', 'UNHURT', 'nominal'], ['PRESSURE SUIT', 'AIR 7:40', 'nominal'], ['HERE', 'BRIDGE: THIN', 'caution']], { w: ZT.self.w });

// ALR: no warning, so the warning row is empty and the cautions keep their row (section 9.1)
s += alertBand({
  cautions: [['FIRE', 'HOLD', 'COLE ON IT'], ['VENTING', 'BRIDGE', 'NOBODY'], ['POWER', 'BRIDGE SHORT', 'ADA ON IT']],
});

// OBJ and NTF: the slow loop, top right
const ob = objectives([{ t: 'DELIVERY: ICE TO FREEHOLD', left: '1D 4H' }]);
s += ob.svg + news(ob.y, [['PAYDAY', '2\u2009000 CR PAID']]);

// HLM: who holds the ship while the captain is on foot
s += helmStatus(420, 736, 440, 'BEA', 'HOLDING HEADING', 'normal', 'NO ORDER');

s += hintLine([['W/A/S/D', 'WALK'], ['E', 'USE'], ['V', 'SIT'], ['O', 'LIGHTS'], ['F1', 'CONTROLS']]);

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
