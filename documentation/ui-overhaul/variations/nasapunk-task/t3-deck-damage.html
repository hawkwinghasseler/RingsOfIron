<!doctype html>
<html><head><meta charset="utf-8"><title>Task: deck, damage control</title>
<link rel="stylesheet" href="../../nasapunk/mockups/fonts.css">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<div id="out"></div>
<script src="../../nasapunk/mockups/lib.js"></script>
<script src="../../nasapunk/mockups/kit.js"></script>
<script src="task.js"></script>
<script>
// On foot after a hit, the camera on the captain at the life-support console. A short by the galley
// door threw sparks into the galley and lit it (DamageStates.SHORT_FIRE_CHANCE); Bo fights the fire,
// Ada resets the short (crew reset time 5 s, CrewDef.resetTime). Cargo 1 is breached and venting
// out of sight to the left, and the air here has thinned. No warning: three cautions.
// On deck the deck is the schematic, so Z5 is empty; FLT, WPN and SNS are hidden.
let s = space({ px: 1400, py: 1700, pr: 900, seed: 5 });
const K = 64, OX = -272, OY = -168, T = tx => OX + tx * K, U = ty => OY + ty * K;
s += deckView(OX, OY, K, {
  fire: true, smoke: true, breach: 'cargo1', breachAt: 3.1, breachDoor: 'open', thin: ['life'],
  short: [15.2, 6.75], alarm: [[14.35, 7.35, 0.6]], alerts: { 6: 'caution' },
  avatar: [13.3, 10.5],
  crew: [[14.7, 10.9, 'Bo'], [14.6, 6.25, 'Ada']],
  labels: true,
});
// air running out of Cargo 1 toward the breach (the room is drawn in vacuum)
for (let i = 0; i < 5; i++) s += path(`M${T(8 - i * 0.9)} ${U(8.4 + (i % 2) * 1.2)} q -30 ${18 + i * 4} -64 ${40 + i * 6}`, 'rgba(200,215,230,0.35)', 1.2, { dash: '5 6' });

// OVL deck overlays: a tag on each hazard naming who works it, the prompt at the console, an arrow
// at the edge for the breach out of sight
s += hazardTag(T(16.9), U(8.6), 864, 296, 'caution', 'FIRE  MEDIUM', 'BO');
s += hazardTag(T(15.2), U(6.75), 744, 196, 'caution', 'SHORT', 'ADA  RESET 3 S', { progress: 0.4 });
s += W.edge(14, U(11), 270, null, 'BREACH  CARGO 1  10 M', C.amber);
s += O.prompt(T(11.35), U(11.25) - 34, 'LIFE SUPPORT', [['E', 'USE']]);

s += chronometer({ day: 'DAY 3', time: '14:22:05', warp: '1X', note: 'HELD: FIRE ABOARD' });
s += annunciatorPanel({ FIRE: 'caution', AIR: 'caution', POWER: 'caution', CREW: 'caution' });
// PER as the suit's chest display: condition, suit and its air, the air here
s += O.dcm(16, 144, [['CONDITION', 'LIGHT WOUND', 'caution'], ['PRESSURE SUIT', 'AIR 7:40', 'nominal'], ['HERE', 'THIN AIR', 'caution']], { w: 240 });

// ALR: no warning, so the cautions take the band's top; by severity, then age
s += alertBand({
  cautions: [['FIRE', 'GALLEY', 'BO ON IT'], ['VENTING', 'CARGO 1', 'NOBODY ON IT'], ['POWER', 'GALLEY SHORT', 'ADA RESETTING']],
});

// OBJ and NTF: the slow loop, top right
const ob = objectives([{ t: 'DELIVERY: ICE TO FREEHOLD', left: '1D 4H' }]);
s += ob.svg + news(ob.y, [['PAYDAY', '2,000 CR PAID'], ['CONTRACT', 'TAKEN: ICE TO FREEHOLD']]);

// HLM: who holds the ship while the captain is on foot
s += helmStatus(420, 734, 440, 'CY', 'HOLDING HEADING', 'normal', 'NO ORDER');

s += hintLine([['W/A/S/D', 'WALK'], ['E', 'USE'], ['V', 'SIT'], ['O', 'LIGHTS'], ['F1', 'CONTROLS']]);

document.getElementById('out').innerHTML = svgPage(s);
</script>
</body></html>
