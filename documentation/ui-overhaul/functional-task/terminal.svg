<text x="23" y="269" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">DELIV. Food to Shackleton Ice         1,240+   +3    2d 20h  3.8 d    LATE 23h</text>
<text x="23" y="283" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">ESCORT Hauler Kestrel to Anvil Yards  1,500    +4    2d      2.1 h    ok  dv 3,000</text>
<text x="23" y="297" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">PATROL Deepwell Depot and back        1,000    +3    2d      2 h      ok  dv 1,860</text>
<text x="23" y="311" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre"></text>
<text x="23" y="325" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">'reach' = travel time and dv from here, checked against dv left and the deadline</text>
<text x="23" y="339" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre"></text>
<text x="23" y="353" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">sorted by: pay / time / distance (player's choice)</text>
<rect x="784" y="196" width="480" height="588" rx="3" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="791" y="211" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" font-style="normal" fill="#111" text-anchor="start" xml:space="preserve" style="white-space:pre">TRM.2  Delivery: Food to Shackleton Ice</text>
<text x="791" y="227" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">giver   Highport (sponsor)</text>
<text x="791" y="241" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" xml:space="preserve" style="white-space:pre">cargo   18 m3 food, loaded here</text>
