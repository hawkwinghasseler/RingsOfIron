<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Yard Standard shell</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@600&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@300;400;500&family=Special+Elite&family=VT323&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0c; }
  svg { display: block; margin-bottom: 8px; }
  .legend { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .crt { font-family: 'IBM Plex Mono', monospace; }
  .vt { font-family: 'VT323', monospace; }
  .drum { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; }
  .dymo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; }
  .paper { font-family: 'Special Elite', monospace; }
  .stencil { font-family: 'Big Shoulders Stencil Display', sans-serif; font-weight: 800; }
  .ooc { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<!-- The screens every spec shares, built in Yard Standard (style guide section 9). 1280 x 800 UI units. -->
<svg id="S1-main-menu" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S2-new-game" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S3-pause" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S4-load" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S5-save" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S6-settings" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S7-ship-lost" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="S8-mod-scripts" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="K4-off-deck-kit" width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../kit.js"></script>
<script>
// =====================================================================
// The shell: the yard office at night (style guide 9.11). It stands outside the fiction, but it is
// built from the same hardware as the ship: a desk console in Yard Standard under a big window, and
// today's menu backdrop (the drifting stars and the planet's limb) is the view through that window.
// Every screen of the shell is a faceplate on that console; pause is a hatch in the ship's console.
// =====================================================================
const XDEFS = `<defs>
  <filter id="projglow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65"/></filter>
  <filter id="inkbleed" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter>
  <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EBD9"/><stop offset="1" stop-color="#E4DBC6"/></linearGradient>
  <linearGradient id="canaryG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E8BC"/><stop offset="1" stop-color="#E4D7A0"/></linearGradient>
  <linearGradient id="tagG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2CF3E"/><stop offset="1" stop-color="#E2BB27"/></linearGradient>
  <linearGradient id="buffG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7D5AC"/><stop offset="1" stop-color="#D6C193"/></linearGradient>
  <linearGradient id="castG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2dfd8"/><stop offset="0.45" stop-color="#b5b2aa"/><stop offset="1" stop-color="#86837b"/></linearGradient>
  <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2e2621"/><stop offset="0.5" stop-color="#3a312a"/><stop offset="1" stop-color="#2a231e"/></linearGradient>
  <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b241f"/><stop offset="1" stop-color="#15110e"/></linearGradient>
  <linearGradient id="hatchG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdc2a7"/><stop offset="1" stop-color="#b5aa8f"/></linearGradient>
  <linearGradient id="doorG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e846e"/><stop offset="1" stop-color="#b7ad95"/></linearGradient>
  <linearGradient id="cassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43413d"/><stop offset="1" stop-color="#2a2826"/></linearGradient>
  <linearGradient id="spineG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4743"/><stop offset="0.5" stop-color="#34322f"/><stop offset="1" stop-color="#242220"/></linearGradient>
  <linearGradient id="teleG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d9c0"/><stop offset="1" stop-color="#c4b998"/></linearGradient>
  <radialGradient id="lampPoolG" cx="0.5" cy="0.1" r="0.8"><stop offset="0" stop-color="#ffdca8" stop-opacity="0.18"/><stop offset="1" stop-color="#ffdca8" stop-opacity="0"/></radialGradient>
  <pattern id="grilleP" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.7" fill="#2b241f"/></pattern>
  <pattern id="sprocketP" width="12" height="18" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="2.4" fill="#16171a"/></pattern>
</defs>`;

// Lamps sit in a dark bezel ring, so a lit white lens reads as lit on beige enamel (as in the variations)
const kitLampG = lampG;
lampG = (cx, cy, r, color, lit) => `<circle cx="${cx}" cy="${cy}" r="${r + 2.9}" fill="#2b2723"/>` + kitLampG(cx, cy, r, color, lit);
const lg = (x, y, t, o = {}) => tag(x, y, t, { fill: C.inkLight, ...o });          // legend painted on the dark chassis
const fit = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;                 // long names are cut, never wrapped
const typed = (x, y, t, { size = 14, fill = '#26211d', anchor = 'start' } = {}) =>
  `<text x="${x}" y="${y}" class="paper" font-size="${size}" text-anchor="${anchor}" fill="${fill}" xml:space="preserve">${esc(t)}</text>`;
const note = (x, y, t, { size = 13, fill = '#c9c2b4', anchor = 'start', weight = 400 } = {}) =>
  `<text x="${x}" y="${y}" class="ooc" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" fill="${fill}">${esc(t)}</text>`;
const head = (x, y, t, sub = '') => note(x, y, t, { size: 15, weight: 600, fill: '#ece6da' }) + (sub ? note(x, y + 19, sub, { fill: '#9d968a' }) : '');
const dimG = (o = 0.55) => `<rect width="1280" height="800" fill="#000" opacity="${o}"/>`;

// The focus pointer tab (style guide 10.2): an orange tab on the faceplate, pointing at the control
function focusTabG(x, y) { return `<path d="M${x} ${y}l-9 -6.5v13z" fill="${C.orange}" stroke="#7a3514" stroke-width="0.6"/>`; }
// A fixed-legend lens, lit or dark; a dark lens keeps its legend faintly
function lensS(x, y, w, h, text, color = null, { glow = true, base = 'white', size = 12 } = {}) {
  const lit = !!color, [on, off] = LAMP[color || base];
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" rx="2" fill="${C.alu}"/>`;
  if (lit && glow) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on}" filter="url(#lampglow)" opacity="0.6"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" fill="${lit ? on : off}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glassG)"/>`;
  s += `<text x="${x + w / 2}" y="${y + h / 2 + size * 0.35}" text-anchor="middle" class="legend" font-size="${size}" fill="${lit ? '#241406' : 'rgba(240,230,210,0.42)'}">${esc(text)}</text>`;
  return s;
}
// Split flaps
function flapC(x, y, str, { cw = 8.4, ch = 18, size = 13 } = {}) {
  let s = `<rect x="${x - 2}" y="${y - 2}" width="${str.length * cw + 4}" height="${ch + 4}" rx="1.5" fill="#0d0b0a"/>`;
  for (let i = 0; i < str.length; i++) {
    const xx = x + i * cw;
    s += `<rect x="${xx + 0.5}" y="${y}" width="${cw - 1}" height="${ch}" fill="#24211f"/><line x1="${xx + 0.5}" y1="${y + ch / 2}" x2="${xx + cw - 0.5}" y2="${y + ch / 2}" stroke="#000" stroke-width="0.8" opacity="0.7"/>`;
    if (str[i] !== ' ') s += `<text x="${xx + cw / 2}" y="${y + ch / 2 + size * 0.36}" text-anchor="middle" class="drum" font-size="${size}" fill="#F3EEE2">${esc(str[i])}</text>`;
  }
  return s;
}
function dzusG(x, y) { const a = rnd() * 180; return `<circle cx="${x}" cy="${y}" r="4.4" fill="none" stroke="#8f8571" stroke-width="0.8"/><g transform="translate(${x},${y}) rotate(${a})"><circle r="3.2" fill="url(#screwG)" stroke="#5d5a53" stroke-width="0.6"/><path d="M-2.4 0H2.4" stroke="#4b4842" stroke-width="1.3"/></g>`; }
function blankG(x, y, w, h) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#bdb29a" stroke="#8f8571" stroke-width="0.8"/><path d="M${x + 2} ${y + 1.2}H${x + w - 2}" stroke="#e7dfca" stroke-width="1" opacity="0.8"/>` + dzusG(x + 8, y + h / 2) + dzusG(x + w - 8, y + h / 2);
}
// Dymo tape: raised white letters on black (or red) tape, slightly skewed
function dymoG(x, y, t, { fill = '#1C1B1A', rot = -0.8 } = {}) {
  const w = t.length * 7.4 + 12;
  return `<g transform="translate(${x},${y}) rotate(${rot})"><rect width="${w}" height="17" rx="1.5" fill="${fill}"/><rect y="0.6" width="${w}" height="1" fill="#fff" opacity="0.12"/><text x="${w / 2}" y="12.6" text-anchor="middle" class="dymo" font-size="12" fill="#f4efe6">${esc(t)}</text></g>`;
}
// A bakelite key with a drawn arrow (no font glyphs)
function arrowKeyG(x, y, dir, { w = 22, h = 22 } = {}) {
  const cx = x + w / 2, cy = y + (h - 4) / 2 + 0.5;
  const P = { L: `M${cx + 4} ${cy - 5}L${cx - 4} ${cy}L${cx + 4} ${cy + 5}Z`, R: `M${cx - 4} ${cy - 5}L${cx + 4} ${cy}L${cx - 4} ${cy + 5}Z`,
    U: `M${cx - 5} ${cy + 3.5}L${cx} ${cy - 4.5}L${cx + 5} ${cy + 3.5}Z`, D: `M${cx - 5} ${cy - 3.5}L${cx} ${cy + 4.5}L${cx + 5} ${cy - 3.5}Z` }[dir];
  return `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${C.bakelite}"/></g><rect x="${x + 2}" y="${y + 1.5}" width="${w - 4}" height="${h - 6}" rx="2" fill="#3a3430"/><path d="${P}" fill="${C.inkLight}"/>`;
}
// Small arrow keycaps on the keycap scale (15 tall), for engraved key hints
function arrowCapG(x, y, dir) {
  const w = 15, h = 15, cx = x + w / 2, cy = y + 5.6;
  const P = { L: `M${cx + 3} ${cy - 3.6}L${cx - 3} ${cy}L${cx + 3} ${cy + 3.6}Z`, R: `M${cx - 3} ${cy - 3.6}L${cx + 3} ${cy}L${cx - 3} ${cy + 3.6}Z`,
    U: `M${cx - 3.6} ${cy + 2.6}L${cx} ${cy - 3.2}L${cx + 3.6} ${cy + 2.6}Z`, D: `M${cx - 3.6} ${cy - 2.6}L${cx} ${cy + 3.2}L${cx + 3.6} ${cy - 2.6}Z` }[dir];
  return `<g transform="translate(0,0)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2.5" fill="${C.rubber}"/><rect x="${x + 1.2}" y="${y + 0.8}" width="${w - 2.4}" height="${h - 4}" rx="2" fill="#4d4945"/><path d="${P}" fill="${C.inkLight}"/></g>`;
}

// ---------------- the office ----------------
function officeG({ sd = 23 } = {}) {
  let s = spaceG(1280, 800, { seed: sd, stars: 460, haze: false });
  // the planet's limb, as today's menu draws it: the body dark, its edge in blue rings
  s += `<circle cx="640" cy="1900" r="1500" fill="#0a131b"/>`;
  s += `<g fill="none" filter="url(#glow)">` + [[0, 0.55, 2.4], [11, 0.26, 1.6], [24, 0.12, 1.2]].map(([d, o, w]) => `<circle cx="640" cy="1900" r="${1500 + d}" stroke="#86b6dc" stroke-opacity="${o}" stroke-width="${w}"/>`).join('') + `</g>`;
  // faint reflections on the glass
  s += `<path d="M262 22H330L214 600H146Z" fill="#fff" opacity="0.022"/><path d="M1150 22H1182L1104 600H1072Z" fill="#fff" opacity="0.02"/>`;
  // the window: painted steel frame and two mullions, then the sill and the wall under it
  s += `<path d="M0 0H1280V600H0Z M22 22V600H196V22Z M220 22V600H1060V22Z M1084 22V600H1258V22Z" fill="url(#frameG)" fill-rule="evenodd"/>`;
  for (const mx of [208, 1072]) for (let yy = 60; yy < 590; yy += 90) s += screwG(mx, yy);
  s += `<rect x="0" y="596" width="1280" height="16" fill="#4a3f36"/><rect x="0" y="596" width="1280" height="3" fill="#6b5d50"/><rect x="0" y="612" width="1280" height="188" fill="url(#wallG)"/>`;
  return s;
}
// The desk console the shell is built on: Yard Standard, the orange stripe under its rolled lip
function pedestalG({ x = 340, y = 108, w = 600 } = {}) {
  const h = 800 - y + 20;
  let s = `<g filter="url(#softshadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="url(#enamelG)"/></g>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="url(#enamelG)" filter="url(#grain)"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#lampPoolG)"/>`;
  s += `<rect x="${x - 7}" y="${y - 5}" width="${w + 14}" height="11" rx="5" fill="url(#lipG)"/>`;
  s += `<rect x="${x}" y="${y + 7}" width="${w}" height="6" fill="${C.orange}"/><rect x="${x}" y="${y + 13}" width="${w}" height="1" fill="#6e3216" opacity="0.6"/>`;
  s += `<path d="M${x + 1} ${y + 16}V800" stroke="#F4EEDD" stroke-width="1.2" opacity="0.8"/><path d="M${x + w - 1} ${y + 16}V800" stroke="#7d735e" stroke-width="1.4"/>`;
  s += screwG(x + 9, y + 24) + screwG(x + w - 9, y + 24) + screwG(x + 9, 786) + screwG(x + w - 9, 786);
  return s;
}
// The builder's plate: cast aluminium, raised polished letters on a painted ground
function builderPlateG(cx, y, { w = 500, h = 102 } = {}) {
  const x = cx - w / 2;
  let s = `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="url(#castG)"/></g>`;
  s += `<rect x="${x + 9}" y="${y + 9}" width="${w - 18}" height="${h - 18}" rx="4" fill="#1d1916"/>`;
  s += `<rect x="${x + 9}" y="${y + 9}" width="${w - 18}" height="${h - 18}" rx="4" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>`;
  s += [[x + 22, y + h / 2], [x + w - 22, y + h / 2]].map(([rx, ry]) => `<circle cx="${rx}" cy="${ry}" r="5.5" fill="url(#castG)" stroke="#4d4a44" stroke-width="0.8"/><circle cx="${rx - 1.5}" cy="${ry - 1.8}" r="1.6" fill="#fff" opacity="0.6"/>`).join('');
  s += `<text x="${cx + 1.2}" y="${y + 63.5}" text-anchor="middle" class="stencil" font-size="56" letter-spacing="2" fill="#000" opacity="0.7">RINGS OF IRON</text>`;
  s += `<text x="${cx}" y="${y + 62}" text-anchor="middle" class="stencil" font-size="56" letter-spacing="2" fill="url(#castG)">RINGS OF IRON</text>`;
  s += `<text x="${cx}" y="${y + 84}" text-anchor="middle" class="legend" font-size="13" letter-spacing="4" fill="#cfccc4">A NEWTONIAN SHIP SIM</text>`;
  return s;
}
function serialPlateG(x, y, text) {
  const w = 156, h = 36;
  let s = `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="url(#castG)"/></g>`;
  s += `<circle cx="${x + 8}" cy="${y + h / 2}" r="2.8" fill="url(#screwG)" stroke="#5d5a53" stroke-width="0.5"/><circle cx="${x + w - 8}" cy="${y + h / 2}" r="2.8" fill="url(#screwG)" stroke="#5d5a53" stroke-width="0.5"/>`;
  s += tag(x + 18, y + 14, 'SERIAL') + `<text x="${x + 18}" y="${y + 30}" class="drum" font-size="14" letter-spacing="0.6" fill="${C.ink}">${esc(text)}</text>`;
  return s;
}
// A large momentary push button (a menu's action): aluminium bezel, a cap with an engraved legend.
// Barred: the barber strip along the cap and the legend dim; its reason goes on flaps beside it.
function capG(x, y, w, h, label, { sub = null, color = 'cream', key = null, barred = false, focus = false, lit = false, size = 15 } = {}) {
  const P = {
    cream: { top: '#EFE8D4', lip: '#c9bb9b', ink: C.ink },
    green: { top: lit ? '#a7e483' : '#7aa565', lip: '#3f6a33', ink: '#10200c', glow: LAMP.green[0] },
    amber: { top: lit ? '#ffc466' : '#d2a24f', lip: '#8a5f1c', ink: '#2a1606', glow: LAMP.amber[0] },
    white: { top: lit ? '#fff6dc' : '#d8d1bf', lip: '#a39b88', ink: '#241406', glow: LAMP.white[0] },
  }[color];
  let s = `<rect x="${x - 4}" y="${y - 4}" width="${w + 8}" height="${h + 8}" rx="4.5" fill="${C.alu}"/><rect x="${x - 4}" y="${y - 4}" width="${w + 8}" height="${h + 8}" rx="4.5" fill="url(#glassG)"/><rect x="${x - 1.8}" y="${y - 1.8}" width="${w + 3.6}" height="${h + 3.6}" rx="3" fill="#1f1b18"/>`;
  if (lit && P.glow) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${P.glow}" filter="url(#lampglow)" opacity="0.5"/>`;
  s += `<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h - 3}" rx="3" fill="${P.top}"/></g>`;
  s += `<rect x="${x}" y="${y + h - 7}" width="${w}" height="4" rx="1.5" fill="${P.lip}"/><path d="M${x + 3} ${y + 1}H${x + w - 3}" stroke="#fff" stroke-opacity="0.55" stroke-width="1"/>`;
  const ink = barred ? 'rgba(42,36,32,0.36)' : P.ink;
  const ty = sub ? y + (h - 3) / 2 - 1 : y + (h - 4) / 2 + size * 0.36;
  s += `<text x="${x + w / 2}" y="${ty}" text-anchor="middle" class="legend" font-size="${size}" fill="${ink}">${esc(label)}</text>`;
  if (sub) s += `<text x="${x + w / 2}" y="${ty + 15}" text-anchor="middle" class="legend" font-size="12" fill="${ink}" opacity="0.75">${esc(sub)}</text>`;
  if (barred) s += `<rect x="${x}" y="${y + h - 15}" width="${w}" height="7" fill="url(#barber)" opacity="0.95"/>`;
  if (key) s += keyG(x + w + 13, y + h / 2 - 8, key, { anchor: 'start' });
  if (focus) s += focusTabG(x - 8, y + h / 2);
  return s;
}
// The same button under a red flip guard: closed, or lifted (armed) with its lamp lit beside it
function guardCapG(x, y, w, h, label, { open = false, key = null } = {}) {
  let s = capG(x, y, w, h, label, { key });
  if (open) {
    s += `<g filter="url(#shadow)"><rect x="${x - 5}" y="${y - 30}" width="${w + 10}" height="22" rx="3" fill="${C.red}"/><rect x="${x - 5}" y="${y - 12}" width="${w + 10}" height="4" fill="#7a221b"/></g>`;
    s += lampG(x - 18, y + h / 2, 4.5, 'red', true);
  } else {
    s += `<g filter="url(#shadow)"><rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" rx="4" fill="${C.red}" opacity="0.86"/></g><rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" rx="4" fill="url(#glassG)"/>`;
    s += `<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="5" rx="2" fill="#7a221b"/><text x="${x + w / 2}" y="${y + h / 2 + 5}" text-anchor="middle" class="legend" font-size="14" fill="#fbe9dc">${esc(label)}</text>`;
    s += lampG(x - 18, y + h / 2, 4.5, 'red', false);
  }
  return s;
}
// Interlocked piano keys: one down (its foot safety orange); null is a blanking plate; a jewel marks a waiting tab
function pianoG(x, y, labels, sel, { kw = 100, h = 28, gap = 3, keys = null, jewel = -1, size = 12 } = {}) {
  let s = `<rect x="${x - 3}" y="${y - 3}" width="${labels.length * (kw + gap) - gap + 6}" height="${h + 6}" rx="2.5" fill="${C.bakelite}"/>`;
  labels.forEach((l, i) => {
    const kx = x + i * (kw + gap), dn = i === sel;
    if (l === null) { s += `<rect x="${kx}" y="${y}" width="${kw}" height="${h - 2}" rx="2" fill="#8f8b82"/>${screwG(kx + 8, y + h / 2 - 1)}${screwG(kx + kw - 8, y + h / 2 - 1)}`; return; }
    s += `<g filter="url(#shadow)"><rect x="${kx}" y="${y + (dn ? 2 : 0)}" width="${kw}" height="${h - 2}" rx="2" fill="${dn ? '#cfc4a8' : '#ece4ce'}"/></g>`;
    if (dn) s += `<rect x="${kx}" y="${y + h - 4}" width="${kw}" height="3" fill="${C.orange}"/>`;
    const kc = keys && keys[i] ? 21 : 0, jw = i === jewel ? 12 : 0, lx = kx + kc + (kw - kc - jw) / 2 - (kc ? 2 : 0);

  s += typed(694, 726, 'FLIGHT', { size: 14 }) + typed(694, 744, 'W   main engine', { size: 13 }) + typed(694, 760, 'A D turn', { size: 13 }) + typed(694, 776, 'X   rotation assist', { size: 13 });

  // telex
  s += `<rect x="1010" y="692" width="96" height="94" fill="url(#canaryG)"/>` + typed(1018, 712, 'TELEX', { size: 13 }) + typed(1018, 736, 'SHIP LOST', { size: 14 });
  // optics port

  s += `<clipPath id="pipK"><circle cx="1176" cy="732" r="36"/></clipPath><g clip-path="url(#pipK)"><rect x="1140" y="696" width="72" height="72" fill="#0d130f"/><g style="filter:grayscale(1) sepia(0.6) hue-rotate(50deg) brightness(1.15)">${hullG(1176, 736, 250, 0.8)}</g>`;
  for (let yy = 696; yy < 768; yy += 2.2) s += `<rect x="1140" y="${yy}" width="72" height="0.9" fill="#000" opacity="0.28"/>`;
  s += `</g>` + [0, 1, 2, 3].map(i => { const a = i * Math.PI / 2 + Math.PI / 4; return screwG(1176 + 40 * Math.cos(a), 732 + 40 * Math.sin(a)); }).join('');
  s += dymoG(1142, 776, 'RAIDER');
  return s;
}
