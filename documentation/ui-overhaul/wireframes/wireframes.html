<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI context wireframes</title>
<!--
  Grey-box wireframes for documentation/ui-overhaul/functional-context.md.
  Style-agnostic on purpose: boxes, labels and sample data only.
  Open with ?n=01 .. ?n=12 to see one layout; render.js screenshots them all and checks the text fits.
  Coordinates are UI units at the 1280 x 800 reference layout. Text is drawn at the spec's floor
  (13 units, monospaced, section 12.4), so a line that fits here fits the budget in section 5.6.
  Line prefixes: ^ a row of 24 units (it holds a control), # P3's size (22 units), ~ dim.
-->
<style>
  :root {
    --world: #34373c; --world-line: #8b9096; --world-text: #c9ccd0;
    --box: #f3f3f1; --box-compact: #dcdcd8; --ink: #1d1f22; --ink-dim: #5d6166;
    --rule: #222; --mode: #ececea; --caption: #f6f6f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--caption); }
  body { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; color: var(--ink); }
  #frame { position: relative; width: 1280px; height: 856px; }
  #screen { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--world); overflow: hidden; }
  #caption { position: absolute; left: 0; top: 800px; width: 1280px; height: 56px; background: var(--caption);
    border-top: 1px solid #999; padding: 8px 14px; display: flex; align-items: center; gap: 22px; font-size: 13px; }
  #caption .title { font-weight: bold; font-size: 15px; min-width: 300px; }
  .key { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-dim); }
  .sw { width: 22px; height: 14px; background: var(--box); border: 1.5px solid var(--rule); display: inline-block; }
  .sw.cond { border-style: dashed; }
  .sw.compact { background: var(--box-compact); }
  .sw.interrupt { border-width: 3px; }
  .sw.slot { background: transparent; border: 1.5px dashed #777; }
  svg#world { position: absolute; left: 0; top: 0; }
  .b { position: absolute; background: var(--box); border: 1.5px solid var(--rule); padding: 6px 7px 4px; }
  .b.cond { border-style: dashed; }
  .b.compact { background: var(--box-compact); }
  .b.interrupt { border-width: 3px; padding: 4px 7px 2px; }
  .b.mode { background: var(--mode); }
  .b.slot { background: transparent; border: 1.5px dashed #6c7076; color: #aeb2b7; }
  .b.dimmed { opacity: .45; }
  .b.tight { padding: 1px 7px 2px; } /* P2: six rows of 24 in 150 */
  /* the widget's name sits on its top border, like a legend, so it takes no room from the content */
  .b .lg { position: absolute; top: -8px; left: 6px; font-size: 9.5px; line-height: 12px; padding: 0 3px;
    background: var(--box); color: var(--ink-dim); white-space: nowrap; }
  .b.compact .lg { background: var(--box-compact); }
  .b.mode .lg { top: 3px; left: auto; right: 6px; background: var(--mode); }
  .b.slot .lg { background: var(--world); color: #aeb2b7; }
  .b .lg b { color: var(--ink); }
  .b.slot .lg b { color: #aeb2b7; }
  .b .ln { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 13px; line-height: 18px; white-space: pre; }
  .b .ln.tall { line-height: 24px; }
  .b .ln.big { font-size: 22px; line-height: 28px; font-weight: bold; }
  .b .ln.dim { color: var(--ink-dim); }
  .b .ph { border: 1px solid #9a9ea3; background: #fff; margin: 2px 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--ink-dim); text-align: center; padding: 0 8px; }
  .w { position: absolute; font-size: 12px; color: var(--world-text); white-space: nowrap; }
  .w.tag { font-weight: bold; }
  .w.room { font-size: 10px; color: #8d9298; }
  .t { position: absolute; font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 12px; line-height: 16px;
    padding: 1px 4px; background: #1d1f22; color: #f3f3f1; border: 1.5px dashed #f3f3f1; white-space: nowrap; }
</style>
</head>
<body>
<div id="frame">
  <div id="screen"><svg id="world" width="1280" height="800"></svg></div>
  <div id="caption"></div>
</div>
<script>
const W = 1280, H = 800;
const screen = document.getElementById('screen');
const svg = document.getElementById('world');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function line(x1, y1, x2, y2, dash = '', w = 1.2, c = 'var(--world-line)') {
  el('line', { x1, y1, x2, y2, stroke: c, 'stroke-width': w, 'stroke-dasharray': dash });
}
function rect(x, y, w, h, opts = {}) {
  el('rect', Object.assign({ x, y, width: w, height: h, fill: 'none', stroke: 'var(--world-line)', 'stroke-width': 1.2 }, opts));
}
function circ(cx, cy, r, opts = {}) {
  el('circle', Object.assign({ cx, cy, r, fill: 'none', stroke: 'var(--world-line)', 'stroke-width': 1.2 }, opts));
}
function wtext(x, y, s, cls = '') {
  const d = document.createElement('div');
  d.className = 'w ' + cls; d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = s;
  screen.appendChild(d);
}
/** Text lines into a box. Prefixes: ^ a 24-unit row, # P3's size, ~ dim. */
function addLines(d, lines) {
  for (let l of lines) {
    const p = document.createElement('div');
    let cls = 'ln';
    while (l && '^#~'.includes(l[0])) {
      cls += { '^': ' tall', '#': ' big', '~': ' dim' }[l[0]];
      l = l.slice(1);
    }
    p.className = cls;
    p.textContent = l || ' ';
    d.appendChild(p);
  }
}
/**
 * A widget box. kind: full | cond | compact | interrupt | mode | slot. h = 0 sizes it to its content.
 * ph adds a placeholder picture { h, text } after the lines.
 */
function box(id, name, x, y, w, h, kind = 'full', lines = [], ph = null) {
  const d = document.createElement('div');
  d.className = 'b ' + kind;
  Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px' });
  if (h) d.style.height = h + 'px';
  if (id || name) d.innerHTML = `<span class="lg"><b>${id}</b> ${name}</span>`;
  addLines(d, lines);
  if (ph) {
    const p = document.createElement('div');
    p.className = 'ph'; p.style.height = ph.h + 'px';
    p.textContent = ph.text; d.appendChild(p);
  }
  screen.appendChild(d);
  return d;
}
/** Boxes stacked down from y with the zone's 6-unit gap; each item is [id, name, kind, lines, h]. */
function stack(x, y, items, w = 308) {
  for (const [id, name, kind, lines, h] of items) {
    const d = box(id, name, x, y, w, h || 0, kind, lines);
    y += d.offsetHeight + 6;
  }
  return y;
}
/** The master alert cue: a small lit chip with no legend. */
function chip(x, y, w, text) {
  const d = document.createElement('div');
  d.className = 'b interrupt';
  Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: '24px', padding: '0 5px' });
  d.innerHTML = `<div class="ln" style="line-height:18px">${text}</div>`;
  screen.appendChild(d);
}
/** A D3 hazard tag in the world. */
function tag(x, y, text) {
  const d = document.createElement('div');
  d.className = 't'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text;
  screen.appendChild(d);
}
function centreClear() {
  rect(360, 220, 560, 370, { 'stroke-dasharray': '3 6', stroke: '#5b6066' });
  wtext(366, 224, 'centre kept clear', '');
}
function ship(cx, cy, label = '') {
  rect(cx - 42, cy - 13, 84, 26, { fill: '#4a4e54' });
  el('polygon', { points: `${cx + 42},${cy - 13} ${cx + 56},${cy} ${cx + 42},${cy + 13}`, fill: '#4a4e54', stroke: 'var(--world-line)' });
  if (label) wtext(cx - 20, cy + 18, label);
}
function velocity(cx, cy) {
  circ(cx + 70, cy, 7); line(cx + 70, cy - 11, cx + 70, cy - 7); line(cx + 70, cy + 7, cx + 70, cy + 11); line(cx + 77, cy, cx + 81, cy);
  circ(cx - 70, cy, 7); line(cx - 75, cy - 5, cx - 65, cy + 5); line(cx - 75, cy + 5, cx - 65, cy - 5);
}
function contact(x, y, shape = 'circle', label = '', sub = '') {
  if (shape === 'circle') circ(x, y, 5);
  else if (shape === 'diamond') el('polygon', { points: `${x},${y - 7} ${x + 7},${y} ${x},${y + 7} ${x - 7},${y}`, fill: 'none', stroke: 'var(--world-line)', 'stroke-width': 1.2 });
  else if (shape === 'square') rect(x - 5, y - 5, 10, 10);
  if (label) wtext(x + 12, y - 9, label, 'tag');
  if (sub) wtext(x + 12, y + 5, sub);
}
function lockMark(x, y) { // corner brackets
  const r = 14, s = 6;
  for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    line(x + dx * r, y + dy * r, x + dx * (r - s), y + dy * r, '', 1.6, '#d8dbde');
    line(x + dx * r, y + dy * r, x + dx * r, y + dy * (r - s), '', 1.6, '#d8dbde');
  }
}
function navMark(x, y) { circ(x, y, 17, { 'stroke-dasharray': '4 3', stroke: '#d8dbde' }); }
function edge(x, y, text) { wtext(x, y, text, 'tag'); }

function caption(title) {
  document.getElementById('caption').innerHTML =
    `<span class="title">${title}</span>
     <span class="key"><span class="sw"></span>shown</span>
     <span class="key"><span class="sw cond"></span>only while its condition holds</span>
     <span class="key"><span class="sw compact"></span>compact face</span>
     <span class="key"><span class="sw interrupt"></span>interrupt or cue</span>
     <span class="key"><span class="sw slot"></span>empty slot (nothing to show)</span>`;
}

// ---------------------------------------------------------------- shared pieces
/** P1: seat and helm authority on the left, clock and warp on the right. */
function strip(left, right, dim = false) {
  const d = box('', '', 0, 0, W, 26, 'full' + (dim ? ' dimmed' : ''), []);
  d.style.padding = '3px 12px';
  d.insertAdjacentHTML('beforeend',
    `<span class="ln" style="position:absolute;left:12px;top:3px"><b style="font-size:9.5px;color:#5d6166">P1</b>  ${left}</span>` +
    `<span class="ln" style="position:absolute;right:12px;top:3px">${right}</span>`);
}
function emptySlots(left = true, right = true) {
  if (left) box('P2', 'Caution and warning (empty: nothing wrong)', 12, 38, 308, 40, 'slot');
  if (right) box('P4', 'Message feed (empty)', 960, 38, 308, 40, 'slot');
}
/** H4's compact lights. The starter corvette has no shield emitter, so three by default. */
function shipLights(shields = false) {
  box('H4', 'Ship condition (compact)', 12, 748, 308, 40, 'compact',
    [shields ? '○ HULL  ○ SHIELDS  ○ POWER  ○ LIFE SUP' : '○ HULL     ○ POWER     ○ LIFE SUP']);
}
/** The starter corvette's deck at the default zoom: two rooms, HOLD aft (left) and BRIDGE forward. */
function deckPlan() {
  const x0 = 380, y0 = 300, t = 32.5;           // 16 x 6 tiles
  rect(x0, y0, 16 * t, 6 * t, { fill: '#41454b' });
  line(x0 + 8 * t, y0, x0 + 8 * t, y0 + 3.6 * t, '', 2, '#9aa0a6');
  line(x0 + 8 * t, y0 + 4.6 * t, x0 + 8 * t, y0 + 6 * t, '', 2, '#9aa0a6');   // the door
  wtext(x0 + 6, y0 + 6 * t - 16, 'HOLD', 'room'); wtext(x0 + 8 * t + 6, y0 + 6 * t - 16, 'BRIDGE', 'room');
  for (const [x, y, w, h] of [[5, 1, 3, 2], [5, 3, 3, 2]]) rect(x0 + x * t, y0 + y * t, w * t, h * t, { stroke: '#6f747a' }); // cargo bays
  rect(x0 + 14 * t, y0 + 2 * t, 2 * t, 2 * t, { stroke: '#6f747a' }); wtext(x0 + 14 * t + 4, y0 + 2 * t + 4, 'reactor', 'room');
  rect(x0 + 9 * t, y0 + 1 * t, t, t, { stroke: '#9aa0a6' }); wtext(x0 + 9 * t - 2, y0 + 2, 'helm', 'room');
  wtext(x0, y0 + 6 * t + 4, 'grey room names are for reference only: the game draws none', 'room');
}
function hatch(x, y, w, h, gap = 10) {
  for (let i = -h; i < w; i += gap) {
    const x1 = Math.max(x, x + i), y1 = y + Math.max(0, -i), x2 = Math.min(x + w, x + i + h), y2 = y + Math.min(h, w - i);
    line(x1, y1, x2, y2, '', 1, '#6f747a');
  }
}

const n = new URLSearchParams(location.search).get('n') || '01';
const [title, draw] = layouts[n];
draw();
caption(`${n}  ${title}`);
document.title = `${n} ${title}`;
window.LAYOUTS = Object.keys(layouts);

/** For render.js: every box whose text runs past its edges, so a budget break can't hide. */
window.overflows = () => {
  const out = [];
  for (const b of document.querySelectorAll('.b')) {
    const r = b.getBoundingClientRect();
    const name = (b.querySelector('.lg') || b).textContent.trim().slice(0, 40);
    for (const c of b.querySelectorAll('.ln, .ph')) {
      const q = c.getBoundingClientRect();
      const right = c.classList.contains('ln') ? q.left + c.scrollWidth : q.right;
      if (right > r.right - 2 || q.bottom > r.bottom - 1) out.push(`${name}: "${c.textContent.slice(0, 60)}"`);
    }
  }
  return out;
};
