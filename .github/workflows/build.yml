name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole run takes about 8 minutes; a test stuck in a loop fails here, not after six hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build test --console=plain
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Smoke test the game and demos
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :lwjgl3:smokeTest --continue --console=plain
      - name: Smoke test with OpenAL audio on
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :lwjgl3:audioSmokeTest --continue --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            lwjgl3/build/smoke-golden/
