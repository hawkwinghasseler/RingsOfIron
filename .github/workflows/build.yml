name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build test --console=plain
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Smoke test the game and demos
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :lwjgl3:smokeTest --continue --console=plain
      - name: Smoke test with OpenAL audio on
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :lwjgl3:audioSmokeTest --continue --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Round 3's career on each seed, played twice: the journals must match and the career reach the
  # gunship, unless the seed is listed as stopping at a known place
  # (CareerSeedsTest.STOPS); a seed that stops anywhere else, or gets through while listed, fails.
  # How it is paced (the gunship paid for in play) is the playtest benchmark CareerPacingBenchmark,
  # which CI never runs (documentation/playtest/).
  career-seeds:
    name: Career seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    # A career runs in one to twenty-five minutes; one that loops (a script waiting on a world that never
    # gets there) fails here instead of holding the runner for six hours
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [2026, 7, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Play the career twice
        run: ./gradlew :core:test --tests '*CareerSeedsTest.theCareer*' -PcareerSeeds=${{ matrix.seed }} --console=plain
      - name: Upload the journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-seed-${{ matrix.seed }}
          path: core/build/career-seed-*.txt

  # Round 5's career on each seed, on from the gunship to the raid on the pirates' base, played twice:
  # the journals must match and the raid be flown, unless the seed is listed as stopping at a known
  # place (CareerSeedsTest.ROUND5_STOPS). Whether the base falls is CareerPacingBenchmark's. Seed 2026 also plays once in the slow tests' Round5CareerTest.
  round5-career-seeds:
    name: Round 5 career seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    # A career runs in one to twenty-five minutes; one that loops (a script waiting on a world that never
    # gets there) fails here instead of holding the runner for six hours
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [2026, 7, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Play round 5's career twice
        run: ./gradlew :core:test --tests '*CareerSeedsTest.round5*' -PcareerSeeds=${{ matrix.seed }} --console=plain
      - name: Upload the journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round5-career-seed-${{ matrix.seed }}
          path: core/build/round5-career-seed-*.txt

  # The tests tagged slow (whole careers, long autopilot and warp runs), which ./gradlew build skips
  slow-tests:
    name: Slow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the slow tests
        run: ./gradlew slowTest --continue --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-reports
          path: '**/build/reports/tests/'
