[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api project(':core-engine')
  api project(':orbital-mechanics')
  api project(':physics-exterior')
  api project(':interior-grid')
  api project(':ai-crew')
  api project(':macro-sim')
  api project(':combat-sys')
  api project(':ui-hud')
  api project(':audio-spatial')
  api project(':modding-data')
  api project(':stations-docking')
  api project(':ship-systems')

  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "org.apache.groovy:groovy-all:$groovyVersion"
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

test {
  useJUnitPlatform()
  // ./gradlew :core:slowTest --tests '*Round3CareerTest' -PcareerSeed=7 plays the scripted career on another seed
  if (project.hasProperty('careerSeed')) systemProperty 'career.seed', project.property('careerSeed')
  // ./gradlew :core:test --tests '*CareerSeedsTest' -PcareerSeeds=2026,7,12 plays each seed's career twice, by hand (not in CI)
  if (project.hasProperty('careerSeeds')) systemProperty 'career.seeds', project.property('careerSeeds')
  // ./gradlew :core:test --tests '*CareerSweepTest' -PcareerSweep=1-10,2026,7,12 plays both careers once on each seed, -PsweepForks=n at once (core/build/career-sweep.txt)
  if (project.hasProperty('careerSweep')) systemProperty 'career.sweep', project.property('careerSweep')
  if (project.hasProperty('sweepForks')) systemProperty 'career.sweep.forks', project.property('sweepForks')
  // ./gradlew :core:test --tests '*CrewWoundSurveyTest' -PwoundSurvey=10 fights round 4's ace survey again with wounds
  if (project.hasProperty('woundSurvey')) systemProperty 'wound.survey', project.property('woundSurvey')
  if (project.hasProperty('woundTrace')) systemProperty 'wound.survey.trace', 'true'
  if (project.hasProperty('woundSeed')) systemProperty 'wound.survey.seed', project.property('woundSeed')
  if (project.hasProperty('woundRefits')) systemProperty 'wound.survey.refits', project.property('woundRefits')
  // ./gradlew :core:slowTest --tests '*CareerAirTraceTest' -PcareerSeed=1 -PcareerAirTrace traces the crew's air through round 5's career (build/career-air-1.txt)
  if (project.hasProperty('careerAirTrace')) systemProperty 'career.airTrace', 'true'
  // -PcareerFightTrace='Iron Dagny' traces each career fight whose name holds the text, second by second (build/fight-trace-<seed>.txt)
  if (project.hasProperty('careerFightTrace')) systemProperty 'career.fightTrace', project.property('careerFightTrace')
  // ./gradlew :core:test --tests '*EnemySurveyTest' -PenemySurvey runs the round 5 enemy survey (core/build/enemy-survey.txt)
  if (project.hasProperty('enemySurvey')) systemProperty 'enemy.survey', 'true'
  if (project.hasProperty('surveyTrials')) systemProperty 'enemy.survey.trials', project.property('surveyTrials')
  if (project.hasProperty('surveyRows')) systemProperty 'enemy.survey.rows', project.property('surveyRows')
  // -PsurveyStart=intercept: the lone and wing rows hunt the player from the rails, as in the game, instead of starting at rest 4 km out
  if (project.hasProperty('surveyStart')) systemProperty 'enemy.survey.start', project.property('surveyStart')
  if (project.hasProperty('enemyDebug')) systemProperty 'enemy.debug', 'true'
  if (project.hasProperty('enemyProbe')) systemProperty 'enemy.probe', project.property('enemyProbe')
  // ./gradlew :core:test --tests '*SystemOrderTest' -PpinSystemOrder rewrites src/test/resources/system-order.txt from the wired game
  if (project.hasProperty('pinSystemOrder')) systemProperty 'pin.systemOrder', 'true'
  // A failing test says why in the CI log, not only in the report (the build logs at quiet, see gradle.properties)
  testLogging {
    showStandardStreams = project.hasProperty('enemySurvey') || project.hasProperty('enemyDebug') || project.hasProperty('enemyProbe')
    quiet {
      events 'failed'
      exceptionFormat 'full'
    }
  }
}

// The main menu's version counter reads version.properties: the project version and, when the build
// runs in a git checkout, the short commit hash. Without git the hash is left empty.
def versionInfoDir = layout.buildDirectory.dir('generated/versionInfo')
def generateVersionInfo = tasks.register('generateVersionInfo') {
  def outDir = versionInfoDir
  def ver = project.version.toString()
  def repoDir = rootProject.rootDir
  inputs.property 'version', ver
  outputs.dir outDir
  outputs.upToDateWhen { false }  // the commit can change without any input file changing
  doLast {
    String commit = ''
    try {
      def proc = new ProcessBuilder('git', 'rev-parse', '--short', 'HEAD').directory(repoDir).redirectErrorStream(true).start()
      String out = proc.inputStream.text.trim()
      if (proc.waitFor() == 0) commit = out
    } catch (Exception ignored) {
    }
    def file = outDir.get().file('com/hawkwing/RingsOfIron/version.properties').asFile
    file.parentFile.mkdirs()
    file.text = "version=${ver}\ncommit=${commit}\n"
  }
}
sourceSets.main.resources.srcDir(versionInfoDir)
processResources.dependsOn generateVersionInfo

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

