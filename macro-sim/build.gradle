[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-macro-sim'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api project(':core-engine')
  api project(':physics-exterior')
  api project(':modding-data')

  testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // Box2D's native library, so the physics gateway can be tested against a real world.
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

test {
  useJUnitPlatform()
}

// Headless run of the macro simulation: a small star system, its economy and freighter traffic.
tasks.register('runMacroDemo', JavaExec) {
  group = 'application'
  description = 'Runs the headless macro-sim demo and prints the economy and traffic report.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.ringsofiron.macrosim.MacroSimDemo'
  args = project.hasProperty('days') ? [project.property('days')] : []
}
