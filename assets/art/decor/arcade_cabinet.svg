    <rect x="6" y="4" width="36" height="14" rx="1.5" fill="#0c1a26" stroke="#10141a" stroke-width="1"/>
    <rect x="4" y="20" width="40" height="8" rx="1.5" fill="#3a3456" stroke="#10141a" stroke-width="1"/>
    <circle cx="12" cy="24" r="2.2" fill="#1b2028" stroke="#10141a" stroke-width="0.6"/>
    <path d="M3,2.5 L45,2.5" stroke="#d04ab0" stroke-width="1.2"/>
  </g>
  <g id="emissive">
