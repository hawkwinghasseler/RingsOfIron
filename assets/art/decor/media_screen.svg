<svg xmlns="http://www.w3.org/2000/svg" width="96" height="16" viewBox="0 0 96 16">
  <title>media_screen: big media screen on a stand, facing -y</title>
  <g id="base">
    <rect x="2" y="2" width="92" height="12" rx="2" fill="#20252e" stroke="#10141a" stroke-width="2"/>
    <rect x="5" y="8" width="86" height="4" fill="#0c1a26" stroke="#10141a" stroke-width="0.8"/>
    <rect x="40" y="3" width="16" height="4" fill="#373f4b" stroke="#10141a" stroke-width="0.8"/>
  </g>
  <g id="emissive">
    <g data-light="cone" data-reach="3" data-intensity="0.4" data-direction="-90" data-cone="70">
    <rect x="6" y="9" width="84" height="2" fill="#7ac8ff"/>
    <path d="M5,12 L91,12 L96,16 L0,16 Z" fill="#7ac8ff" opacity="0.25"/>
    </g>
  </g>
  <g id="meta">
    <rect id="collider" x="1" y="1" width="94" height="14" fill="none" stroke="none"/>
  </g>
</svg>
