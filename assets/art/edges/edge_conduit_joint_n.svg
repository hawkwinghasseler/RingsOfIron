    <line x1="4.5" y1="0" x2="4.5" y2="8" stroke="#10141a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="11.5" y1="0" x2="11.5" y2="8" stroke="#10141a" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="6.5" y="0" width="3" height="8" fill="#6b5a2e"/>
