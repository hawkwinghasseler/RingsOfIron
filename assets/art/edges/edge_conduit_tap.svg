    <path d="M13,3 L13,13 L3,13" fill="none" stroke="#10141a" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="2.93" fill="#6b5a2e" stroke="#10141a" stroke-width="1"/>
    <circle cx="3" cy="3" r="0.9" fill="#7d8898" opacity="0.9"/>
    <circle cx="13" cy="3" r="0.9" fill="#7d8898" opacity="0.9"/>
