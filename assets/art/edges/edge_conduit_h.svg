<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16" viewBox="0 0 64 16">
  <title>edge_conduit, horizontal: conduit along a tile edge (edge at y=8), open ends meet joints</title>
  <g id="base">
    <rect x="0" y="4.5" width="64" height="7" fill="#20262e"/>
    <line x1="0" y1="4.5" x2="64" y2="4.5" stroke="#10141a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="11.5" x2="64" y2="11.5" stroke="#10141a" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="0" y="6.5" width="64" height="3" fill="#6b5a2e"/>
    <rect x="14" y="3.5" width="4" height="9" rx="0.8" fill="#373f4b" stroke="#10141a" stroke-width="1"/>
    <rect x="46" y="3.5" width="4" height="9" rx="0.8" fill="#373f4b" stroke="#10141a" stroke-width="1"/>
  </g>
  <g id="emissive">
    <g data-light="glow">
    <rect x="0" y="6.5" width="14" height="3" fill="#f2b134"/>
    <line x1="0" y1="8" x2="14" y2="8" stroke="#fff3c4" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <rect x="18" y="6.5" width="28" height="3" fill="#f2b134"/>
    <line x1="18" y1="8" x2="46" y2="8" stroke="#fff3c4" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <rect x="50" y="6.5" width="14" height="3" fill="#f2b134"/>
    <line x1="50" y1="8" x2="64" y2="8" stroke="#fff3c4" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
