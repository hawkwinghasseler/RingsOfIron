# Asset keys -> files, relative to this assets folder. Code asks for keys, never paths:
#   assets.getTexture("tex_libgdx")
# Mods add or override keys with their own assets.toml (paths relative to the mod folder).

# The art pack: assets/art's SVGs rasterized into one atlas by gradlew :art-pipeline:packArt (the run
# tasks build it). Regions are named <folder>/<file>, e.g. tiles/floor; see documentation/art/Design.md.
[atlas]
atlas_art = "art/art.atlas"

[texture]
tex_libgdx = "libgdx.png"
tex_corvette = "libgdx.png"       # placeholder until ship art exists
tex_freighter = "libgdx.png"      # placeholder
tex_raider = "libgdx.png"         # placeholder
tex_gunship = "libgdx.png"        # placeholder

# Audio middleware event paths (audio-spatial); looked up with assets.getString(key).
[audio_event]
evt_railgun_fire = "event:/weapons/railgun"
evt_laser_fire = "event:/weapons/laser"
evt_hull_breach = "event:/interior/hull_breach"
evt_autocannon_fire = "event:/weapons/autocannon"
evt_missile_launch = "event:/weapons/missile_launch"
evt_missile_flight = "event:/weapons/missile_flight"
evt_explosion = "event:/impacts/explosion"
