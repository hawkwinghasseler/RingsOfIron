# Tile types: the characters chassis rows are painted with (see chassis.toml), and the
# tile each one builds. The ship editor (gradlew :lwjgl3:runShipEditor) edits this file.
#   symbol        one character, unique across tile types
#   base          VOID, FLOOR, HULL or INTERNAL_WALL
# Power conduits are not tiles: a chassis lays them over its tiles in their own layer
# (conduits and edge_conduits in chassis.toml).
#   weight_class  walls: LIGHT, MEDIUM or HEAVY
#   material      walls: a [material.*] id (materials.toml)
#   covering      floors: NONE or CARPET, laid when the ship is built
#   art           the art it draws with: a region for floors (tiles/floor), or for walls a family
#                 whose regions add the join sides (walls/hull_heavy -> walls/hull_heavy_nesw)
#   color         how the editor draws it without the art pack
# These restate the built-in characters; a type left out keeps its built-in meaning.

[tile.void]
name = "Void"
symbol = " "
base = "VOID"
color = "#000000"

[tile.floor]
name = "Steel floor"
symbol = "."
base = "FLOOR"
art = "tiles/floor"
color = "#4a5058"

[tile.hull]
name = "Hull, medium"
symbol = "#"
base = "HULL"
weight_class = "MEDIUM"
material = "hull_steel"
art = "walls/hull_medium"
color = "#9aa4b0"

[tile.hull_light]
name = "Hull, light"
symbol = "1"
base = "HULL"
weight_class = "LIGHT"
material = "hull_steel"
art = "walls/hull_light"
color = "#b8c0ca"

[tile.hull_medium]
name = "Hull, medium (2)"
symbol = "2"
base = "HULL"
weight_class = "MEDIUM"
material = "hull_steel"
art = "walls/hull_medium"
color = "#9aa4b0"

[tile.hull_heavy]
name = "Hull, heavy"
symbol = "3"
base = "HULL"
weight_class = "HEAVY"
material = "hull_steel"
art = "walls/hull_heavy"
color = "#6c7684"

[tile.internal_wall]
name = "Internal wall"
symbol = "I"
base = "INTERNAL_WALL"
weight_class = "MEDIUM"
material = "hull_steel"
art = "walls/internal_wall"
color = "#80705a"

# Composite armor: lighter and tougher than hull steel per tile (materials.toml), with its own
# ceramic-tile art.

[tile.armor_light]
name = "Composite armor, light"
symbol = "4"
base = "HULL"
weight_class = "LIGHT"
material = "composite_armor"
art = "walls/composite_armor_light"
color = "#7d8c88"

[tile.armor_medium]
name = "Composite armor, medium"
symbol = "5"
base = "HULL"
weight_class = "MEDIUM"
material = "composite_armor"
art = "walls/composite_armor_medium"
color = "#66756f"

[tile.armor_heavy]
name = "Composite armor, heavy"
symbol = "6"
base = "HULL"
weight_class = "HEAVY"
material = "composite_armor"
art = "walls/composite_armor_heavy"
color = "#4d5a56"

# A medbay's deck (round 7): steel floor with a clean covering that doesn't burn. The wounded are
# carried to it once a fight is over and treated there half again as fast.
[tile.medbay]
name = "Medbay deck"
symbol = "m"
base = "FLOOR"
covering = "MEDBAY"
art = "tiles/floor"
color = "#9fc4c0"
