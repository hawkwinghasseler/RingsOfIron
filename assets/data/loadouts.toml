# Ways to arm each hull (combat-sys's LoadoutDef). A pirate draws one when it spawns, from the
# loadouts for its ship whose difficulty range holds the game's difficulty, by weight; so two
# raiders off the same lurk can fight quite differently. A pirate that becomes an ace is refitted
# with one of its hull's ace = true loadouts instead (and those are never drawn at spawn).
#   ship            the [ship.*] it arms
#   weapons         a weapon id per hardpoint, in the order ships.toml lists them; "" (or a short
#                   list) keeps the stock weapon there. A weapon too big for the hardpoint's turret
#                   mount (min_mount_size) is skipped and the stock one kept.
#   weight          how often it is drawn against the others that qualify
#   min_difficulty  drawn from this difficulty up (default 0) ...
#   max_difficulty  ... and below this one (default: no limit)
#   ace             an ace's refit (default false)
# Patrols and the First Play raider keep their stock weapons.

# Light raider: one Small turret mount in the nose.
[loadout.raider_chaingun]
name = "Gun runner"
ship = "raider_light"
weapons = ["chaingun_mk1"]
weight = 5

[loadout.raider_darts]
name = "Dart boat"
ship = "raider_light"
weapons = ["dart_rack"]
weight = 3

# Prize takers: they stun a freighter's systems and board it, so they turn up once the game is harder
[loadout.raider_ion]
name = "Prize taker"
ship = "raider_light"
weapons = ["ion_mk1"]
weight = 1
min_difficulty = 1.0

[loadout.raider_railgun]
name = "Sniper"
ship = "raider_light"
weapons = ["railgun_mk1"]
weight = 1
min_difficulty = 1.5

[loadout.raider_ace_chaingun]
name = "Ace's chaingun"
ship = "raider_light"
weapons = ["chaingun_mk2"]
ace = true
weight = 2

# A railgun ace kills crews outright (its slugs go clean through: round 5 part 2's survey had it kill
# 28 of 30 crew even with wounds), and it kites now, so it only turns up once the player flies a
# gunship (difficulty about 2)
[loadout.raider_ace_railgun]
name = "Ace's railgun"
ship = "raider_light"
weapons = ["railgun_mk2"]
ace = true
weight = 1
min_difficulty = 2.0

# Pirate gunship (round 5; round 3 armed the patrols' gunship hull): a Medium mount in the nose,
# launchers on each beam aft, point defense on each beam forward. Its stock fit is a chaingun and two
# dart racks; the railguns come with the difficulty.
[loadout.gunship_stock]
name = "Raider gunship"
ship = "gunship_raider"
weapons = []
weight = 4

[loadout.gunship_flak]
name = "Flak gunship"
ship = "gunship_raider"
weapons = ["", "", "", "flak_mk1", "flak_mk1"]
weight = 2

[loadout.gunship_brawler]
name = "Brawler"
ship = "gunship_raider"
weapons = ["chaingun_mk1", "", "", "flak_mk1", "flak_mk1"]
weight = 2

[loadout.gunship_raider]
name = "Prize hunter"
ship = "gunship_raider"
weapons = ["ion_mk1", "", "", "", ""]
weight = 1
min_difficulty = 1.0

# The patrols' fit, railgun and harpoons, once the game is harder: by the time the player flies a
# gunship (difficulty about 2) most pirate gunships carry a railgun
[loadout.gunship_line]
name = "Line gunship"
ship = "gunship_raider"
weapons = ["railgun_mk1", "harpoon_launcher", "harpoon_launcher", "", ""]
weight = 3
min_difficulty = 1.75

[loadout.gunship_heavy_railgun]
name = "Heavy gunship"
ship = "gunship_raider"
weapons = ["railgun_heavy"]
weight = 2
min_difficulty = 2.0

# An ace's gunship (once the player flies a gunship, PirateAces.gunshipAce)
# Mostly the 40 mm chaingun, which wears a hull down without killing whole crews; the railgun
# refit is one in four once the player flies a gunship (an ace's railgun gunship beat a gunship in 3 of
# 10 fights and killed 1.6 crew a fight; the chaingun one none)
[loadout.gunship_ace]
name = "Ace's gunship"
ship = "gunship_raider"
weapons = ["chaingun_mk2", "", "", "flak_mk1", "flak_mk1"]
ace = true
weight = 3

[loadout.gunship_ace_railgun]
name = "Ace's railgun gunship"
ship = "gunship_raider"
weapons = ["railgun_mk2", "", "", "flak_mk1", "flak_mk1"]
ace = true
weight = 1
min_difficulty = 2.0

[loadout.gunship_ace_heavy]
name = "Ace's heavy gunship"
ship = "gunship_raider"
weapons = ["railgun_heavy", "", "", "flak_mk1", "flak_mk1"]
ace = true
weight = 1
min_difficulty = 3.0

# The pirate base's gun platforms (round 6, PirateBase): drawn like a spawn's, by the career's seed.
# Its stock fit is two chainguns, a dart rack and flak; the heavier fits come with the difficulty.
# battery_railgun: once the player flies a frigate, one platform may carry a railgun that reaches
# a ship standing off out of its chainguns' range; HostileTraffic.moorGuns keeps it to one, since a
# second would kill whole crews from out there. Round 7 left it at weight 0; round 8 gives it 5
# (about half the frigate's raids meet one) to make the raid hurt with three defenders, not four.
[loadout.battery_stock]
name = "Den battery"
ship = "den_battery"
weapons = []
weight = 3

[loadout.battery_darts]
name = "Dart battery"
ship = "den_battery"
weapons = ["", "", "dart_rack", "dart_rack"]
weight = 1

[loadout.battery_heavy]
name = "Heavy battery"
ship = "den_battery"
weapons = ["chaingun_mk2", "chaingun_mk2", "dart_rack", "flak_mk1"]
weight = 2
min_difficulty = 2.5

[loadout.battery_railgun]
name = "Railgun battery"
ship = "den_battery"
weapons = ["railgun_mk1", "", "", ""]
weight = 5
min_difficulty = 2.2
