# Ship markets (round 3): where factions sell ships, and what they sell (GDD section 5,
# "ship procurement and outfitting"). Bought while docked at one of the faction's yards, from the
# yard window's Ships for sale (Y). The ship the player flies is traded in at its value (Difficulty's hull and
# weapons) times its condition times 80%; cargo and crew move across to the new ship.
#
# [shipyard.<id>]: a faction's yards. A station sells that faction's ships when the faction owns it
# and it is of one of station_types (economy.json) or named in stations.
#
# [ship_sale.<id>]: a ship on sale. seller is the faction whose yards sell it. rank is the rank on
# the sponsor's ladder needed (none if left out), standing the standing with the seller needed.
# Every sale is also held to the rank ladder: a rank flies no chassis larger than its max_chassis
# (factions.toml), the same limit the service's requisition after a rescue keeps to.
# Placeholder prices, a little over each ship's value.

[shipyard.patrol]
faction = "patrol"
# Anvil Yards in high Earth orbit is the Patrol's shipyard; Highport's yard only repairs and refits
station_types = ["shipyard"]

[shipyard.selene]
faction = "selene"
station_types = ["shipyard"]
stations = ["Shackleton Ice"]

[ship_sale.patrol_corvette]
ship = "corvette_patrol"
seller = "patrol"
price = 280000.0

[ship_sale.patrol_gunship]
ship = "gunship_heavy"
seller = "patrol"
# Round 4: a little over its 304,000 value (was 360,000), so the round 3 career buys it at Lieutenant Commander
price = 310000.0
rank = "lieutenant_commander"

[ship_sale.patrol_frigate]
ship = "frigate_patrol"
seller = "patrol"
# Round 5: a little over its 444,000 value (was 720,000), as the gunship is, so a Commander can buy it
# on pay and contracts
price = 455000.0
rank = "commander"

# The Combine sells the light raider's hull as a fast courier to captains it trusts
[ship_sale.selene_raider]
ship = "raider_light"
seller = "selene"
price = 110000.0
standing = 10.0

# The picket boat, a little over its 162,000 value: an Ensign's alternative to the corvette
[ship_sale.patrol_picket]
ship = "picket_patrol"
seller = "patrol"
price = 170000.0

# The Combine sells its salvage tugs to captains it trusts, a little over their 156,000 value
[ship_sale.selene_tug]
ship = "tug_salvage"
seller = "selene"
price = 165000.0
standing = 10.0

# The interceptor, a little over its 163,000 value: the Patrol's fastest hull, and an Ensign's
[ship_sale.patrol_interceptor]
ship = "interceptor_patrol"
seller = "patrol"
price = 175000.0

# The Combine's working hulls, each a little over its value, for captains it trusts. The rank ladder
# still holds them to its sizes: the courier wants a Lieutenant Commander, the surveyor and the ore
# barge a Commander
[ship_sale.selene_courier]
ship = "courier_selene"
seller = "selene"
price = 125000.0
standing = 10.0

[ship_sale.selene_surveyor]
ship = "surveyor_selene"
seller = "selene"
price = 190000.0
standing = 10.0

[ship_sale.selene_ore_barge]
ship = "barge_ore"
seller = "selene"
price = 245000.0
standing = 10.0
