# Operations: short chains of linked contracts a faction offers at rank milestones (GDD section 4).
#
# [operation.<id>]: offered on the giver's station boards once the player holds `rank` with the
# sponsor, until it is done. Taking it starts the first step; each step is a contract of its own,
# paid as usual, and the next is posted when it is done. Finishing the last pays `reward` credits
# and `standing` with the giver; failing or abandoning any step fails the operation, at half its
# standing. Steps: patrol, recon (find a pirate where it lurks), bounty (on the pirate the recon
# found, else any the giver is at war with), escort, convoy, delivery, intel (find a pirate and
# follow it home to the pirates' base; skipped once the base is known) and raid (take or disable
# the base). requires = "base_fallen" holds an operation back until the pirates' base has fallen.
# Placeholder numbers.

[operation.clear_the_lanes]
name = "Clear the Lanes"
text = "Raiders are working the station lanes. Sweep a lane, find where one of them rests, and take it."
giver = "patrol"
rank = "lieutenant"
reward = 8000.0
standing = 6.0
steps = ["patrol", "recon", "bounty"]

[operation.lifeline]
name = "Lifeline"
text = "A haul the stations cannot do without. See it through, then deal with whoever is waiting for it."
giver = "patrol"
rank = "lieutenant_commander"
reward = 15000.0
standing = 8.0
steps = ["escort", "recon", "bounty"]

[operation.hunt_the_hunters]
name = "Hunt the Hunters"
text = "The raiders rest somewhere out past the lanes. Find one and take it, follow another home, then burn their nest."
giver = "patrol"
rank = "commander"
reward = 30000.0
standing = 10.0
steps = ["recon", "bounty", "intel", "raid"]

# Round 5: operations with convoy and delivery steps, and more for the ranks past the gunship. Given
# by the sponsor (giver empty), so a Selene career is offered them too. A convoy step falls back to
# an escort when no two freighters haul together.

[operation.supply_line]
name = "Supply Line"
text = "A station's stores are running thin. Carry what it needs, then see the next haul in safely."
giver = ""
rank = "lieutenant"
reward = 6000.0
standing = 5.0
steps = ["delivery", "convoy"]

[operation.safe_harbour]
name = "Safe Harbour"
text = "The haulers want to see a warship on their lanes. Bring a convoy in, sweep a lane, and carry the stores they could not."
giver = ""
rank = "lieutenant_commander"
reward = 14000.0
standing = 8.0
steps = ["convoy", "patrol", "delivery"]

[operation.iron_escort]
name = "Iron Escort"
text = "A run the raiders will try for. Bring the convoy in, find who is waiting on the lanes, take them, and bring the next one in."
giver = ""
rank = "commander"
reward = 28000.0
standing = 10.0
steps = ["convoy", "recon", "bounty", "convoy"]

[operation.long_watch]
name = "The Long Watch"
text = "Command wants the far lanes held. Sweep them, hunt down two crews working them, and keep the stores moving."
giver = ""
rank = "captain"
reward = 45000.0
standing = 12.0
steps = ["patrol", "recon", "bounty", "recon", "bounty", "delivery"]

# Round 6: after the base falls, the Patrol wants what is left of the raiders run down before they
# find a new home.
[operation.scatter_the_remnants]
name = "Scatter the Remnants"
text = "Rustwake has fallen, but its crews are still out there. Find the ones who got away, take them, and show the haulers the lanes are safe."
giver = ""
rank = "captain"
reward = 50000.0
standing = 12.0
steps = ["recon", "bounty", "patrol"]
requires = "base_fallen"
