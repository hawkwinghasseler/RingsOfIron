# Construction materials (combat-sys design, section 6). One row per weight class:
# mass per full tile (kg), hit points (J to destroy), armor (penetration removed, J).

[material.hull_steel]
fire_chance = 0.0
ablation_factor = 1.0
# Spread over a tile's 1 m x 2.5 m outer face, light is ~2 cm of steel with its frames (a destroyer's
# side plating), medium ~10 cm (a cruiser's armor belt), heavy ~25 cm (a battleship's belt).
# Nov 2026: light was 800 kg (~4 cm), heavier than any unarmored hull plating.
light  = { mass = 400.0,  hit_points = 2.0e6, armor = 1.0e6 }
medium = { mass = 2000.0, hit_points = 5.0e6, armor = 3.0e6 }
heavy  = { mass = 5000.0, hit_points = 1.2e7, armor = 8.0e6 }

[material.composite_armor]
fire_chance = 0.0
ablation_factor = 0.6
light  = { mass = 600.0,  hit_points = 2.5e6, armor = 2.0e6 }
medium = { mass = 1500.0, hit_points = 6.0e6, armor = 5.0e6 }
heavy  = { mass = 3800.0, hit_points = 1.4e7, armor = 1.2e7 }
