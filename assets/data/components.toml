# Ship components: the systems chassis rows draw with a letter (see chassis.toml). Each is
# built on one subsystem behavior, which fixes its mount kind and what it does. The ship
# editor (gradlew :lwjgl3:runShipEditor) edits this file.
#   symbol        one letter, unique across tile types and components
#   behavior      REACTOR, SHIELD_EMITTER, TURRET_MOUNT (square mounts); LIFE_SUPPORT, HELM,
#                 WEAPONS, CARGO, AIRLOCK (rectangular slots); DOCKING_PORT (hull edge)
#   sizes         mount sizes it comes in; leave out for every size of its mount kind
#   color         how the editor draws it
#   power_output  REACTOR: watts at full health by size (standard 1, 3, 10, 30 MW for S-XL)
#   throughput    LIFE_SUPPORT: multiplies scrubbing, air and oxygen supply (1.0 standard)
# These restate the built-in letters; a component left out keeps its built-in meaning.

[component.reactor]
name = "Reactor"
symbol = "R"
behavior = "REACTOR"
color = "#e0703a"

[component.shield_emitter]
name = "Shield emitter"
symbol = "S"
behavior = "SHIELD_EMITTER"
color = "#4aa0e0"

[component.turret_mount]
name = "Turret mount"
symbol = "T"
behavior = "TURRET_MOUNT"
color = "#d04a4a"

[component.life_support]
name = "Life support"
symbol = "L"
behavior = "LIFE_SUPPORT"
color = "#4ac07a"

[component.helm]
name = "Helm"
symbol = "H"
behavior = "HELM"
color = "#e0d04a"

[component.weapons]
name = "Weapons console"
symbol = "W"
behavior = "WEAPONS"
color = "#c06ad0"

[component.cargo]
name = "Cargo bay"
symbol = "C"
behavior = "CARGO"
color = "#a08050"

[component.airlock]
name = "Airlock"
symbol = "A"
behavior = "AIRLOCK"
color = "#50c0c0"

[component.docking_port]
name = "Docking port"
symbol = "D"
behavior = "DOCKING_PORT"
color = "#e0e0e0"
