# Ship components: the systems chassis rows draw with a letter (see chassis.toml). Each is
# built on one subsystem behavior, which fixes its mount kind and what it does. The ship
# editor (gradlew :lwjgl3:runShipEditor) edits this file.
#   symbol        one letter, unique across tile types and components
#   behavior      REACTOR, SHIELD_EMITTER, TURRET_MOUNT (square mounts); LIFE_SUPPORT, HELM,
#                 WEAPONS, CARGO, AIRLOCK, TANK, ENGINE, ESCAPE_POD (rectangular slots); DOCKING_PORT
#                 (hull edge). An escape pod seats 4, 8, 20 or 48 by size (S-XL).
#   sizes         mount sizes it comes in; leave out for every size of its mount kind
#   color         how the editor draws it
#   power_output  REACTOR: watts at full health by size (standard 1, 3, 10, 30 MW for S-XL)
#   throughput    LIFE_SUPPORT: multiplies scrubbing, air and oxygen supply (1.0 standard)
#   fluid         TANK: OXYGEN, NITROGEN or PROPELLANT (the default)
#   capacity      TANK: kilograms by size (standard 150 kg of a gas, 1,000 kg of propellant a tile)
#   thrust        ENGINE: newtons at full health by size (standard 1.2, 3.6, 12, 36 MN for S-XL);
#                 a ship's main engine is the sum of its working engines, scaled by their damage
#   efficiency    ENGINE: multiplies the ship's exhaust velocity, so propellant goes this much
#                 further (1.0 standard; mixed engines average by thrust)
#   casing        ENGINE: weight class of the hull its casing is (LIGHT standard, MEDIUM, HEAVY)
#   mass          kilograms the system itself weighs, by size (a tank's contents not counted; the
#                 tiles under it weigh their own 150 kg of deck). Left out, the standard for its
#                 behavior (interior-grid's ComponentMass), in tonnes for S / M / L / XL:
#                   engine 6 / 18 / 60 / 180 (thrust-to-weight ~20)
#                   reactor 10 / 25 / 70 / 180      shield emitter 3 / 10 / 30 / 80
#                   turret mount, with its gun, 5 / 25 / 80 / 250
#                   life support and airlock 1.5 / 4 / 12 / 30
#                   helm and weapons console 0.5 / 1.5 / 4 / 10      cargo bay 0.2 / 0.6 / 2 / 6
#                   escape pod 3 / 5 / 10 / 20      docking port 0.5 / 1.5 / 4
#                   propellant tank 0.15 / 0.4 / 1.2 / 3 (~5% of what it holds)
#                   oxygen or nitrogen tank 0.4 / 1.2 / 4 / 10 (high-pressure vessels)
#   maker, description  who makes it and one line on it, for the yard and the editor
#   price         credits a station yard charges to fit one, by size, when it rebuilds the decks
#                 (a part it takes out is bought back at half); left out, it comes free
#   short_chance  chance, 0-1, that a damaging hit shorts the system out while powered (standard:
#                 reactor 0.08, shield emitter 0.06, tanks, cargo and escape pods 0, the rest 0.04)
#   burst_threshold  TANK: health below which a hit can burst it (standard 0.25)
#   burst_chance  TANK: chance each such hit bursts it (standard: propellant 0.35, oxygen 0.3,
#                 nitrogen 0.2). See documentation/interior-grid/Design.md, "Damage states".
# These restate the built-in letters; a component left out keeps its built-in meaning.

[component.reactor]
name = "Reactor"
symbol = "R"
behavior = "REACTOR"
color = "#e0703a"
short_chance = 0.08

[component.shield_emitter]
name = "Shield emitter"
symbol = "S"
behavior = "SHIELD_EMITTER"
color = "#4aa0e0"

[component.turret_mount]
name = "Turret mount"
symbol = "T"
behavior = "TURRET_MOUNT"
color = "#d04a4a"

[component.life_support]
name = "Life support"
symbol = "L"
behavior = "LIFE_SUPPORT"
color = "#4ac07a"

[component.helm]
name = "Helm"
symbol = "H"
behavior = "HELM"
color = "#e0d04a"

[component.weapons]
name = "Weapons console"
symbol = "W"
behavior = "WEAPONS"
color = "#c06ad0"

[component.cargo]
name = "Cargo bay"
symbol = "C"
behavior = "CARGO"
color = "#a08050"

[component.airlock]
name = "Airlock"
symbol = "A"
behavior = "AIRLOCK"
color = "#50c0c0"

# Main engines, from three makers, each with its own look outside the hull and its own plume:
#   Halvorsen Propulsion: regeneratively cooled bell nozzles, the yard standard. Model codes, HR-
#     and a number, a letter after it for a variant.
#   Imbrium Heavy Foundry: drives in a cast casing, built to take a beating rather than to sip
#     propellant. One hard word for a name.
#   Aster Dynamics: aerospikes for deep-space work, frugal and quick to wear but fragile. A
#     constellation and a number.
# A ship's existing drives keep their ids (E, G and Q in the maps); the yard fits any of them.
[component.engine]
name = "Halvorsen HR-40"
maker = "Halvorsen Propulsion"
description = "The yard-standard bell-nozzle drive: rated thrust at the standard propellant cost."
symbol = "E"
behavior = "ENGINE"
color = "#6aa8e8"
price = { S = 12000.0, M = 36000.0, L = 110000.0, XL = 320000.0 }

# A hauler's drive: big and frugal, but slow to push a loaded hull. The freighter's two
# Medium ones give it the 3.0 MN it had before engines set thrust.
[component.freight_drive]
name = "Halvorsen HR-25F"
maker = "Halvorsen Propulsion"
description = "A long-bell freight drive: well under half the HR-40's thrust, but 15% further on a tank."
symbol = "Q"
behavior = "ENGINE"
color = "#5a8ec0"
thrust = { S = 5.0e5, M = 1.5e6, L = 5.0e6, XL = 1.5e7 }
efficiency = 1.15
# Lighter-built than the HR-40 for its size, though far heavier for its thrust
mass = { S = 5400.0, M = 16200.0, L = 54000.0, XL = 162000.0 }
price = { S = 8000.0, M = 24000.0, L = 75000.0, XL = 220000.0 }

# A gunship's drives: Medium, but rated down so the heavy hull is slower off the mark than the
# corvette. The gunship's two give it the 3.4 MN its ships.toml entry restates.
[component.gunship_drive]
name = "Imbrium Rampart"
maker = "Imbrium Heavy Foundry"
description = "A low-rated drive in a medium-hull casing that shrugs off hits; thirsty."
symbol = "G"
behavior = "ENGINE"
color = "#6a9ad8"
thrust = { S = 5.7e5, M = 1.7e6, L = 5.7e6, XL = 1.7e7 }
efficiency = 0.9
casing = "MEDIUM"
# Cased in medium hull
mass = { S = 7200.0, M = 21600.0, L = 72000.0, XL = 216000.0 }
price = { S = 10000.0, M = 30000.0, L = 95000.0, XL = 280000.0 }
short_chance = 0.02

[component.imbrium_bulwark]
name = "Imbrium Bulwark"
maker = "Imbrium Heavy Foundry"
description = "A tenth more thrust than the HR-40 in a medium-hull casing that shrugs off hits; thirsty."
symbol = "K"
behavior = "ENGINE"
color = "#7a8fb8"
thrust = { S = 1.32e6, M = 3.96e6, L = 1.32e7, XL = 3.96e7 }
efficiency = 0.9
casing = "MEDIUM"
# Cased in medium hull, with a tenth more drive inside
mass = { S = 7800.0, M = 23400.0, L = 78000.0, XL = 234000.0 }
price = { S = 16000.0, M = 48000.0, L = 145000.0, XL = 420000.0 }
short_chance = 0.02

[component.aster_lyra]
name = "Aster Lyra 7"
maker = "Aster Dynamics"
description = "A vacuum aerospike: 85% of the HR-40's thrust, a third further on a tank, easily shorted."
symbol = "Y"
behavior = "ENGINE"
color = "#8ac8e0"
thrust = { S = 1.02e6, M = 3.06e6, L = 1.02e7, XL = 3.06e7 }
efficiency = 1.35
# An aerospike is shorter and lighter than a bell of the same thrust
mass = { S = 5400.0, M = 16200.0, L = 54000.0, XL = 162000.0 }
price = { S = 22000.0, M = 65000.0, L = 200000.0, XL = 580000.0 }
short_chance = 0.07

[component.docking_port]
name = "Docking port"
symbol = "D"
behavior = "DOCKING_PORT"
color = "#e0e0e0"

[component.tank]
name = "Propellant tank"
