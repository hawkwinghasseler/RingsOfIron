# Engineering aft (left), the helm forward.
rows = [
  "####################",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#RR.CCCCCCCCCCCC.HH#",
  "#RR.CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#L++++++++++++++++.#",
  "#L..CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "####################",
]
