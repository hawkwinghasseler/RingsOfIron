# Interior layouts. Same character map as interior-grid's ChassisBlueprintLoader:
#   '#' hull (medium)  '1'/'2'/'3' hull light/medium/heavy  'I' internal wall
#   '.' floor  '+' power conduit  ' ' void
#   R reactor, S shield, T turret (square mounts); L life support, H helm,
#   W weapons console, C cargo, A airlock (rectangular slots)
# Rows read top to bottom; listed coordinates have (0, 0) at the bottom-left tile.

