# Interior layouts. Same character map as interior-grid's ChassisBlueprintLoader:
#   '#' hull (medium)  '1'/'2'/'3' hull light/medium/heavy  'I' internal wall
#   '.' floor  '+' power conduit  ' ' void
#   R reactor, S shield, T turret (square mounts); L life support, H helm,
#   W weapons console, C cargo, A airlock (rectangular slots)
#   D docking port, drawn over the hull edge: 3 x 1 Small, 5 x 2 Medium, 7 x 3 Large.
#     The end tiles are frame, the rest the opening, with the port door on its
#     outer edge. It faces the side with only space beyond it. Ports are passive
#     unless listed under ports = [ { x, y, active = true } ] (any tile of the port).
# Rows read top to bottom; listed coordinates have (0, 0) at the bottom-left tile.
# A chassis marked station = true is a station layout, named by a station type's
# blueprint in economy.json.

[chassis.corvette]
name = "Corvette"
tile_size = 1.0
origin_x = -9.0
origin_y = -3.0
# A turret mount under each hardpoint in ships.toml (combat wires each weapon to
# the nearest one): nose (12,2), port and starboard beams (10,4) and (10,1), the
# launcher (7,4) and the laser (7,1). The weapons console sits aft, away from
# every hardpoint.
# Cargo: a hold aft of the crew spaces with two 3 x 2 bays (x 1-3; listed under
# mounts, since two bays side by side can't be told apart in the map), a walkway
# at x 4, and two small bays up front. 16 tiles, 40 m3 at 2.5 m3 a tile.
# A Small passive docking port on the port (+y) side opens onto the walkway beside
# the hold.
rows = [
  "###DDD########",
  "#....HHTCCTRR#",
  "#....WW....RR#",
  "#....L.++++.T#",
  "#....L.T..TCC#",
  "##############",
]
mounts = [
  { type = "CARGO", size = "M", x = 1, y = 1, rotation = 1 },
  { type = "CARGO", size = "M", x = 1, y = 3, rotation = 1 },
]
# Carpet through the crew spaces, so a fire here has something to burn
coverings = [ { covering = "CARPET", x = 5, y = 1, width = 6, height = 4 } ]

[chassis.freighter]
name = "Light Freighter"
tile_size = 1.0
origin_x = -10.0
origin_y = -6.5
# Two 12 x 5 cargo bays either side of a conduit spine: 120 tiles, 300 m3 of cargo.
# Engineering aft (left), the helm forward, and a Medium passive docking port in
# the bow at the end of the spine.
rows = [
  "####################",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#RR.CCCCCCCCCCCC.HH#",
  "#RR.CCCCCCCCCCCC..DD",
  "#...CCCCCCCCCCCC..DD",
  "#L++++++++++++++++DD",
  "#L..CCCCCCCCCCCC..DD",
  "#...CCCCCCCCCCCC..DD",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "#...CCCCCCCCCCCC...#",
  "####################",
]

# Stations. Every station type carries docking ports of all three sizes, so any ship
# can berth: an outpost one of each, a hub two of each. Station ports are active, so
# a station that grants docking clearance reaches out with its collar.

[chassis.station_outpost]
name = "Outpost"
station = true
tile_size = 1.0
origin_x = -12.0
origin_y = -8.0
