# Interior layouts. Same character map as interior-grid's ChassisBlueprintLoader:
#   '#' hull (medium)  '1'/'2'/'3' hull light/medium/heavy  'I' internal wall
#   '.' floor  '+' power conduit  ' ' void
#   R reactor, S shield, T turret (square mounts); L life support, H helm,
#   W weapons console, C cargo, A airlock, E engine (an engine's nozzle faces aft
#   (-x) when it lies along x, and +y when it stands along y), P propellant tank,
#   O oxygen tank, N nitrogen tank (rectangular slots)
#   D docking port, drawn over the hull edge: 3 x 1 Small, 5 x 2 Medium, 7 x 3 Large.
#     The end tiles are frame, the rest the opening, with the port door on its
#     outer edge. It faces the side with only space beyond it. Ports are passive
#     unless listed under ports = [ { x, y, active = true } ] (any tile of the port).
#   pipes = [ { x, y }, { x, y, side } ] lays a pipe across tile (x, y), or along that
#     side of it (inside any wall). Pipes join tanks to the systems that draw on them:
#     life support takes oxygen and nitrogen, the engines take propellant.
#   lights = [ { x, y, side } ] hangs a wall light on that side of tile (x, y), shining
#     into the tile; it takes no room there. The ship editor's Light tool places them
#     (and auto-places them along every room's walls). With no lights key the game
#     works them out the same way.
# Rows read top to bottom; listed coordinates have (0, 0) at the bottom-left tile.
# A chassis marked station = true is a station layout, named by a station type's
# blueprint in economy.json.

[chassis.corvette]
name = "Corvette"
tile_size = 1.0
origin_x = -11.0
origin_y = -3.0
# Two Small engines in the stern (x 1-2), their nozzles out through the aft hull,
# with the oxygen and nitrogen tanks between them. One pipe run joins them all: up
# the stern, then along the bottom hull to the propellant tank on the walkway (x 6)
# and life support (x 7).
# A turret mount under each hardpoint in ships.toml (combat wires each weapon to
# the nearest one): nose (14,2), port and starboard beams (12,4) and (12,1), the
# launcher (9,4) and the laser (9,1). The weapons console sits aft, away from
# every hardpoint.
# Cargo: a hold aft of the crew spaces with two 3 x 2 bays (x 3-5; listed under
# mounts, since two bays side by side can't be told apart in the map), a walkway
# at x 6, and two small bays up front. 16 tiles, 40 m3 at 2.5 m3 a tile.
# A Small passive docking port on the port (+y) side opens onto the walkway beside
# the hold.
rows = [
  "#####DDD########",
  "#EE....HHTCCTRR#",
  "#......WW....RR#",
  "#.....PL.++++.T#",
  "#EE...PL.T..TCC#",
  "################",
]
mounts = [
  { type = "CARGO", size = "M", x = 3, y = 1, rotation = 1 },
  { type = "CARGO", size = "M", x = 3, y = 3, rotation = 1 },
  { component = "oxygen_tank", size = "S", x = 1, y = 2, rotation = 1 },
  { component = "nitrogen_tank", size = "S", x = 1, y = 3, rotation = 1 },
]
pipes = [
  { x = 2, y = 1 }, { x = 2, y = 2 }, { x = 2, y = 3 }, { x = 2, y = 4 },
  { x = 2, y = 1, side = "BOTTOM" }, { x = 3, y = 1, side = "BOTTOM" },
  { x = 4, y = 1, side = "BOTTOM" }, { x = 5, y = 1, side = "BOTTOM" },
  { x = 6, y = 1, side = "BOTTOM" }, { x = 7, y = 1, side = "BOTTOM" },
]
# Carpet through the crew spaces, so a fire here has something to burn
coverings = [ { covering = "CARPET", x = 7, y = 1, width = 6, height = 4 } ]
lights = [
  { x = 8, y = 1, side = "BOTTOM" },
  { x = 11, y = 1, side = "BOTTOM" },
]

