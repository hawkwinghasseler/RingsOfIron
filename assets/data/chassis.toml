# Interior layouts. Same character map as interior-grid's ChassisBlueprintLoader:
#   '#' hull (medium)  '1'/'2'/'3' hull light/medium/heavy  'I' internal wall
#   '.' floor  '+' power conduit  ' ' void
#   A conduit tile carries power through a thin wall to a conduit tile on its other side.
#   R reactor, S shield, T turret (square mounts); L life support, H helm,
#   W weapons console, C cargo, A airlock, E engine, P propellant tank,
#   O oxygen tank, N nitrogen tank, Q freight drive and G gunship drive (engines), B escape pod
#   (rectangular slots; a pod's hatch is the end that faces +y at rotation 0. That end
#   overlaps the outer hull, which stays hull under it, and the rest of the pod lies
#   inside; beyond the hatch it needs 5 tiles of open space, with no RCS block on the
#   hatch end, to launch into. List pods under mounts so the hull under the hatch is kept)
#   Engines mount on the outside of the hull: drawn out in the void, with the nozzle at the end
#     that has only space beyond it and the flange at the other end, either against the outer
#     hull or in place of one tile of it (the engine reaches one tile into the wall, no more).
#     Past the nozzle, as wide as the engine, 5 tiles for each tile of its width stay clear for
#     the exhaust (5 Small, 10 Medium, 15 Large, 25 Extra Large). The crew, power and pipes
#     reach it from the deck just inside the wall behind its flange.
#   D docking port, drawn over the hull edge: 3 x 1 Small, 5 x 2 Medium, 7 x 3 Large.
#     The end tiles are frame, the rest the opening, with the port door on its
#     outer edge. It faces the side with only space beyond it. Ports are passive
#     unless listed under ports = [ { x, y, active = true } ] (any tile of the port).
#   edge_walls = [ { x, y, side, weight_class, bulkhead } ] puts a thin wall on that side of
#     tile (x, y), dividing two rooms without spending a tile on the wall; bulkhead = true puts
#     a door in it (open at the start). A shut door stops crew, air, fire and power alike.
#   edge_conduits = [ { x, y, side } ] runs a power conduit along that side of tile (x, y), inside
#     whatever wall stands there, and feeds the rooms on both sides. Every ship but the audio demo
#     runs one along each thin wall it has, so a room stays powered with its door shut.
#   pipes = [ { x, y }, { x, y, side } ] lays a pipe across tile (x, y), or along that
#     side of it (inside any wall). Pipes join tanks to the systems that draw on them:
#     life support takes oxygen and nitrogen, the engines take propellant.
#   lights = [ { x, y, side } ] hangs a wall light on that side of tile (x, y), shining
#     into the tile; it takes no room there. The ship editor's Light tool places them
#     (and auto-places them along every room's walls). With no lights key the game
#     works them out the same way.
#   rcs = [ { x, y, side, kind, thrust } ] bolts an RCS thruster block onto that side of
#     hull tile (x, y), a side that faces space. kind LINEAR has one nozzle, out through
#     that side; QUAD has that one and one each way along the hull. thrust is newtons a
#     nozzle (left out, the kind's standard). A ship with blocks turns, strafes and backs
#     up on what they give it rather than its max_torque and the engines' share; a
#     block stops when its hull tile is destroyed. The ship editor's RCS tool places them.
# Rows read top to bottom; listed coordinates have (0, 0) at the bottom-left tile.
# A chassis marked station = true is a station layout, named by a station type's
# blueprint in economy.json.

[chassis.corvette]
name = "Corvette"
tile_size = 1.0
origin_x = -12.0
origin_y = -3.0
# Two Small engines on the stern (x 0-1), their flanges in the aft hull,
# with the oxygen and nitrogen tanks between them. One pipe run joins them all: up
# the stern, then along the bottom hull to the propellant tank on the walkway (x 7)
# and life support (x 8).
# A turret mount under each hardpoint in ships.toml (combat wires each weapon to
# the nearest one): nose (15,2), port and starboard beams (13,4) and (13,1), the
# launcher (10,4) and the laser (10,1). The weapons console sits aft, away from
# every hardpoint.
# Cargo: a hold aft of the crew spaces with two 3 x 2 bays (x 4-6; listed under
# mounts, since two bays side by side can't be told apart in the map), a walkway
# at x 7, and two small bays up front. 16 tiles, 40 m3 at 2.5 m3 a tile.
# A Small docking port on the port (+y) side opens onto the walkway beside the hold.
# It is active: its collar reaches out and takes hold of another ship's port, armed
# or not, so the corvette can latch onto a ship as well as a station.
# A Small escape pod (4 seats) stands at x 11 between the laser and the starboard
# beam turret, its hatch end in the starboard (-y) hull clear of the RCS block at x 9.
rows = [
  " #####DDD########",
  "EE......HHTCCTRR#",
  " #......WW....RR#",
  " #.....PL.++++.T#",
  "EE.....PL.T..TCC#",
  " ################",
]
ports = [ { x = 7, y = 5, active = true } ]
mounts = [
  { type = "CARGO", size = "M", x = 4, y = 1, rotation = 1 },
  { type = "CARGO", size = "M", x = 4, y = 3, rotation = 1 },
  { component = "oxygen_tank", size = "S", x = 2, y = 2, rotation = 1 },
  { component = "nitrogen_tank", size = "S", x = 2, y = 3, rotation = 1 },
  { component = "escape_pod", size = "S", x = 11, y = 0, rotation = 2 },
]
pipes = [
  { x = 2, y = 4 }, { x = 2, y = 1 },
  { x = 3, y = 1 }, { x = 3, y = 2 }, { x = 3, y = 3 }, { x = 3, y = 4 },
  { x = 3, y = 1, side = "BOTTOM" }, { x = 4, y = 1, side = "BOTTOM" },
  { x = 5, y = 1, side = "BOTTOM" }, { x = 6, y = 1, side = "BOTTOM" },
  { x = 7, y = 1, side = "BOTTOM" }, { x = 8, y = 1, side = "BOTTOM" },
]
# Carpet through the crew spaces, so a fire here has something to burn
coverings = [ { covering = "CARPET", x = 8, y = 1, width = 6, height = 4 } ]
lights = [
  { x = 3, y = 1, side = "BOTTOM" },
  { x = 12, y = 1, side = "BOTTOM" },
  { x = 3, y = 4, side = "TOP" },
  { x = 7, y = 4, side = "LEFT" },
]
# A thin wall closes the hold and engineering off from the walkway (x 6 | 7), with a door at y 3. A
# conduit runs in it, so the engines stay powered with the door shut. The bridge stays open to the
# reactor room forward: a wall there (x 9 | 10) slowed the crew to a shorted reactor so much that the
# First Play raider gave up in half the time (FirstHourBalanceBenchmark).
edge_walls = [
  { x = 6, y = 1, side = "RIGHT", weight_class = "MEDIUM" },
  { x = 6, y = 2, side = "RIGHT", weight_class = "MEDIUM" },
  { x = 6, y = 3, side = "RIGHT", weight_class = "MEDIUM", bulkhead = true },
  { x = 6, y = 4, side = "RIGHT", weight_class = "MEDIUM" },
]
edge_conduits = [
  { x = 6, y = 1, side = "RIGHT" }, { x = 6, y = 2, side = "RIGHT" }, { x = 6, y = 3, side = "RIGHT" },
  { x = 6, y = 4, side = "RIGHT" },
]
# RCS: a quad block at each corner turns the ship, a linear pair amidships (over the centre of
# mass) strafes it, and a linear pair on the bow either side of the centreline backs it up.
# Thrusts are set so it turns, strafes and backs up as hard as it did on its ship's figures.
rcs = [
  { x = 2, y = 5, side = "TOP", kind = "QUAD", thrust = 8.5e3 },
  { x = 2, y = 0, side = "BOTTOM", kind = "QUAD", thrust = 8.5e3 },
  { x = 15, y = 5, side = "TOP", kind = "QUAD", thrust = 8.5e3 },
  { x = 15, y = 0, side = "BOTTOM", kind = "QUAD", thrust = 8.5e3 },
  { x = 9, y = 5, side = "TOP", kind = "LINEAR", thrust = 5.8e5 },
  { x = 9, y = 0, side = "BOTTOM", kind = "LINEAR", thrust = 5.8e5 },
  { x = 16, y = 2, side = "RIGHT", kind = "LINEAR", thrust = 4.6e5 },
  { x = 16, y = 3, side = "RIGHT", kind = "LINEAR", thrust = 4.6e5 },
]


