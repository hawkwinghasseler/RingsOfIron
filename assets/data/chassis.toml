# Interior layouts, in layers. Each chassis is a grid of tile types (rows), with everything on
# top of and between the tiles listed apart from it. See ChassisDef and ChassisBlueprintLoader.
#
#   rows: tile types only, one character a tile (tiles.toml), the top row first:
#     '#' hull (medium)  '1'/'2'/'3' hull light/medium/heavy  '4'-'6' composite armor
#     'I' internal wall  '.' floor  'm' medbay deck  ' ' void
#   Everything else lists grid coordinates, (0, 0) the bottom-left tile and +y up.
#
#   mounts = [ { component, size, x, y, rotation, active } ] installs a component
#     (components.toml) in a mount of that size (S, M, L, XL) with bottom-left tile (x, y),
#     turned rotation quarter turns counter-clockwise. The rows say what lies under it:
#     floor under an interior system; hull under a docking port and under an escape pod's
#     hatch end; void under an engine.
#     Engines mount on the outside of the hull, out in the void, with the nozzle at the end
#       that has only space beyond it and the flange at the other end, against the outer hull.
#       Past the nozzle, as wide as the engine, 5 tiles for each tile of its width stay clear
#       for the exhaust (5 Small, 10 Medium, 15 Large, 25 Extra Large). The crew, power and
#       pipes reach it from the deck just inside the wall behind its flange.
#     A docking port sits over the hull edge: 3 x 1 Small, 5 x 2 Medium, 7 x 3 Large. The end
#       tiles are frame, the rest the opening, with the port door on its outer edge; rotation
#       turns it to face out. active = true gives it a latch collar; ports are passive without.
#     An escape pod's hatch is the end that faces +y at rotation 0. That end overlaps the outer
#       hull and the rest of the pod lies inside; beyond the hatch it needs 5 tiles of open
#       space, with no RCS block on the hatch end, to launch into.
#
#   Conduits, pipes and thin walls are written as runs: a list of points, each step from one
#   to the next straight across or up and down.
#     A tile run, [[x, y], [x, y], ...], lies on every tile it passes; one point is one tile.
#     An edge run goes corner to corner along tile edges, corner (x, y) being the bottom-left
#     corner of tile (x, y); it lies on every edge it passes.
#   conduits = [ tile runs ] lays power conduit across tiles, on top of the floor (or a wall)
#     and under any system there. Only conduits carry power: bare floor carries none. A conduit
#     joins the conduits on the tiles beside it, through any thin wall or door between them.
#   edge_conduits = [ edge runs ] runs power conduit along tile edges, inside whatever wall
#     stands there, joining the conduits on the tiles both sides of it.
#     A system draws power from any conduit on one of its tiles or along one of their edges; an
#     engine, from those of the deck tiles just inside the wall behind its flange.
#   pipes = [ tile runs ] and edge_pipes = [ edge runs ] lay pipe across tiles or along their
#     edges (inside any wall). Pipes join tanks to the systems that draw on them: life support
#     takes oxygen and nitrogen, the engines take propellant.
#   edge_walls = [ { path, weight_class, material } ] builds a thin wall along an edge run,
#     dividing two rooms without spending a tile on the wall.
#   doors = [ { x, y, side } ] puts a door in the thin wall on that side of tile (x, y) (open at
#     the start). A shut door stops crew, air and fire; power goes on through its conduits.
#   lights = [ { x, y, side } ] hangs a wall light on that side of tile (x, y), shining
#     into the tile; it takes no room there. The ship editor's Light tool places them
#     (and auto-places them along every room's walls). With no lights key the game
#     works them out the same way.
#   rcs = [ { x, y, side, kind, thrust } ] bolts an RCS thruster block onto that side of
#     hull tile (x, y), a side that faces space. kind LINEAR has one nozzle, out through
#     that side; QUAD has that one and one each way along the hull. thrust is newtons a
#     nozzle, left out for the kind's standard: 300 kN for a linear block, 100 kN for each
#     of a quad's. A ship with blocks turns, strafes and backs up on what they give it
#     rather than its max_torque and the engines' share; a block stops when its hull tile
#     is destroyed. The ship editor's RCS tool places them.
# A chassis marked station = true is a station layout, named by a station type's
# blueprint in economy.json.

[chassis.corvette]
name = "Corvette"
tile_size = 1.0
origin_x = -13.0
origin_y = -3.0
# Two Small engines on the stern (x 0-1), their flanges against the aft hull,
# with the oxygen and nitrogen tanks between them. One pipe run joins them all: up
# the stern, then along the bottom hull to the propellant tank on the walkway (x 8)
# and life support (x 9).
# A turret mount under each hardpoint in ships.toml (combat wires each weapon to
# the nearest one): nose (16,2), port and starboard beams (14,4) and (14,1), the
# launcher (11,4) and the laser (11,1). The weapons console sits aft, away from
# every hardpoint.
# Cargo: a hold aft of the crew spaces with two 3 x 2 bays (x 5-7), a walkway
# at x 8, and two small bays up front. 16 tiles, 40 m3 at 2.5 m3 a tile.
# A Small docking port on the port (+y) side opens onto the walkway beside the hold.
# It is active: its collar reaches out and takes hold of another ship's port, armed
# or not, so the corvette can latch onto a ship as well as a station.
# A Small escape pod (4 seats) stands at x 12 between the laser and the starboard
# beam turret, its hatch end in the starboard (-y) hull clear of the RCS block at x 10.
rows = [
  "  ################",
  "  #..............#",
  "  #..............#",
  "  #..............#",
  "  #..............#",
  "  ################",
]
mounts = [
  { component = "docking_port", size = "S", x = 7, y = 5, active = true },
  { component = "engine", size = "S", x = 0, y = 4, rotation = 1 },
  { component = "helm", size = "S", x = 9, y = 4, rotation = 1 },
  { component = "turret_mount", size = "S", x = 11, y = 4 },
  { component = "cargo", size = "S", x = 12, y = 4, rotation = 1 },
  { component = "turret_mount", size = "S", x = 14, y = 4 },
  { component = "nitrogen_tank", size = "S", x = 3, y = 3, rotation = 1 },
  { component = "cargo", size = "M", x = 5, y = 3, rotation = 1 },
  { component = "weapons", size = "S", x = 9, y = 3, rotation = 1 },
  { component = "reactor", size = "M", x = 15, y = 3 },
  { component = "oxygen_tank", size = "S", x = 3, y = 2, rotation = 1 },
  { component = "turret_mount", size = "S", x = 16, y = 2 },
  { component = "engine", size = "S", x = 0, y = 1, rotation = 1 },
  { component = "cargo", size = "M", x = 5, y = 1, rotation = 1 },
  { component = "tank", size = "S", x = 8, y = 1 },
  { component = "life_support", size = "S", x = 9, y = 1 },
  { component = "turret_mount", size = "S", x = 11, y = 1 },
  { component = "turret_mount", size = "S", x = 14, y = 1 },
  { component = "cargo", size = "S", x = 15, y = 1, rotation = 1 },
  { component = "escape_pod", size = "S", x = 12, y = 0, rotation = 2 },
]
conduits = [
  [[8, 4], [9, 4]],
  [[14, 4], [15, 4]],
  [[11, 2], [14, 2]],
  [[3, 1], [11, 1]],
  [[3, 1], [3, 4]],
  [[8, 4], [8, 5]],
  [[9, 1], [9, 4]],
  [[11, 1], [11, 4]],
  [[14, 1], [14, 4]],
  [[16, 2], [16, 3]],
]
edge_conduits = [ [[8, 1], [8, 5]] ]
pipes = [
  [[3, 4], [4, 4]],
  [[3, 1], [4, 1]],
  [[4, 1], [4, 4]],
]
edge_pipes = [ [[4, 1], [10, 1]] ]
# A thin wall closes the hold and engineering off from the walkway (x 7 | 8), with a door at y 3. A
# conduit runs in it, so the engines stay powered with the door shut. The bridge stays open to the
# reactor room forward: a wall there (x 10 | 11) slowed the crew to a shorted reactor so much that the
# First Play raider gave up in half the time (FirstHourBalanceBenchmark).
edge_walls = [ { path = [[8, 1], [8, 5]], weight_class = "MEDIUM" } ]
doors = [ { x = 8, y = 3, side = "LEFT" } ]
# Carpet through the crew spaces, so a fire here has something to burn
coverings = [ { covering = "CARPET", x = 9, y = 1, width = 6, height = 4 } ]
lights = [
  { x = 4, y = 1, side = "BOTTOM" },
  { x = 13, y = 1, side = "BOTTOM" },
  { x = 4, y = 4, side = "TOP" },
  { x = 8, y = 4, side = "LEFT" },
]
# RCS: a quad block at each corner turns the ship, a linear pair amidships (over the centre of
# mass) strafes it, and a linear pair on the bow either side of the centreline backs it up.
rcs = [
  { x = 3, y = 5, side = "TOP", kind = "QUAD" },
  { x = 3, y = 0, side = "BOTTOM", kind = "QUAD" },
  { x = 16, y = 5, side = "TOP", kind = "QUAD" },
  { x = 16, y = 0, side = "BOTTOM", kind = "QUAD" },
  { x = 10, y = 5, side = "TOP", kind = "LINEAR" },
  { x = 10, y = 0, side = "BOTTOM", kind = "LINEAR" },
  { x = 17, y = 2, side = "RIGHT", kind = "LINEAR" },
  { x = 17, y = 3, side = "RIGHT", kind = "LINEAR" },
]


