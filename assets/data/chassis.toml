# The audio demo's ship (the audio demo and its scenario load it): a hull laid out to show everything
# that changes how a sound is heard aboard. Never sold or flown by anyone else.
#   - Engineering aft (x 3-9): engines, reactor, life support, tanks, behind a thick full-tile wall (x 10)
#     with one doorway and a door in it, so a sound through it can be heard against one through a thin wall.
#   - A corridor (y 5-6) runs forward with a door into each room off it.
#   - Above it, crew quarters (carpeted, so a fire there has fuel) and the bridge, with a thin wall
#     between them and no door: heard through the wall, or round by the corridor.
#   - Below it, the hold and the vacuum lab, whose door starts shut: vent the lab to hear its sounds
#     lose their high end and fade as the air goes.
#   - Forward (x 23-26), the turret room under a Small docking port, behind a bulkhead with a door.
