name = "Ion Cannon Mk1"
price = 40000.0
mount = "turret"
min_mount_size = "S"
slew_rate_deg = 60
firing_arc_deg = 270
cooldown = 2.0
power_draw = 1.5e6
projectile = "ion_bolt"
spread_rad = 0.001
max_range = 3500.0
sound = "evt_ion_fire"

