# Weapon family from combat-sys design section 6. combat-sys owns the classes
# (WeaponDef, ProjectileDef, MissileDef, WarheadDef) and binds them with
# defs.registerType("weapon", WeaponDef.class) etc.

[weapon.railgun_mk1]
mount = "turret"
slew_rate_deg = 40
firing_arc_deg = 270
cooldown = 1.5
power_draw = 2.0e6
projectile = "slug_tungsten_20kg"
sound = "evt_railgun_fire"

[projectile.slug_tungsten_20kg]
mass = 20.0
muzzle_speed = 6000.0
damage_type = "kinetic"
penetration_factor = 1.0
ricochet_angle_deg = 72
ricochet_restitution = 0.6
spall = { count = 6, angle_deg = 25, fraction = 0.3 }
max_lifetime = 30.0

[missile.harpoon]
dry_mass = 150.0
propellant_mass = 250.0
exhaust_velocity = 3000.0
max_thrust = 60000.0
turn_rate_deg = 90
seeker = { type = "radar", fov_deg = 30, range = 20000, discrimination = 0.6 }
nav_gain = 4.0
terminal_reserve = 0.3
arming_delay = 0.6
fuse = { type = "proximity", radius = 15 }
warhead = "frag_heavy"

[warhead.frag_heavy]
fragment_count = 40
fragment_mass = 0.2
fragment_cone_deg = 60
blast_radius_tiles = 3
blast_damage = 400000.0
