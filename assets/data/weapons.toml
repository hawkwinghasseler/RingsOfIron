name = "Breaching Cannon"
price = 55000.0
mount = "turret"
min_mount_size = "M"
slew_rate_deg = 35
firing_arc_deg = 240
cooldown = 2.0
power_draw = 1.0e5
projectile = "breach_shell"
spread_rad = 0.0015
max_range = 3000.0
sound = "evt_breacher_fire"

