# Weapon family from combat-sys design section 6. combat-sys owns the classes
# (WeaponDef, ProjectileDef, MissileDef, WarheadDef) and binds them with
# defs.registerType("weapon", WeaponDef.class) etc.
#
# Ships mount weapons through their hardpoints (ships.toml). Turrets aim at the
# ship's locked target; point_defense mounts pick their own targets, the most
# urgent incoming missile; launchers throw guided missiles at the locked target,
# magazine of them (0 or left out: no limit), cooldown seconds apart;
# beams burn beam_power watts into whatever they touch for beam_duration seconds.
# price is what a new one costs at a station yard's refit (a used one half that).
# min_mount_size (S, M, L or XL) is the weapon's size: the smallest turret mount it fits.
#
# Speed against damage: within a size, a gun's sustained muzzle power (round energy / cooldown)
# times its muzzle speed is at most WeaponDef.speedBudget(size): 1.8e10 W*m/s for Small, times the
# mount's tiles for bigger ones (4 Medium, 9 Large, 25 Extra Large). A fast round is easy to land at
# range but its gun does less damage; a slow cannon is hard to land from afar and wins a brawl. Fast
# guns also fire slowly, so each shot still carries enough to punch a hull. DataDefsTest holds every
# gun to it. Mk2s keep their Mk1's round and budget, and are better mounts: they slew faster, hold
# tighter and draw less power. Projectile ids are kept from before the rule so saves still load.

# Small: 0.67 kg at 6 km/s, 12 MJ every 4 s (3 MW). It hits at any range and loses a brawl.
[weapon.railgun_mk1]
name = "Railgun Mk1"
price = 60000.0
mount = "turret"
min_mount_size = "S"
slew_rate_deg = 40
firing_arc_deg = 270
cooldown = 4.0
power_draw = 7.5e5
projectile = "slug_tungsten_20kg"
spread_rad = 0.0005
sound = "evt_railgun_fire"

