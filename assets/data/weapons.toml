# Point defense that bursts near a missile rather than having to strike it: its shells are
# proximity fused, so each one that passes within 25 m of a missile takes it. Slower and
# shorter-ranged than the autocannon, and little use against a hull.
[weapon.flak_mk1]
name = "Flak Gun Mk1"
price = 16000.0
mount = "turret"
slew_rate_deg = 140
firing_arc_deg = 300
cooldown = 0.35
power_draw = 4.0e4
projectile = "flak_shell"
spread_rad = 0.006
point_defense = true
max_range = 3000.0
sound = "evt_flak_fire"

# Two tubes of light darts for a small ship's one mount: half the reach of a harpoon and a
# lighter warhead, but quicker to reload.
[weapon.dart_rack]
name = "Dart Rack"
price = 15000.0
mount = "launcher"
firing_arc_deg = 360
cooldown = 4.0
missile = "dart"
max_range = 8000.0
sound = "evt_missile_launch"

# A gunship's or frigate's spinal-weight gun: a 60 kg slug, three times the railgun's, on a
# mount of Medium or bigger. It drinks power: 9 MJ a shot.
[weapon.railgun_heavy]
name = "Heavy Railgun"
price = 140000.0
mount = "turret"
min_mount_size = "M"
slew_rate_deg = 20
firing_arc_deg = 200
cooldown = 3.0
power_draw = 3.0e6
projectile = "slug_tungsten_60kg"
spread_rad = 0.0004
sound = "evt_railgun_heavy_fire"

# Ion bolts break nothing: each one that lands stuns the systems within two tiles of where it
# struck for 10 to 30 s, so a ship can be stopped and boarded without wrecking it. A shield
# soaks a bolt as often as it takes its share of one.
[weapon.ion_mk1]
name = "Ion Cannon Mk1"
price = 40000.0
mount = "turret"
slew_rate_deg = 60
firing_arc_deg = 270
cooldown = 2.0
power_draw = 1.5e6
projectile = "ion_bolt"
spread_rad = 0.001
max_range = 3500.0
sound = "evt_ion_fire"

