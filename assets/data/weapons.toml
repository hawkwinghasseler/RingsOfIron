# Ion bolts break nothing: each one that lands stuns the systems within two tiles of where it
# struck for 10 to 30 s, so a ship can be stopped and boarded without wrecking it. A shield
# soaks a bolt as often as it takes its share of one, but the bolt strips the cloud where it lands
# (some 56 kg here), and stunned emitters drop their share: both come back, neither is lost.
