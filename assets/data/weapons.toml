# Weapon family from combat-sys design section 6. combat-sys owns the classes
# (WeaponDef, ProjectileDef, MissileDef, WarheadDef) and binds them with
# defs.registerType("weapon", WeaponDef.class) etc.
#
# Ships mount weapons through their hardpoints (ships.toml). Turrets aim at the
# ship's locked target; point_defense mounts pick their own targets, the most
# urgent incoming missile; launchers throw guided missiles at the locked target;
# beams burn beam_power watts into whatever they touch for beam_duration seconds.
# price is what a new one costs at a station yard's refit (a used one half that).
# min_mount_size (S, M, L or XL) is the smallest turret mount it fits; leave it out for any.
# rare = true: yards never sell it new; it only comes off a beaten ace (see loadouts.toml).

[weapon.railgun_mk1]
name = "Railgun Mk1"
price = 60000.0
mount = "turret"
slew_rate_deg = 40
firing_arc_deg = 270
cooldown = 1.5
power_draw = 2.0e6
projectile = "slug_tungsten_20kg"
spread_rad = 0.0005
sound = "evt_railgun_fire"

[weapon.autocannon_mk1]
name = "Autocannon Mk1"
price = 12000.0
mount = "turret"
slew_rate_deg = 120
firing_arc_deg = 300
cooldown = 0.1
power_draw = 5.0e4
projectile = "autocannon_30mm"
spread_rad = 0.003
point_defense = true
max_range = 4000.0
sound = "evt_autocannon_fire"

[weapon.chaingun_mk1]
name = "Chaingun Mk1"
price = 18000.0
