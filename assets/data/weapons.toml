mount = "turret"
slew_rate_deg = 90
firing_arc_deg = 270
cooldown = 0.15
power_draw = 4.0e4
projectile = "autocannon_30mm"
spread_rad = 0.002
max_range = 3000.0
sound = "evt_autocannon_fire"

[weapon.harpoon_launcher]
