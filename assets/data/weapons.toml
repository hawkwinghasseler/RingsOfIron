# Medium, a crew killer: a 20 kg shell at 1.2 km/s (14 MJ) every 2 s (7 MW, well inside its budget,
# since its charge does what its joules don't). Its delayed fuse sets it off one tile inside the hull:
# overpressure through the pressurized room behind the armor and a spray of fragments. Venting the
# compartment first, or a heavy hull that stops the shell at the skin, keeps it outside.
