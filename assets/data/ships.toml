# Spawnable ships: EntityFactory.spawnShip("<id>", x, y, angle).
# A ship collides on its chassis layout (every tile that is not void, wedges as triangles), or
# on the collision layer of its hull art, art/hulls/<chassis>.svg, when that has one. A `hull`
# polygon here is only used by a ship without a chassis.
# max_thrust is the main engine of a ship with no engines in its layout. A ship with engines
# gets its thrust from them instead (thrust in components.toml), so the values below for the
# corvette and hauler only restate what their engines give.

[ship.corvette_patrol]
name = "Patrol Corvette"
chassis = "corvette"
texture = "tex_corvette"
mass = 120000.0
max_thrust = 2.4e6
max_torque = 8.0e5
# The aft 2 m are the engines, then 4 m of cargo hold. Collides on the collision
# layer of its hull art (art/hulls/corvette.svg), which adds the bow past the end
# of the layout
crew = 4
# Railgun in the nose, a point-defense autocannon on each beam, a missile launcher on top
# and a laser below. Each hardpoint sits on the center of its turret mount in the
# corvette chassis, so the turret is drawn over the mount it is wired to.
hardpoints = [
  { weapon = "railgun_mk1", x = 3.5, y = -0.5, rotation = 0.0 },
  { weapon = "autocannon_mk1", x = 1.5, y = 1.5, rotation = 90.0 },
  { weapon = "autocannon_mk1", x = 1.5, y = -1.5, rotation = -90.0 },
  { weapon = "harpoon_launcher", x = -1.5, y = 1.5, rotation = 90.0 },
  { weapon = "laser_mk1", x = -1.5, y = -1.5, rotation = -90.0 },
]

[ship.freighter_hauler]
name = "Hauler"
chassis = "freighter"
texture = "tex_freighter"
mass = 300000.0
max_thrust = 3.0e6
max_torque = 1.5e6
crew = 3
