# Spawnable ships: EntityFactory.spawnShip("<id>", x, y, angle).
# A ship collides on its chassis layout (every tile that is not void, wedges as triangles), or
# on the collision layer of its hull art, art/hulls/<chassis>.svg, when that has one. A `hull`
# polygon here is only used by a ship without a chassis.
# max_thrust is the main engine of a ship with no engines in its layout. A ship with engines
# gets its thrust from them instead (thrust in components.toml), so the values below for the
# corvette and hauler only restate what their engines give.
# exhaust_velocity: the warships' drives run at 700 km/s (round 3 integration), so a corvette's
# tanks give about 7 km/s, enough for a transfer to the Moon and a capture there; at the 100 km/s
# left out elsewhere they gave about 1 km/s and the Moon was out of reach.

[ship.corvette_patrol]
name = "Patrol Corvette"
chassis = "corvette"
texture = "tex_corvette"
# What it weighs in the bubble with full tanks: its layout's 96 tiles at 2 t each (materials.toml's medium
# steel, floors included), its 4 thin walls at 0.5 t, and about 3.1 t in its tanks. A ship with a layout
# weighs its layout, so this figure only stands in for it (round 9: it said 120 t)
mass = 197100.0
max_thrust = 2.4e6
max_torque = 8.0e5
exhaust_velocity = 700000.0
# The aft 2 m are the engines, then 4 m of cargo hold. Collides on the collision
# layer of its hull art (art/hulls/corvette.svg), which adds the bow past the end
# of the layout
crew = 4
# Railgun in the nose, a point-defense autocannon on each beam, a missile launcher on top
# and a laser below. Each hardpoint sits on the center of its turret mount in the
# corvette chassis, so the turret is drawn over the mount it is wired to.
hardpoints = [
  { weapon = "railgun_mk1", x = 3.5, y = -0.5, rotation = 0.0 },
  { weapon = "autocannon_mk1", x = 1.5, y = 1.5, rotation = 90.0 },
  { weapon = "autocannon_mk1", x = 1.5, y = -1.5, rotation = -90.0 },
  { weapon = "harpoon_launcher", x = -1.5, y = 1.5, rotation = 90.0 },
  { weapon = "laser_mk1", x = -1.5, y = -1.5, rotation = -90.0 },
]

# The First Play raider: a patrol corvette the pirates took and refitted. The railgun in the
# nose is gone for a chaingun; it keeps the laser, the launcher and point defense. It can hurt
# the player's corvette but is outgunned by it.
[ship.corvette_raider]
name = "Pirate Corvette"
chassis = "corvette"
texture = "tex_corvette"
# What it weighs in the bubble with full tanks: its layout's 96 tiles at 2 t each and 4 thin walls at
# 0.5 t, as the patrol corvette's, and about 3.1 t in its tanks. A ship with a layout weighs its layout, so
# this figure only stands in for it (round 9: it said 120 t)
mass = 197100.0
max_thrust = 2.4e6
max_torque = 8.0e5
exhaust_velocity = 700000.0
crew = 4
hardpoints = [
  { weapon = "chaingun_mk1", x = 3.5, y = -0.5, rotation = 0.0 },
  { weapon = "autocannon_mk1", x = 1.5, y = 1.5, rotation = 90.0 },
  { weapon = "autocannon_mk1", x = 1.5, y = -1.5, rotation = -90.0 },
  { weapon = "harpoon_launcher", x = -1.5, y = 1.5, rotation = 90.0 },
  { weapon = "laser_mk1", x = -1.5, y = -1.5, rotation = -90.0 },
]

