# Furnishings: furniture and decor a station's yard sells from the yard window (Y, Furnish) and its
# loaders carry aboard and set down exactly where the player puts it: anywhere on open floor, at any
# angle, clear of walls, systems and other furnishings. Each one belongs to the tile its middle is
# over, and burns with that tile's covering when a fire takes the tile; burned past a tenth of its
# fuel, it is gone. The crew use them in their downtime: an idle crew member at home goes to one
# with room and uses it, and their morale rises by relax an hour (up to the steady morale's
# ceiling; see CrewCareer).
#
#   name    shown in the yard and in notices
#   art     the region it draws with; drawn at rotation 0 with its back toward +y (the top of
#           the SVG) and its front toward -y
#   width   size across, tiles (x at rotation 0)
#   depth   size front to back, tiles (y at rotation 0)
#   fuel    combustible mass, kg: what a fire on its tile burns (a tile of carpet is 1.5 kg, and burns
#           out in a few minutes)
#   price   credits new
#   use     LOUNGE, GAME, MUSIC, SCREEN, EXERCISE, READING, or DECOR (the crew don't use it)
#   seats   how many crew can use it at once
#   relax   morale an hour of use gives, 0 to 1
#   verb    what a crew member using it is doing (the crew window shows it)
#   flat    lies flat on the floor (a rug): other furnishings can stand on it

[furnishing.couch]
name = "Couch"
art = "decor/couch"
width = 1.5
depth = 0.75
fuel = 6.0
price = 900.0
use = "LOUNGE"
seats = 3
relax = 0.04
verb = "lounging on the couch"

