[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-audio-spatial'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api project(':core-engine')
  api project(':physics-exterior')
  api project(':interior-grid')
  // FMOD Studio bindings. FMOD's own libraries are not on Maven; see FmodAudioBackend.
  implementation "org.lwjgl:lwjgl:$lwjgl3Version"
  implementation "org.lwjgl:lwjgl-fmod:$lwjgl3Version"
  // OpenAL Soft, the same OpenAL libGDX's desktop backend plays through; see OpenAlAudioBackend.
  implementation "org.lwjgl:lwjgl-openal:$lwjgl3Version"

  testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // OpenAL Soft natives, so the OpenAL backend's tests render through a real (loopback) device
  ["natives-linux", "natives-linux-arm64", "natives-windows", "natives-macos", "natives-macos-arm64"].each {
    testRuntimeOnly "org.lwjgl:lwjgl:$lwjgl3Version:$it"
    testRuntimeOnly "org.lwjgl:lwjgl-openal:$lwjgl3Version:$it"
  }
}

test {
  useJUnitPlatform()
}
