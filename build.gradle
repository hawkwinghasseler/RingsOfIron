allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  apply plugin: 'groovy'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // Every warning but this-escape (constructors handing out `this`, which the ECS wiring does on
    // purpose) fails the build, so the code stays as clean as it is
    options.compilerArgs += ['-Xlint:all,-this-escape', '-Werror']
  }

  // One JUnit for every module; each names its JUnit artifacts without a version
  dependencies {
    testImplementation platform("org.junit:junit-bom:$junitVersion")
  }

  // Tests tagged @Tag("slow") (whole careers, surveys, replays played twice) stay out of test and
  // build so they don't slow every run. ./gradlew slowTest runs only them, and -PallTests puts
  // them back into test. CI runs neither: they are tools to run by hand.
  def slowTest = tasks.register('slowTest', Test) {
    group = 'verification'
    description = 'Runs the tests tagged slow: whole careers, surveys and replays.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter 'test'
  }
  // Tests tagged @Tag("playtest") are balance benchmarks: targets tuned on the scripted career, for
  // a human tester to weigh against play by hand (documentation/playtest/). No build, test, slowTest
  // or CI job runs them, not even with -PallTests. ./gradlew playtestBenchmark runs them, writing a
  // table per benchmark to <module>/build/playtest/; one off target is reported, not a broken build.
  def playtestBenchmark = tasks.register('playtestBenchmark', Test) {
    group = 'verification'
    description = 'Runs the balance benchmarks tagged playtest, for a human tester (documentation/playtest/).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    ignoreFailures = true
    // Every run measures afresh, even when nothing changed
    outputs.upToDateWhen { false }
  }
  // On CI (which sets CI=true), each test has 30 seconds to do its one thing: a test that needs
  // longer is playing out a stretch of the game instead of checking a moment, and belongs with the
  // slow tests a person runs by hand. Runs by hand, with -PcareerSeeds and the like, have no budget.
  def testBudget = 'junit.jupiter.execution.timeout.testable.method.default'
  // After the module's own test block, so its JUnit setup, properties and logging are in place
  afterEvaluate {
    def test = tasks.named('test').get()
    test.useJUnitPlatform {
      if (!project.hasProperty('allTests')) excludeTags 'slow'
      excludeTags 'playtest'
    }
    // The slow tests and benchmarks take the test task's properties, but never its budget
    def handRun = test.systemProperties.findAll { it.key != testBudget }
    if (System.getenv('CI') && !project.hasProperty('allTests')) test.systemProperty testBudget, '30 s'
    slowTest.configure {
      useJUnitPlatform {
        includeTags 'slow'
        excludeTags 'playtest'
      }
      systemProperties handRun
      jvmArgs test.jvmArgs
      environment test.environment
      maxHeapSize = test.maxHeapSize
      testLogging.showStandardStreams = test.testLogging.showStandardStreams
      testLogging.quiet.events = test.testLogging.quiet.events
      testLogging.quiet.exceptionFormat = test.testLogging.quiet.exceptionFormat
    }
    playtestBenchmark.configure {
      useJUnitPlatform { includeTags 'playtest' }
      systemProperties handRun
      jvmArgs test.jvmArgs
      environment test.environment
      maxHeapSize = test.maxHeapSize
      // The tables print as each benchmark finishes
      testLogging.showStandardStreams = true
      testLogging.quiet.events 'failed'
      testLogging.quiet.exceptionFormat 'full'
    }
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'RingsOfIron'
  repositories {
    mavenCentral()
  }
}

eclipse.project.name = 'RingsOfIron'
