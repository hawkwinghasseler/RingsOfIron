eclipse.project.name = appName + '-benchmarks'

// Headless benchmark scenes of the whole game: tick time per system as the universe fills up.
dependencies {
  implementation project(':core')
  runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  runtimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"

  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
  systemProperty 'ringsofiron.assets', "${rootDir}/assets"
}

// ./gradlew :benchmarks:runBenchmark            every scene at its default sizes
// ./gradlew :benchmarks:runBenchmark -Pscene=orbit -Pframes=3600   (scenes: orbit, warp, docked, all)
tasks.register('runBenchmark', JavaExec) {
  group = 'application'
  description = 'Runs the headless benchmark scenes and prints tick time per system.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.ringsofiron.benchmarks.BenchmarkMain'
  systemProperty 'ringsofiron.assets', "${rootDir}/assets"
  args = [project.findProperty('scene') ?: 'all', project.findProperty('frames') ?: '1200']
  jvmArgs = ['-Xmx2g']
  // -Pjfr records a Java Flight Recording of the run to benchmarks/build/benchmark.jfr
  if (project.hasProperty('jfr')) jvmArgs += ["-XX:StartFlightRecording=filename=${buildDir}/benchmark.jfr,settings=profile", "-XX:FlightRecorderOptions=stackdepth=256"]
}
