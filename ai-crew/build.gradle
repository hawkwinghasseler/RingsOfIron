eclipse.project.name = appName + '-ai-crew'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api project(':core-engine')
  api project(':interior-grid')
  api project(':physics-exterior')
}


dependencies {
  testImplementation "org.junit.jupiter:junit-jupiter-api"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // Box2D's native library, so the pilot test can fly a real physics body without a window.
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

test {
  useJUnitPlatform()
}

// Prints a headless run of the crew scenario to the console.
tasks.register('runCrewConsoleDemo', JavaExec) {
  group = 'application'
  description = 'Runs the ai-crew scenario headless and prints the ship as text.'
  mainClass = 'com.ringsofiron.aicrew.demo.CrewConsoleDemo'
  classpath = sourceSets.main.runtimeClasspath
}
