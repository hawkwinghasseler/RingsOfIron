eclipse.project.name = appName + '-interior-grid'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api project(':core-engine')
  api project(':modding-data')

  // The game's data, to check the chassis defs against the real blueprint loader (InteriorGridDataTest)
  testImplementation testFixtures(project(':modding-data'))
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
}

